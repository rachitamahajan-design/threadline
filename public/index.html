        ${byKind("risk").length ? `<div class="card"><h2>Risks</h2>${byKind("risk").map((c) => `
          <div class="claim">${esc(c.body.category)} · <span class="t-meta">"${esc(c.body.quote)}"</span></div>`).join("")}</div>` : ""}
        ${backlinks.length ? `<div class="card"><h2>Threaded to</h2>${backlinks.map((b) => `

        <div class="exit-line">Run exit: <span class="pill ${meeting.exit === "shipped" ? "pass" : "block"}">${esc(meeting.exit ?? "…")}</span>

  const deepLink = state.deepLink;
  if (deepLink != null) {
    state.deepLink = null;
    panelState.tab = "transcript";
    if (!panelState.open) {
      panelState.open = true;
      localStorage.setItem("tl-panel", "open");
      main.querySelector(".workspace").classList.remove("collapsed");
      document.getElementById("panel-reopen")?.remove();
    }
    main.querySelectorAll(".panel-tab").forEach((x) => x.classList.toggle("active", x.dataset.tab === "transcript"));
  }
  renderPanel();
  if (deepLink != null) setTimeout(() => jumpToOffset(deepLink), 60);
  main.querySelectorAll(".panel-tab").forEach((t) =>
    t.addEventListener("click", () => {
      panelState.tab = t.dataset.tab;

    const before = domToMd(doc);
    const out = await fetch("/api/notes/structure", { method: "POST", body: JSON.stringify({ id, notes: before }) }).then((r) => r.json());
    btn.disabled = false; btn.textContent = "☰ Structure my notes";
    if (out.error) return alert(out.error);
    applyNotesUpdate(doc, id, before, out.notes, "Notes structured");

  });

  // Chat

  // Overflow menu (regenerate / file / advanced correct)
  $("#more").addEventListener("click", async () => {
    const pick = prompt("1. Regenerate extraction\n2. Tag topic…\n3. Advanced find & replace…\n4. Delete meeting", "1");
    if (pick === "1") {
      const out = await fetch("/api/meeting/regenerate", { method: "POST", body: JSON.stringify({ id }) }).then((r) => r.json());
      if (out.error) return alert(out.error);
      renderMeeting(id);
    } else if (pick === "2") {
      const projects = await api("/api/projects");
      if (!projects.length) return alert("No topics yet — create one with + in the sidebar first.");
      const p = projects[Number(prompt("Tag this meeting with which topic?\n" + projects.map((x, i) => `${i + 1}. ${x.name}`).join("\n"), "1")) - 1];
      if (!p) return;
      await fetch("/api/project/assign", { method: "POST", body: JSON.stringify({ project_id: p.id, meeting_id: id }) });
      loadSidebar();
    } else if (pick === "4") {
      if (!confirm("Delete this meeting and its notes, transcript and threads? This cannot be undone.")) return;
      await fetch("/api/meeting/delete", { method: "POST", body: JSON.stringify({ id }) });
      state.meetingId = null; state.view = "today"; render();
    } else if (pick === "3") {
      const from = prompt("Find:", ""); if (!from?.trim()) return;

      if (!occurrences?.length) return alert("No occurrences found.");
      correctionModal(id, from.trim(), to.trim(), occurrences);
    }
  });

  wireCorrections(id);
  state.highlight = null;
}

/** Replace the notes doc with an AI result — guarded against mid-flight typing. */
function applyNotesUpdate(doc, meetingId, beforeMd, newMd, toastMsg) {
  const currentMd = domToMd(doc);
  if (currentMd !== beforeMd && !confirm("You edited the notes while AI was working. Replace with the AI version?")) return;
  doc.innerHTML = mdToDom(newMd);
  doc.dataset.lastSaved = newMd;
  doc.classList.remove("flash"); void doc.offsetWidth; doc.classList.add("flash");
  if (toastMsg) showToast(toastMsg);
}

/** Person-mapping suggestions from Structure → one-click corrections. */
function renderPeopleChips(meetingId, people) {
  const box = $("#people-chips");
  if (!box) return;
  const useful = people.filter((p) =>
    p.inferred_name && p.heard_as &&
    p.inferred_name !== p.heard_as &&
    !["them", "you", "unidentified speaker"].includes(p.inferred_name.toLowerCase()) &&
    !["them", "you"].includes(p.heard_as.toLowerCase()));
  box.innerHTML = useful.map((p, i) => `
    <button class="people-chip" data-i="${i}">“${esc(p.heard_as)}” is <b>${esc(p.inferred_name)}</b>${p.team ? ` · ${esc(p.team)}` : ""} — fix everywhere</button>`).join("");
  box.querySelectorAll(".people-chip").forEach((chip) =>
    chip.addEventListener("click", async () => {
      const p = useful[Number(chip.dataset.i)];
      const out = await fetch("/api/correction/auto", {
        method: "POST",
        body: JSON.stringify({ meeting_id: meetingId, from_text: p.heard_as, to_text: p.inferred_name }),
      }).then((r) => r.json());
      chip.remove();
      if (out.error) return alert(out.error);
      showToast(`Fixed ${out.applied} place${out.applied === 1 ? "" : "s"}`, "Undo", async () => {
        await fetch("/api/correction/undo", { method: "POST", body: JSON.stringify({ event_id: out.eventId }) });
        renderMeeting(meetingId);
      });
      renderMeeting(meetingId);
    }));
}

/** Autosave + word-swap detection: fixing a name in your notes fixes it everywhere. */
function wireNotesEditor(meetingId, doc) {
  doc.dataset.lastSaved = domToMd(doc);
  let t;
  doc.addEventListener("input", () => {
    doc.classList.toggle("is-empty", !doc.textContent.trim());
    clearTimeout(t);
    t = setTimeout(async () => {
      const md = domToMd(doc);
      const last = doc.dataset.lastSaved ?? "";
      if (md === last) return;
      doc.dataset.lastSaved = md;
      await fetch("/api/notes", { method: "POST", body: JSON.stringify({ id: meetingId, notes: md }) });
      const swap = detectWordSwapClient(last, md);
      if (swap) {
        const out = await fetch("/api/correction/auto", {
          method: "POST",
          body: JSON.stringify({ meeting_id: meetingId, from_text: swap.from, to_text: swap.to, exclude: { notes: true } }),
        }).then((r) => r.json());
        if (out.applied > 0)
          showToast(`“${swap.from}” → “${swap.to}” · fixed ${out.applied} other place${out.applied === 1 ? "" : "s"}`, "Undo", async () => {
            await fetch("/api/correction/undo", { method: "POST", body: JSON.stringify({ event_id: out.eventId }) });
            renderMeeting(meetingId);
          });
      }
    }, 700);
  });
  // Paste as plain text; checkboxes save on toggle; tidy markdown on blur.
  doc.addEventListener("paste", (e) => {
    e.preventDefault();
    document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
  });
  doc.addEventListener("change", (e) => {
    if (e.target?.type === "checkbox") doc.dispatchEvent(new Event("input"));
  });
  doc.addEventListener("blur", () => {
    const md = domToMd(doc);
    doc.innerHTML = mdToDom(md) || "<p><br></p>";
    doc.classList.toggle("is-empty", !doc.textContent.trim());
  });
}

/** Mirror of the server's detectWordSwap — one capitalized token run swapped. */
function detectWordSwapClient(before, after) {
  if (before === after || !before || !after) return null;
  if (Math.abs(before.length - after.length) > 40) return null;
  const a = before.split(/(\s+)/), b = after.split(/(\s+)/);
  let start = 0;
  while (start < a.length && start < b.length && a[start] === b[start]) start++;
  let endA = a.length - 1, endB = b.length - 1;
  while (endA >= start && endB >= start && a[endA] === b[endB]) { endA--; endB--; }
  const from = a.slice(start, endA + 1).join("").trim();
  const to = b.slice(start, endB + 1).join("").trim();
  if (!from || !to || from === to) return null;
  if (from.includes("\n") || to.includes("\n") || from.length > 40 || to.length > 40) return null;
  const w = (s) => s.split(/\s+/).filter(Boolean);
  if (w(from).length > 3 || w(to).length > 3) return null;
  if (!/^[A-Z]/.test(from) || !/^[A-Z]/.test(to)) return null;
  return { from, to };
}

/** Chat: grounded answers; asks that change the notes update the doc live. */
function wireChat(meetingId, doc) {
  const log = $("#chat-log"), input = $("#chat-input"), send = $("#chat-send");
  if (!input || input.disabled) return;
  const history = (chatHistory[meetingId] ??= []);
  const bubble = (role, text) => {
    const b = document.createElement("div");
    b.className = `chat-b ${role}`;
    b.innerHTML = esc(text).replace(/\[(\d+(?:\.\d+)?)s\]/g, (m, s) => `<button class="ts-chip" data-jump="${s}">${fmtTs(Number(s))}</button>`);
    log.appendChild(b);
    b.querySelectorAll("[data-jump]").forEach((c) => c.addEventListener("click", () => jumpToOffset(Number(c.dataset.jump))));
    return b;
  };
  for (const h of history) bubble(h.role === "user" ? "user" : "ai", h.content);
  const ask = async () => {
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    bubble("user", message);
    history.push({ role: "user", content: message });
    const thinking = bubble("ai thinking", "…");
    const before = domToMd(doc);
    const out = await fetch("/api/chat", {
      method: "POST",
      body: JSON.stringify({ meeting_id: meetingId, message, history: history.slice(0, -1), notes: before }),
    }).then((r) => r.json());
    thinking.remove();
    if (out.error) { bubble("ai", `⚠ ${out.error}`); return; }
    bubble("ai", out.answer);
    history.push({ role: "assistant", content: out.answer });
    if (out.notes) applyNotesUpdate(doc, meetingId, before, out.notes, "Notes updated from chat");
    log.scrollIntoView({ block: "end" });
  };
  send.addEventListener("click", ask);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
}

/** Click a transcript line to fix it; a name swap propagates everywhere. */
function wireTranscriptEdits(meetingId, body) {
  body.querySelectorAll(".utt .txt").forEach((el) =>
    el.addEventListener("click", () => {
      if (el.isContentEditable) return;
      const idx = Number(el.closest(".utt").dataset.idx);
      const original = el.textContent;
      el.contentEditable = "true";
      el.focus();
      const done = async (save) => {
        el.contentEditable = "false";
        const text = el.textContent.trim();
        if (!save || text === original || !text) { el.textContent = original; return; }
        const out = await fetch("/api/utterance/edit", {
          method: "POST",
          body: JSON.stringify({ meeting_id: meetingId, idx, text }),
        }).then((r) => r.json());
        if (out.error) { alert(out.error); el.textContent = original; return; }
        if (out.correction?.applied > 0)
          showToast(`“${out.correction.from}” → “${out.correction.to}” · fixed ${out.correction.applied} other place${out.correction.applied === 1 ? "" : "s"}`, "Undo", async () => {
            await fetch("/api/correction/undo", { method: "POST", body: JSON.stringify({ event_id: out.correction.eventId }) });
            renderMeeting(meetingId);
          });
      };
      el.addEventListener("blur", () => done(true), { once: true });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); el.blur(); }
        if (e.key === "Escape") { done(false); }
      });
    }));
}

function jumpToOffset(off) {
  let best = null, bestD = Infinity;
  main.querySelectorAll(".utt[data-off]").forEach((u) => {
    const d = Math.abs(Number(u.dataset.off) - off);
    if (d < bestD) { bestD = d; best = u; }
  });
  if (best) {
    best.scrollIntoView({ behavior: "smooth", block: "center" });
    best.classList.add("hl");
    setTimeout(() => best.classList.remove("hl"), 2500);
  }
}

/** SSE live transcript into the side panel. */
function wireLiveFeed() {
  const feed = $("#live-feed"), statusBox = $("#live-status");
  if (!feed) return;
  const partials = {};
  evtSource?.close();
  evtSource = new EventSource("/api/record/events");
  evtSource.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    if (e.type === "status") {
      if (statusBox) statusBox.textContent = e.message;
    } else if (e.type === "partial") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      let el = partials[e.speaker];
      if (!el) {
        feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="who">${e.speaker}</div><div class="live-partial"></div></div>`);
        el = partials[e.speaker] = feed.lastElementChild;
      }
      el.querySelector(".live-partial").textContent = e.text;
      el.scrollIntoView({ block: "end" });
    } else if (e.type === "final") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      const el = partials[e.speaker];
      if (el) { delete partials[e.speaker]; el.remove(); }
      feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="ts">${fmtTs(e.offsetS)}</div><div class="who">${e.speaker}</div><div>${esc(e.text)}</div></div>`);
      feed.lastElementChild.scrollIntoView({ block: "end" });
    }
  };
}

/** Structured summary document; falls back to the flat one-paragraph summary. */
function summaryCard(meeting) {
  const s = meeting.summary_json;
  if (!s) return meeting.summary ? `<div class="card" id="summary-card"><h2>Summary</h2><p>${esc(meeting.summary)}</p></div>` : "";
  const bullet = (b, path) => `
    <li><span class="sum-bullet ${b.grounded === false ? "ungrounded" : ""} ${b.edited ? "edited" : ""}" data-path="${path}" title="Click to edit">${esc(b.text)}</span>${
      typeof b.offset_s === "number" ? `<button class="ts-chip" data-jump="${b.offset_s}">${fmtTs(b.offset_s)}</button>` : ""
    }${b.grounded === false ? `<span class="unverified">unverified</span>` : ""}</li>`;
  const section = (sec, i) => `
    <div class="sum-sec"><h3>${esc(sec.title)}</h3>
      ${sec.bullets?.length ? `<ul>${sec.bullets.map((b, j) => bullet(b, `${i}.${j}`)).join("")}</ul>` : ""}
      ${(sec.subsections ?? []).map((sub, k) => `
        <h4>${esc(sub.title)}</h4>
        <ul>${sub.bullets.map((b, j) => bullet(b, `${i}.${k}.${j}`)).join("")}</ul>`).join("")}

  return `<div class="card" id="summary-card"><h2>Summary</h2>

    ${s.sections.map(section).join("")}

}

/** Timestamp chips jump to the transcript; bullets edit in place. */
function wireSummary(meetingId) {
  main.querySelectorAll("[data-jump]").forEach((chip) =>
    chip.addEventListener("click", () => {
      const off = Number(chip.dataset.jump);
      let best = null, bestD = Infinity;
      main.querySelectorAll(".utt[data-off]").forEach((u) => {
        const d = Math.abs(Number(u.dataset.off) - off);
        if (d < bestD) { bestD = d; best = u; }
      });
      if (best) {
        best.scrollIntoView({ behavior: "smooth", block: "center" });
        best.classList.add("hl");
        setTimeout(() => best.classList.remove("hl"), 2500);
      }
    }));
  main.querySelectorAll(".sum-bullet[data-path]").forEach((el) =>
    el.addEventListener("click", function onClick() {
      if (el.isContentEditable) return;
      const original = el.textContent;
      el.contentEditable = "true";
      el.focus();
      const done = async (save) => {
        el.contentEditable = "false";
        const text = el.textContent.trim();
        if (!save || text === original.trim() || !text) { el.textContent = original; return; }
        const out = await fetch("/api/summary/edit", {
          method: "POST",
          body: JSON.stringify({ meeting_id: meetingId, path: el.dataset.path, text }),
        }).then((r) => r.json());
        if (out.error) { alert(out.error); el.textContent = original; return; }
        el.classList.add("edited");
      };
      el.addEventListener("blur", () => done(true), { once: true });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); el.blur(); }
        if (e.key === "Escape") { el.removeEventListener("blur", done); done(false); }
      });
    }));
}

/** Select wrong text → "Correct →" → preview every occurrence → apply everywhere. */
let correctionMeetingId = null;
function wireCorrections(meetingId) {
  document.getElementById("correct-fab")?.remove();
  const alreadyWired = correctionMeetingId !== null;
  correctionMeetingId = meetingId;
  if (alreadyWired) return;
  main.addEventListener("mouseup", () => {
    setTimeout(() => {
      document.getElementById("correct-fab")?.remove();
      if (!state.meetingId) return;
      const sel = window.getSelection();
      const text = sel?.toString().trim();
      if (!text || text.length < 2 || text.length > 40 || text.includes("\n")) return;
      if (sel.anchorNode?.parentElement?.isContentEditable) return;
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      document.getElementById("fix-pop")?.remove();
      const pop = document.createElement("div");
      pop.id = "fix-pop";
      pop.innerHTML = `<span>Fix “${esc(text.length > 18 ? text.slice(0, 18) + "…" : text)}” →</span><input placeholder="correct spelling">`;
      pop.style.left = `${rect.left + window.scrollX}px`;
      pop.style.top = `${rect.bottom + window.scrollY + 6}px`;
      document.body.appendChild(pop);
      const inp = pop.querySelector("input");
      pop.addEventListener("mousedown", (e) => { if (e.target !== inp) e.preventDefault(); });
      inp.focus();
      inp.addEventListener("keydown", async (e) => {
        if (e.key === "Escape") return pop.remove();
        if (e.key !== "Enter") return;
        const to = inp.value.trim();
        pop.remove();
        if (!to || to === text) return;
        const out = await fetch("/api/correction/auto", {
          method: "POST",
          body: JSON.stringify({ meeting_id: correctionMeetingId, from_text: text, to_text: to }),
        }).then((r) => r.json());
        if (out.error) return alert(out.error);
        if (!out.applied) return showToast("Nothing to fix — no occurrences found");
        const mid = correctionMeetingId;
        showToast(`“${text}” → “${to}” · fixed ${out.applied} place${out.applied === 1 ? "" : "s"}`, "Undo", async () => {
          await fetch("/api/correction/undo", { method: "POST", body: JSON.stringify({ event_id: out.eventId }) });
          renderMeeting(mid);
        });
        renderMeeting(mid);
      });
      document.addEventListener("mousedown", function away(e) {
        if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener("mousedown", away); }
      });
    }, 0);
  });
}

const OCC_GROUPS = { summary: "Summary", claim: "Decisions & action items", utterance: "Transcript", node: "Graph", meeting_field: "Meeting fields" };

function correctionModal(meetingId, from, to, occurrences) {
  document.getElementById("correct-modal")?.remove();

  modal.innerHTML = `<div class="box">

          <span>${esc(o.snippet)}${o.match === "fuzzy" ? ` <span class="pill">similar: “${esc(o.token)}”</span>` : ""}</span>
        </label>`).join("")}`).join("")}

/**
 * Growth loop: a decision becomes a beautiful 1200x630 PNG card.
 * Rendered locally on canvas — nothing leaves the laptop.
 */
function shareDecisionCard(text, meeting, people) {
  const W = 1200, H = 630, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  // card base
  x.fillStyle = "#f3efe7"; x.fillRect(0, 0, W, H);
  x.strokeStyle = "#1d1b16"; x.lineWidth = 6; x.strokeRect(14, 14, W - 28, H - 28);
  // stitched top thread
  x.strokeStyle = "#5b74e0"; x.lineWidth = 2.5; x.lineCap = "round"; x.globalAlpha = 0.7;
  x.beginPath(); x.moveTo(60, 92); x.quadraticCurveTo(W / 2, 130, W - 60, 92); x.stroke();
  x.globalAlpha = 1;
  x.fillStyle = "#a39e94"; x.font = "600 22px -apple-system, system-ui";
  x.fillText("DECISION", 70, 68);
  // decision text, wrapped
  x.fillStyle = "#21201c"; x.font = "650 48px -apple-system, system-ui";
  const words = text.split(" ");
  let line = "", y = 210;
  for (const w of words) {
    if (x.measureText(line + " " + w).width > W - 160) { x.fillText(line, 70, y); y += 66; line = w; }
    else line = line ? line + " " + w : w;
  }
  x.fillText(line, 70, y);
  // meta
  x.fillStyle = "#6b675f"; x.font = "500 26px -apple-system, system-ui";

  x.fillStyle = "#a39e94"; x.font = "600 22px -apple-system, system-ui";
  x.fillText("stitched by Threadline", 256, H - 53);
  const a = document.createElement("a");

  a.href = c.toDataURL("image/png");
  a.click();
}

async function renderGraph() {
  const [{ nodes, edges }, meetingsList, topicBuckets] = await Promise.all([api("/api/graph"), api("/api/meetings"), api("/api/projects")]);
  const bucketNames = new Set(topicBuckets.map((t) => t.name.toLowerCase()));
  const meetById = Object.fromEntries(meetingsList.map((m) => [m.id, m]));
  // degree = how many meetings each person/topic touches, for the tooltip meta
  const meetingNeighbors = {};
  for (const e of edges) {
    for (const [a, b] of [[e.src, e.dst], [e.dst, e.src]]) {
      if (nodes.find((n) => n.id === b)?.kind === "meeting") (meetingNeighbors[a] ??= new Set()).add(b);
    }
  }
  const metaOf = (n) => {
    if (n.kind === "meeting") {
      const m = meetById[n.id];
      const people = (meetingNeighbors[n.id]?.size, edges.filter((e) => (e.src === n.id || e.dst === n.id) && e.kind === "attended").length);
      return m ? `${fmtDate(m.started_at)}${people ? ` · ${people} people` : ""}` : "";
    }
    const k = meetingNeighbors[n.id]?.size ?? 0;
    return `in ${k} meeting${k === 1 ? "" : "s"}`;
  };
  // Editorial cut: a knot earns its place by tying meetings together.
  // Fragment topics touching one meeting are noise, not memory.
  const topicDeg = (n) => meetingNeighbors[n.id]?.size ?? 0;
  const keptTopics = nodes
    .filter((n) => n.kind === "topic" && topicDeg(n) >= 2)
    .sort((a, b) => topicDeg(b) - topicDeg(a))
    .slice(0, 24);
  const keptIds = new Set([
    ...nodes.filter((n) => n.kind !== "topic").map((n) => n.id),
    ...keptTopics.map((n) => n.id),
  ]);
  const totalTopics = nodes.filter((n) => n.kind === "topic").length;
  const visible = nodes.filter((n) => keptIds.has(n.id));

  main.innerHTML = `<h1>Threads</h1>
    <div class="sub">${visible.filter((n) => n.kind === 'meeting').length} meetings · ${visible.filter((n) => n.kind === 'person').length} people · ${keptTopics.length} shared topic${keptTopics.length===1?'':'s'} (of ${totalTopics}). Drag to rotate · scroll to zoom · click a meeting to open it.</div>
    <div class="card" id="graph-wrap">
      <canvas id="graph"></canvas>
      <div id="graph-tip"></div>
      <input id="brain-q" placeholder="Spotlight… (word or name)" autocomplete="off">
      <div id="graph-ctl">
        <button id="gz-in" title="Zoom in">+</button>
        <button id="gz-out" title="Zoom out">−</button>
        <button id="gz-spin" title="Pause / play rotation">⏸</button>
      </div>
      <aside id="graph-panel"></aside>
    </div>
    <div class="legend">
      <span style="display:flex;align-items:center;gap:8px">
        <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.5" fill="var(--thread)"/><circle cx="11" cy="11" r="6.1" fill="none" stroke="#fff" stroke-width="1.1" stroke-dasharray="2 2.4" opacity=".55"/><path d="M7.6 8.4 L14.4 8.4 M7.6 13.6 L14.4 13.6" stroke="#fff" stroke-width="1.9" stroke-linecap="round" opacity=".95"/><circle cx="7.6" cy="8.4" r="1.3" fill="#33459c"/><circle cx="14.4" cy="8.4" r="1.3" fill="#33459c"/><circle cx="7.6" cy="13.6" r="1.3" fill="#33459c"/><circle cx="14.4" cy="13.6" r="1.3" fill="#33459c"/></svg>
        Meeting <i>· a button sewn to the cloth</i></span>
      <span style="display:flex;align-items:center;gap:8px">
        <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="6.4" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.6"/><circle cx="11" cy="11" r="2.4" fill="none" stroke="var(--ink-3)" stroke-width="1.1"/></svg>
        Person <i>· an eyelet</i></span>
      <span style="display:flex;align-items:center;gap:8px">
        <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="3.4" fill="var(--ink-3)"/><path d="M13.6 12.6 C 16 13.6, 17.6 12.2, 19 13.4" stroke="var(--ink-3)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".7"/></svg>
        Topic <i>· a knot with a loose end</i></span>
      <button class="copybtn" style="margin:0 0 0 auto" id="ctx-md">Copy context .md of selection</button></div>`;

  const canvas = $("#graph"), wrap = $("#graph-wrap"), tip = $("#graph-tip"), panel = $("#graph-panel");
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const INK = css.getPropertyValue("--ink").trim(), INK3 = css.getPropertyValue("--ink-3").trim(),
    THREAD = css.getPropertyValue("--thread").trim(), SURFACE = css.getPropertyValue("--surface").trim();


  const ns = visible.map((n, i) => ({
    ...n, label: n.meeting_title ?? n.label, meta: "",
    x: W / 2 + (n.kind === "meeting" ? 150 : n.kind === "person" ? 215 : 275) * Math.cos((i / visible.length) * 6.2832 + (n.kind === "topic" ? 0.9 : 0)),
    y: H / 2 + (n.kind === "meeting" ? 130 : n.kind === "person" ? 200 : 250) * Math.sin((i / visible.length) * 6.2832 + (n.kind === "topic" ? 0.9 : 0)),
    vx: 0, vy: 0, seed: (i * 2.399) % 6.2832,
    r: n.kind === "meeting" ? 18 : n.kind === "person" ? 11 : (bucketNames.has((n.label ?? "").toLowerCase()) ? 11 : 6) + 2.4 * Math.sqrt(meetingNeighbors[n.id]?.size ?? 1),
  }));
  ns.forEach((n) => { n.meta = metaOf(n); });
  const byId = Object.fromEntries(ns.map((n) => [n.id, n]));
  const es = edges.filter((e) => byId[e.src] && byId[e.dst]).map((e) => ({ a: byId[e.src], b: byId[e.dst], kind: e.kind }));
  let hover = null, selected = null, stopped = false;
  let spot = null; // Set of node ids under the spotlight, or null
  let qTimer;
  $("#brain-q").addEventListener("input", (e) => {
    clearTimeout(qTimer);
    const q = e.target.value.trim().toLowerCase();
    if (!q) { spot = null; return; }
    qTimer = setTimeout(async () => {
      const ids = new Set(ns.filter((n) => (n.label ?? "").toLowerCase().includes(q)).map((n) => n.id));
      try {
        for (const hit of await api(`/api/search?q=${encodeURIComponent(q)}`)) ids.add(hit.meeting_id);
      } catch (e) {}
      // a matched person or topic brings every meeting threaded to it —
      // "mentions Rahul" includes the meetings Rahul was simply in
      for (const e2 of es) {
        const aM = ids.has(e2.a.id) && e2.a.kind !== "meeting", bM = ids.has(e2.b.id) && e2.b.kind !== "meeting";
        if (aM && e2.b.kind === "meeting") ids.add(e2.b.id);
        if (bM && e2.a.kind === "meeting") ids.add(e2.a.id);
      }
      spot = ids.size ? ids : new Set(["__none__"]);
    }, 220);
  });

  // ── settle a 2D force layout, then lift into 3D ──
  function settle(iterations) {
    for (let it = 0; it < iterations; it++) {
      for (const a of ns) {
        for (const b of ns) {
          if (a === b) continue;
          const dx = a.x - b.x, dy = a.y - b.y;
          const d2 = Math.max(dx * dx + dy * dy, 40);
          const k = a.kind === b.kind ? 30000 : 15000;
          const f = k / d2;
          a.vx += (dx / Math.sqrt(d2)) * f; a.vy += (dy / Math.sqrt(d2)) * f;
        }
        a.vx += (W / 2 - a.x) * 0.003; a.vy += (H / 2 - a.y) * 0.003;
      }
      for (const e of es) {
        const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.max(Math.hypot(dx, dy), 1);
        const f = (d - 110) * 0.01;
        e.a.vx += (dx / d) * f; e.a.vy += (dy / d) * f;
        e.b.vx -= (dx / d) * f; e.b.vy -= (dy / d) * f;
      }
      for (const n of ns) {
        n.vx *= 0.8; n.vy *= 0.8;
        n.x += Math.max(-8, Math.min(8, n.vx));
        n.y += Math.max(-8, Math.min(8, n.vy));
      }
    }
  }
  settle(260);
  // lift: layout xy becomes atlas xy, z from a stable per-node hash
  const spread = Math.min(W, H) * 0.44;
  const maxR = Math.max(...ns.map((n) => Math.hypot(n.x - W / 2, n.y - H / 2)), 1);
  for (const n of ns) {
    n.px = ((n.x - W / 2) / maxR) * spread;
    n.py = ((n.y - H / 2) / maxR) * spread * 0.78;
    n.pz = (((n.seed * 733) % 1) - 0.5) * spread * 0.9;
  }

  // ── the atlas camera ──
  let angA = 0.6, angB = -0.18, zoom = 1, autoSpin = true;
  let dragging = false, downX = 0, downY = 0, moved = 0;
  const FOV = 780;

  function project(n) {
    const ca = Math.cos(angA), sa = Math.sin(angA), cb = Math.cos(angB), sb = Math.sin(angB);
    const X = n.px * ca + n.pz * sa;
    const Z0 = -n.px * sa + n.pz * ca;
    const Y = n.py * cb - Z0 * sb;
    const Z = n.py * sb + Z0 * cb;
    const p = (FOV / (FOV + Z)) * zoom;
    return { x: W / 2 + X * p, y: H / 2 + Y * p, s: p, z: Z };
  }

  const STAR_N = 170;
  const stars = Array.from({ length: STAR_N }, (_, i) => {
    const a = (i * 2.399963) % 6.2832, rr = 0.06 + ((i * 0.6180339) % 1) * 0.48;
    return { x: W / 2 + Math.cos(a) * W * rr, y: H / 2 + Math.sin(a) * H * rr * 0.92, s: 0.5 + ((i * 0.414) % 1) * 1.1, o: 0.04 + ((i * 0.271) % 1) * 0.09 };
  });

  function glowDot(x, y, r, color, glow, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = color; ctx.shadowBlur = glow;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
    ctx.fillStyle = color; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(x, y, Math.max(0.6, r * 0.45), 0, 6.2832);
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#fdfcf9"; ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.9);
    vg.addColorStop(0, "rgba(255,255,255,0)"); vg.addColorStop(1, "rgba(90,80,55,.07)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = s.o;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.2832);
      ctx.fillStyle = "#b3ac9d"; ctx.fill();
    }
    ctx.globalAlpha = 1;

    const proj = new Map(ns.map((n) => [n, project(n)]));
    const inSpot = (n) => !spot || spot.has(n.id);
    const lit = (n) => (!hover || n === hover || es.some((e) => (e.a === hover && e.b === n) || (e.b === hover && e.a === n))) && inSpot(n);
    const depthAlpha = (z) => 0.35 + 0.65 * Math.max(0, Math.min(1, (240 - z) / 480));

    ctx.lineCap = "round";
    for (const e of es) {
      const a = proj.get(e.a), b = proj.get(e.b);
      if (spot && !(spot.has(e.a.id) && spot.has(e.b.id))) continue;
      const on = hover && (e.a === hover || e.b === hover);
      const da = Math.min(depthAlpha(a.z), depthAlpha(b.z));
      ctx.strokeStyle = on ? "rgba(91,116,224,.5)" : `rgba(33,32,28,${(0.09 * da).toFixed(3)})`;
      ctx.lineWidth = on ? 1.2 : 0.8;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    // back-to-front
    for (const n of [...ns].sort((x, y) => proj.get(y).z - proj.get(x).z)) {
      if (spot && !spot.has(n.id)) continue;
      const p = proj.get(n);
      const on = lit(n);
      const hot = n === hover || n.id === selected;
      const da = depthAlpha(p.z);
      if (n.kind === "topic") glowDot(p.x, p.y, Math.max(3, n.r * 0.5 * p.s), "#cf9a35", hot ? 24 : 13, (on ? 1 : 0.3) * da);
      else if (n.kind === "meeting") glowDot(p.x, p.y, 5 * p.s, hot ? "#4a63cf" : "#5b74e0", hot ? 22 : 10, (on ? 0.95 : 0.3) * da);
      else glowDot(p.x, p.y, 2.5 * p.s, "#a39e94", hot ? 12 : 4, (on ? 0.7 : 0.2) * da);
    }

    // labels: topic hubs in caps; front hemisphere reads clearest
    ctx.textAlign = "left";
    for (const n of ns) {
      if (spot && !spot.has(n.id)) continue;
      if (spot && n.kind !== "topic") {
        const p = proj.get(n);
        ctx.fillStyle = "rgba(33,32,28,.9)";
        ctx.font = "600 11.5px -apple-system, system-ui";
        ctx.textAlign = "center";
        ctx.fillText(n.label.slice(0, 28), p.x, p.y + 18);
        ctx.textAlign = "left";
        continue;
      }
      if (n.kind !== "topic") continue;
      const p = proj.get(n);
      const da = depthAlpha(p.z);
      if (da < 0.55 && n !== hover) continue;
      const deg = meetingNeighbors[n.id]?.size ?? 0;
      const on = lit(n);
      ctx.globalAlpha = (on ? 1 : 0.25) * da;
      ctx.fillStyle = "rgba(33,32,28,.85)";
      ctx.font = "700 11px ui-monospace, SFMono-Regular, monospace";
      ctx.fillText(n.label.toUpperCase().slice(0, 26), p.x + 9, p.y - 2);
      ctx.fillStyle = "rgba(150,143,130,.95)";
      ctx.font = "500 9.5px ui-monospace, SFMono-Regular, monospace";
      ctx.fillText(`${deg} MEETING${deg === 1 ? "" : "S"}`, p.x + 9, p.y + 9);
      ctx.globalAlpha = 1;
    }
    if (hover && hover.kind !== "topic") {
      const p = proj.get(hover);
      ctx.fillStyle = "rgba(33,32,28,.9)";
      ctx.font = "600 11px -apple-system, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(hover.label.slice(0, 28), p.x, p.y + 16);
      ctx.textAlign = "left";
    }
  }

  (function loop() {
    if (stopped || !document.body.contains(canvas)) { stopped = true; return; }
    if (autoSpin && !dragging) angA += 0.0016;
    draw();
    requestAnimationFrame(loop);
  })();

  const hitAt = (mx, my) => {
    let best = null, bd = 1e9;
    for (const n of ns) {
      const p = project(n);
      const rr = (n.kind === "meeting" ? 8 : n.kind === "topic" ? Math.max(5, n.r * 0.5) : 5) * p.s + 4;
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d <= rr && p.z < bd) { best = n; bd = p.z; }
    }
    return best;
  };
  canvas.addEventListener("mousedown", (ev) => {
    dragging = true; moved = 0;
    downX = ev.clientX; downY = ev.clientY;
  });
  canvas.addEventListener("mousemove", (ev) => {
    const r = canvas.getBoundingClientRect();
    if (dragging) {
      const dx = ev.clientX - downX, dy = ev.clientY - downY;
      downX = ev.clientX; downY = ev.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      angA += dx * 0.005;
      angB = Math.max(-0.9, Math.min(0.9, angB + dy * 0.004));
      return;
    }
    const hnode = hitAt(ev.clientX - r.left, ev.clientY - r.top);
    canvas.style.cursor = hnode ? "pointer" : "grab";
    if (hnode !== hover) {
      hover = hnode;
      if (hnode) {
        const p = project(hnode);
        tip.innerHTML = `<b>${esc(hnode.label)}</b><span>${esc(hnode.meta)}</span>`;
        tip.style.left = Math.round(p.x + 16) + "px";
        tip.style.top = Math.round(p.y - 32) + "px";
        tip.style.opacity = "1";
      } else tip.style.opacity = "0";
    }
  });
  canvas.addEventListener("mouseleave", () => { hover = null; tip.style.opacity = "0"; dragging = false; });
  window.addEventListener("mouseup", () => { dragging = false; });
  const spinBtn = $("#gz-spin");
  const setSpin = (on) => { autoSpin = on; spinBtn.textContent = on ? "⏸" : "▶"; };
  canvas.addEventListener("click", async (ev) => {
    if (moved > 6) return; // that was a rotate, not a click
    const r = canvas.getBoundingClientRect();
    const n = hitAt(ev.clientX - r.left, ev.clientY - r.top);
    if (n?.kind === "meeting") { selected = n.id; await openPanel(n.id); return; }
    if (n) { selected = n.id; await openNodePanel(n); return; }
    if (selected) { selected = null; panel.classList.remove("open"); return; }
    setSpin(!autoSpin); // empty cloth: pause / resume the slow turn
  });
  $("#gz-in").addEventListener("click", () => { zoom = Math.min(2, zoom * 1.18); });
  $("#gz-out").addEventListener("click", () => { zoom = Math.max(0.55, zoom * 0.85); });
  spinBtn.addEventListener("click", () => setSpin(!autoSpin));
  canvas.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    zoom = Math.max(0.55, Math.min(2, zoom * (ev.deltaY > 0 ? 0.94 : 1.06)));
  }, { passive: false });

  async function ctxActions(nodeId) {
    const r = await api(`/api/node/context?id=${encodeURIComponent(nodeId)}`);
    if (r.error) { alert(r.error); return null; }
    return r;
  }
  window.__brainCtxDownload = async (nodeId) => {
    const r = await ctxActions(nodeId);
    if (!r) return;
    const a = document.createElement("a");
    a.download = r.filename;
    a.href = URL.createObjectURL(new Blob([r.markdown], { type: "text/markdown" }));
    a.click();
  };
  window.__brainCtxCopy = async (nodeId, btn) => {
    const r = await ctxActions(nodeId);
    if (!r) return;
    await navigator.clipboard.writeText(r.markdown);
    if (btn) { const t = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => (btn.textContent = t), 1400); }
  };

  /** Peek panel for people and topics — the node's story without leaving the graph. */
  async function openNodePanel(n) {
    const r = await ctxActions(n.id);
    if (!r) return;
    panel.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:2px">
        <div>
          <div class="gp-k" style="margin:0">${n.kind === "person" ? "Person" : "Topic"}</div>
          <div style="font-weight:650;font-size:17px;letter-spacing:-.015em;line-height:1.3;margin-top:3px">${esc(n.label)}</div>
          <div style="color:var(--ink-3);font-size:12.5px;margin-top:2px">${esc(n.meta)}</div>
        </div>
        <button id="gp-close" style="margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);width:26px;height:26px;border-radius:8px;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1">✕</button>
      </div>
      <pre style="white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:16px;max-height:52vh;overflow-y:auto">${esc(r.markdown)}</pre>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="copybtn" style="margin:0" id="gp-copy">Copy .md for your LLM</button>
        <button class="copybtn" style="margin:0" id="gp-dl">Download</button>
      </div>`;
    panel.classList.add("open");
    $("#gp-close").addEventListener("click", () => { selected = null; panel.classList.remove("open"); });
    $("#gp-copy").addEventListener("click", (e) => window.__brainCtxCopy(n.id, e.currentTarget));
    $("#gp-dl").addEventListener("click", () => window.__brainCtxDownload(n.id));
  }

  async function openPanel(id) {
    const { meeting, claims } = await api(`/api/meeting?id=${encodeURIComponent(id)}`);
    const open = claims.filter((c) => c.kind === "action_item" && c.gate === "passed" && !c.done);
    const decisions = claims.filter((c) => c.kind === "decision" && c.gate === "passed");
    const byOwner = {};
    for (const c of open) (byOwner[c.body.owner ?? "Unassigned"] ??= []).push(c);
    panel.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:2px">
        <div>
          <div class="gp-k" style="margin:0">Meeting</div>
          <div style="font-weight:650;font-size:17px;letter-spacing:-.015em;line-height:1.3;margin-top:3px">${esc(meeting.title)}</div>
          <div style="color:var(--ink-3);font-size:12.5px;margin-top:2px">${fmtDate(meeting.started_at)} · ${Math.max(1, Math.round(meeting.duration_s / 60))} min · ${esc(meeting.mode)}</div>
        </div>
        <button id="gp-close" style="margin-left:auto;flex:none;border:1px solid var(--line);background:var(--surface);width:26px;height:26px;border-radius:8px;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1">✕</button>
      </div>
      ${meeting.summary ? `<div style="margin-top:20px"><div class="gp-k">Summary</div><div style="font-size:13.5px;line-height:1.6">${esc(meeting.summary)}</div></div>` : ""}
      <div style="margin-top:22px"><div class="gp-k">Pending · by stakeholder</div>
      ${Object.keys(byOwner).length ? Object.entries(byOwner).map(([owner, items]) => `
        <div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span class="gp-avatar">${esc(owner[0] ?? "?")}</span>
            <span style="font-weight:620;font-size:13.5px">${esc(owner)}</span>
            <span style="font-size:11.5px;color:var(--ink-3)">${items.length} open</span>
          </div>
          ${items.map((it) => `<div class="gp-item">
            <div style="font-size:13px;font-weight:570;line-height:1.5">${esc(it.body.task)}</div>
            ${it.body.due ? `<div style="font-size:11.5px;color:var(--ink-3);margin-top:1px">due ${esc(it.body.due)}</div>` : ""}
          </div>`).join("")}
        </div>`).join("") : `<div style="font-size:13px;color:var(--ink-3)">Nothing outstanding from this one.</div>`}
      </div>
      ${decisions.length ? `<div style="margin-top:22px"><div class="gp-k">Decisions</div>
        ${decisions.map((d) => `<div style="font-size:13px;line-height:1.55;padding:7px 0;border-top:1px solid var(--line)">✓ ${esc(d.body.text)}</div>`).join("")}</div>` : ""}
      ${meeting.my_notes ? `<div style="margin-top:22px"><div class="gp-k">Your notes</div>
        <div style="font-size:13px;line-height:1.6;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;white-space:pre-wrap">${esc(meeting.my_notes)}</div></div>` : ""}
      <button id="gp-open" style="margin-top:20px;width:100%;border:0;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;padding:10px 16px;border-radius:10px;color:#fff;background:var(--thread);text-align:left;box-shadow:0 1px 2px rgb(50 60 140 / 0.25)">Open the full meeting →</button>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="copybtn" style="margin:0" id="gp-copy">Copy .md for your LLM</button>
        <button class="copybtn" style="margin:0" id="gp-dl">Download</button>
      </div>`;
    panel.classList.add("open");
    $("#gp-close").addEventListener("click", () => { selected = null; panel.classList.remove("open"); draw(); });
    $("#gp-open").addEventListener("click", () => { state.meetingId = id; render(); });
    $("#gp-copy").addEventListener("click", (e) => window.__brainCtxCopy(id, e.currentTarget));
    $("#gp-dl").addEventListener("click", () => window.__brainCtxDownload(id));
  }

  $("#ctx-md").addEventListener("click", (e) => {
    if (!selected) { alert("Click a node first — then this copies its context as markdown for your LLM."); return; }
    window.__brainCtxCopy(selected, e.currentTarget);
  });
}

// ── Live recording ──────────────────────────────────────────────────────
const recBtn = $("#rec");
let recording = false, evtSource = null, pipWin = null, recTitle = "";

$("#pip-btn").addEventListener("click", () => openCompanion(recTitle || "Recording", true));

recBtn.addEventListener("click", async () => {
  try {
  if (!recording) {
    // No pre-record dialog: naming happens at stop, prefilled from the
    // conversation itself. Starting is one click / one hotkey.
    await startRecording();
  } else await stopRecording();
  } catch (err) {
    recording = false;
    recBtn.disabled = false;
    recBtn.textContent = "● Record";
    recBtn.classList.remove("recording");
    console.error("record click failed:", err);
    alert(`Recording failed: ${err.message}\n\nMake sure you opened http://localhost:4640 (served by \`npm run dev\`), not the file directly or another preview server.`);
  }
});

async function startRecording(title) {
  const resp = await fetch("/api/record/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
  if (!resp.ok) throw new Error(`server responded ${resp.status}`);
  const r = await resp.json();
  if (r.error) { alert(r.error); return false; }
  recording = true;
  recTitle = title;
  recBtn.textContent = "■ Stop & stitch";
  recBtn.classList.add("recording");
  $("#pip-btn").style.display = "";
  state.meetingId = r.meetingId;
  renderMeeting(r.meetingId, { live: true });
  liveMetaBar();
  openCompanion(title); // best effort — the header ⧉ button is the sure path
  return true;
}

async function stopRecording() {
  recBtn.textContent = "… stitching";
  recBtn.disabled = true;
  const r = await fetch("/api/record/stop", { method: "POST" }).then((x) => x.json());
  recording = false;
  recBtn.disabled = false;
  recBtn.textContent = "● Record";
  recBtn.classList.remove("recording");
  $("#pip-btn").style.display = "none";
  evtSource?.close();
  try { pipWin?.close(); } catch (e) {}
  pipWin = null;
  if (r.meetingId && r.exit !== "failed" && r.exit !== "discarded") {
    sessionStorage.setItem("tl-thread-anim", "1"); // Home plays the needle run: meeting → loose ends
    state.meetingId = r.meetingId; render();
  }
  else { alert(r.reason ?? "Nothing was captured."); render(); }
}

/**
 * The floating companion: an always-on-top mini window (Document
 * Picture-in-Picture) with the timer, the live line, and Stop — so the
 * meeting stays visible over Zoom, docs, everything. Chrome/Arc/Edge.
 */
async function openCompanion(title, manual) {
  if (pipWin) return;
  if (!("documentPictureInPicture" in window)) {
    if (manual) alert("This browser can't make always-on-top windows (needs Chrome, Arc or Edge, version 116+). The recording itself is unaffected.");
    return;
  }
  try {
    pipWin = await documentPictureInPicture.requestWindow({ width: 272, height: 74, disallowReturnToOpener: true });
  } catch (e) {
    pipWin = null;
    if (manual) alert("Couldn't open the floating window: " + (e && e.message ? e.message : e));
    const b = $("#popout-btn");
    if (b) { b.style.color = "var(--thread)"; b.style.borderColor = "var(--thread)"; }
    return; // needs a fresh click — the Pop out button provides one
  }
  const doc = pipWin.document;
  doc.head.innerHTML = `<style>
    body { margin:0; background:#faf8f5; color:#21201c; font:12.5px/1.5 -apple-system,system-ui;
      -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    header { display:flex; align-items:center; gap:7px; padding:9px 10px; flex:none; }
    .dot { width:7px; height:7px; border-radius:50%; background:#cf5a52; animation:p 1.6s ease-in-out infinite; flex:none; }
    @keyframes p { 50% { opacity:.4 } }
    .t { font-weight:650; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
    .clock { font-variant-numeric:tabular-nums; color:#6b675f; font-size:11.5px; flex:none; }
    .ib { border:1px solid #eee9e1; background:#fff; border-radius:7px; width:24px; height:24px;
      cursor:pointer; color:#6b675f; font-size:12px; line-height:1; flex:none; padding:0; }
    .ib:hover { border-color:#a3aee8; color:#5b74e0; }
    .ib.stop { color:#cf5a52; font-weight:700; }
    #feed { display:none; flex:1; overflow-y:auto; padding:2px 12px 10px; border-top:1px solid #eee9e1; }
    #pipbar { display:none; gap:6px; padding:6px 12px 0; align-items:center; }
    #pipbar select { border:1px solid #eee9e1; border-radius:7px; background:#fff; color:#6b675f; font:500 11px -apple-system,system-ui; padding:2px 6px; }
    #askrow { display:none; gap:6px; padding:8px 12px 10px; border-top:1px solid #eee9e1; }
    #askrow input { flex:1; border:1px solid #eee9e1; border-radius:8px; padding:5px 9px; font:12px -apple-system,system-ui; outline:none; }
    #askrow button { width:auto; padding:5px 12px; background:#5b74e0; font-size:12px; }
    .qa { margin:8px 0; padding:8px 10px; background:#f4f2ec; border-radius:9px; font-size:12px; }
    .qa b { color:#21201c; } .qa .src { color:#a39e94; font-size:10.5px; margin-top:4px; }
    body.open #pipbar, body.open #askrow { display:flex; }
    #feed .u { margin-top:6px; font-size:12px; color:#21201c; }
    #feed .u b { color:#5b74e0; font-weight:600; margin-right:5px; }
    #feed .partial { color:#a39e94; font-style:italic; }
    body.open #feed { display:block; }
  </style>`;
  doc.body.innerHTML = `
    <header>
      <span class="dot"></span><span class="t">${esc(title)}</span><span class="clock" id="pc">00:00</span>
      <button class="ib" id="px" title="Live transcription">⌄</button>
      <button class="ib stop" id="ps" title="Stop &amp; process">■</button>
    </header>
    <div id="pipbar">
      <select id="pmode" title="Meeting mode"></select>
      <span style="font-size:10.5px;color:#a39e94">mode</span>
    </div>
    <div id="feed"></div>
    <div id="askrow"><input id="pq" placeholder="Ask your brain — this meeting &amp; past ones"><button id="pgo">Ask</button></div>`;
  const t0 = Date.now();
  const iv = setInterval(() => {
    if (!pipWin) return clearInterval(iv);
    const s = Math.floor((Date.now() - t0) / 1000);
    const el = doc.getElementById("pc");
    if (el) el.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);
  doc.getElementById("ps").addEventListener("click", () => { window.focus(); stopRecording(); });
  const pm = doc.getElementById("pmode");
  pm.innerHTML = MODES.map((m) => `<option ${m === "discovery" ? "selected" : ""}>${m}</option>`).join("");
  pm.addEventListener("change", () => {
    fetch("/api/record/meta", { method: "POST", body: JSON.stringify({ mode: pm.value }) });
    const lm = document.getElementById("live-mode");
    if (lm) lm.value = pm.value;
  });
  const feedEl = doc.getElementById("feed");
  const ask = async () => {
    const q = doc.getElementById("pq").value.trim();
    if (!q) return;
    doc.getElementById("pq").value = "";
    doc.body.classList.add("open");
    const box = doc.createElement("div");
    box.className = "qa";
    box.innerHTML = `<b>${esc(q)}</b><div class="a" style="color:#6b675f;margin-top:3px">thinking…</div>`;
    feedEl.appendChild(box); feedEl.scrollTop = 1e9;
    try {
      const r = await api(`/api/ask?q=${encodeURIComponent(q)}`);
      const pts = (r.answer ?? []).slice(0, 3);
      const srcs = [...new Set(pts.map((p) => p.meeting_title))];
      box.querySelector(".a").innerHTML =
        (r.summary ? esc(r.summary) : pts.map((p) => esc(p.text)).join(" ")) || "Nothing solid in the brain for that yet.";
      if (srcs.length) box.insertAdjacentHTML("beforeend", `<div class="src">from: ${srcs.map(esc).join(" · ")}</div>`);
    } catch (e) {
      box.querySelector(".a").textContent = "Ask failed — is the brain busy?";
    }
    feedEl.scrollTop = 1e9;
  };
  doc.getElementById("pgo").addEventListener("click", ask);
  doc.getElementById("pq").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  doc.getElementById("px").addEventListener("click", () => {
    const open = doc.body.classList.toggle("open");
    doc.getElementById("px").textContent = open ? "⌃" : "⌄";
    try { pipWin.resizeTo(open ? 340 : 272, open ? 330 : 74); } catch (e) { /* browser may refuse; user can drag-resize */ }
  });
  pipWin.addEventListener("pagehide", () => { pipWin = null; });
}

/** live partial: updates the pill's sense of "now" inside the feed */
function companionLine(speaker, text) {
  const doc = pipWin?.document;
  if (!doc) return;
  const feed = doc.getElementById("feed");
  let p = doc.getElementById("pp");
  if (!p) {
    p = doc.createElement("div");
    p.id = "pp"; p.className = "u partial";
    feed.appendChild(p);
  }
  p.innerHTML = `<b>${esc(speaker)}</b>${esc(text)}`;
  feed.scrollTop = 1e9;
}

/** a finished line joins the transcript feed */
function companionFinal(speaker, text) {
  const doc = pipWin?.document;
  if (!doc) return;
  const feed = doc.getElementById("feed");
  doc.getElementById("pp")?.remove();
  const d = doc.createElement("div");
  d.className = "u";
  d.innerHTML = `<b>${esc(speaker)}</b>${esc(text)}`;
  feed.appendChild(d);
  while (feed.children.length > 60) feed.firstChild.remove();
  feed.scrollTop = 1e9;
}

// ── Meeting-start notifications ─────────────────────────────────────────
async function checkUpcomingNotifications() {
  if (Notification.permission !== "granted" || recording) return;
  const ups = await api("/api/upcoming").catch(() => []);
  for (const u of ups) {
    const dt = u.at_ms - Date.now();
    if (dt > -60_000 && dt <= 120_000 && !localStorage.getItem("tl-notified-" + u.title + u.at_ms)) {
      localStorage.setItem("tl-notified-" + u.title + u.at_ms, "1");
      const n = new Notification(`${u.title} is starting`, {
        body: `${u.participants ? u.participants + " — " : ""}Click to record with Threadline`,
        tag: "tl-meeting",
      });
      n.onclick = () => { window.focus(); startRecording(u.title); n.close(); };
    }
  }
}
setInterval(checkUpcomingNotifications, 30_000);

// If a recording is started/stopped from outside (the double-Fn hotkey),
// the page notices within a few seconds and syncs its UI.
setInterval(async () => {
  const s = await api("/api/record/state").catch(() => null);
  if (!s) return;
  if (s.recording && !recording) {
    recording = true;
    recTitle = s.title ?? "Recording";
    recBtn.textContent = "■ Stop";
    recBtn.classList.add("recording");
    $("#pip-btn").style.display = "";
    if (s.meetingId) { state.meetingId = s.meetingId; renderMeeting(s.meetingId, { live: true }); liveMetaBar(); }
  } else if (!s.recording && recording && !recBtn.disabled) {
    recording = false;
    recBtn.textContent = "● Record";
    recBtn.classList.remove("recording");
    $("#pip-btn").style.display = "none";
    evtSource?.close();
    try { pipWin?.close(); } catch (e) {}
    pipWin = null;
    render();
  }
}, 4000);

function renderLive(title) {
  main.innerHTML = `<h1>${esc(title)}</h1><div class="sub">Recording — no bot in your call. Words land as they're said.</div>
    <div class="card"><h2>Your notes · type while you talk</h2>
      <textarea class="notes" id="live-notes" placeholder="Jot anything — it's saved with the meeting when you stop."></textarea></div>
    <div class="card"><h2>Live transcript</h2><div id="live-feed"><div class="empty">${SPOOL_SVG}listening…</div></div></div>
    <div class="card"><h2>Capture status</h2><div id="live-status"></div></div>`;
  const feed = $("#live-feed"), statusBox = $("#live-status");
  const partials = {};
  evtSource = new EventSource("/api/record/events");
  evtSource.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    if (e.type === "status") {
      statusBox.insertAdjacentHTML("beforeend", `<div class="live-status">${esc(e.message)}</div>`);
    } else if (e.type === "partial") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      let el = partials[e.speaker];
      if (!el) {
        feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}" id="p-${e.speaker}"><div class="who">${e.speaker}</div><div class="live-partial"></div></div>`);
        el = partials[e.speaker] = feed.lastElementChild;
      }
      el.querySelector(".live-partial").textContent = e.text;
      companionLine(e.speaker, e.text);
    } else if (e.type === "final") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      const el = partials[e.speaker];
      if (el) { delete partials[e.speaker]; el.remove(); }
      feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="ts">${fmtTs(e.offsetS)}</div><div class="who">${e.speaker}</div><div>${esc(e.text)}</div></div>`);
      companionFinal(e.speaker, e.text);
      window.scrollTo(0, document.body.scrollHeight);
    }
  };
}

// ── Post-stop naming (works for button, double-Fn hotkey, or another tab) ──
// The stopped SSE event fires AFTER processing, so the content-derived
// auto-name already exists and becomes the prefill.
function namedAlready(mid) {
  const k = `tl-named-${mid}`;
  if (localStorage.getItem(k)) return true;
  localStorage.setItem(k, "1");
  return false;
}
async function showNamingModal(meetingId) {
  if (namedAlready(meetingId)) return; // SSE replays old events to new tabs
  const { meeting } = await api(`/api/meeting?id=${meetingId}`);
  if (!meeting || meeting.error) return;
  document.getElementById("name-modal")?.remove();
  document.body.insertAdjacentHTML("beforeend", `
    <div class="tl-modal" id="name-modal"><div class="box">
      <h2>Name this meeting</h2>
      <div class="t-meta" style="margin-bottom:10px">Named from the conversation — keep it or type your own.</div>
      <input id="name-input" value="${esc(meeting.title)}" style="width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)">
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
        <button class="copybtn" id="name-keep">Keep</button>
        <button class="copybtn" id="name-save" style="background:var(--thread);color:#fff;border-color:transparent">Save</button>
      </div>
    </div></div>`);
  const modal = $("#name-modal"), input = $("#name-input");
  input.focus(); input.select();
  const close = () => modal.remove();
  const save = async () => {
    const title = input.value.trim();
    if (title && title !== meeting.title)
      await fetch("/api/meeting/rename", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: meetingId, title }) });
    close();
    if (state.meetingId === meetingId) render();
  };
  $("#name-save").addEventListener("click", save);
  $("#name-keep").addEventListener("click", close);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); if (e.key === "Escape") close(); });
  modal.addEventListener("mousedown", (e) => { if (e.target === modal) close(); });
}
(function watchForStops() {
  const src = new EventSource("/api/record/events");
  src.onmessage = (ev) => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    if (e.type === "stopped" && e.exit !== "failed" && e.exit !== "discarded") showNamingModal(e.meetingId);
  };
})();

let searchTimer;
let askSeq = 0; // superseded asks must not overwrite newer ones
$("#search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) return render();
  searchTimer = setTimeout(async () => {
    const hits = await api(`/api/search?q=${encodeURIComponent(q)}`);
    const meetings = [...new Set(hits.map((h) => h.meeting_id))].length;
    main.innerHTML = `<h1>“${esc(q)}”</h1>
      <div class="sub">${hits.length} line${hits.length === 1 ? "" : "s"} across ${meetings} meeting${meetings === 1 ? "" : "s"}</div>
      <div id="ask-card"><button class="copybtn" id="ask-btn" style="margin:0 0 12px">Ask across all meetings ↵</button></div>
      <div class="card">${hits.length ? hits.map((h) => `
        <div class="m-row" data-mid="${h.meeting_id}" data-off="${h.offset_s}">
          <div class="m-date">${fmtDate(h.started_at)} · ${fmtTs(h.offset_s)}</div>
          <div><div class="m-title">${esc(h.title)}</div><div class="t-meta">${h.hit}</div></div>
        </div>`).join("") : `<div class="empty">${SPOOL_SVG}No thread found — it searches every word of every meeting.</div>`}</div>`;
    wireMeetingLinks();
    $("#ask-btn")?.addEventListener("click", () => runAsk(q));
  }, 250);
});

// Ask fires on Enter or the button — NEVER per keystroke: it can cost an LLM call.
$("#search").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.value.trim()) runAsk(e.target.value.trim());
});

async function runAsk(q) {
  const seq = ++askSeq;
  const card = $("#ask-card");
  if (!card) return;
  card.innerHTML = `<div class="card"><div class="t-meta">Reading across every meeting…</div></div>`;
  let r;
  try { r = await api(`/api/ask?q=${encodeURIComponent(q)}`); }
  catch (err) { if (seq === askSeq) card.innerHTML = `<div class="card"><div class="t-meta">Ask failed: ${esc(String(err))}</div></div>`; return; }
  if (seq !== askSeq || !$("#ask-card")) return; // superseded or view changed
  const pill = r.exit === "shipped" ? "pass" : "block";
  $("#ask-card").innerHTML = `<div class="card">
    <h2>${r.mode === "synthesized" ? "Answer" : "Closest passages"} <span class="pill ${pill}">${esc(r.exit)}</span></h2>
    ${r.summary ? `<div style="font-size:15px;line-height:1.65;margin-bottom:14px">${esc(r.summary)}</div>
      <div class="t-meta" style="margin-bottom:6px">Receipts</div>
      ${r.answer.map((p) => `
        <span class="backlink" data-mid="${p.meeting_id}" data-off="${p.offset_s}" title="${esc(p.quote)}">${esc(p.meeting_title)} · ${fmtTs(p.offset_s)}</span>`).join(" ")}`
    : r.answer.length ? r.answer.map((p) => `
      <div class="claim">${esc(p.text)}<br>
        <span class="backlink" data-mid="${p.meeting_id}" data-off="${p.offset_s}">${esc(p.meeting_title)} · ${fmtTs(p.offset_s)}</span></div>`).join("")
      : `<div class="t-meta">Couldn't ground an answer — the receipts below are what matched.</div>`}
    ${r.blocked.length ? `<div class="t-meta" style="margin-top:8px">${r.blocked.length} sentence(s) dropped — no receipt in the retrieved snippets</div>` : ""}
    ${r.summary || r.answer.length ? `<div style="margin-top:10px"><button class="copybtn" id="askcard-continue">Continue in Needle 🪡</button></div>` : ""}
  </div>`;
  wireMeetingLinks();
  $("#askcard-continue")?.addEventListener("click", async () => {
    const seed = {
      question: q,
      content: r.summary || (r.answer[0]?.text ?? ""),
      payload: { mode: r.mode, exit: r.exit,
        points: r.answer.map((p) => ({ text: p.text, quote: p.quote, meeting_id: p.meeting_id, meeting_title: p.meeting_title, offset_s: p.offset_s })),
        chunk_ids: r.receipts.map((s) => s.chunk_id) },
    };
    const { id } = await fetch("/api/needle/new", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seed }) }).then((x) => x.json());
    $("#search").value = "";
    state.needleId = id; state.view = "needle"; state.meetingId = null;
    render();
  });
}

// ── Command palette: Spotlight for your meetings ─────────────────────────
// ⌘K everywhere; ⌘Space too, though macOS usually reserves it for Spotlight.
// Type → instant matches. Enter → grounded answer via /api/ask: synthesized
// ONLY from meeting content, receipts required, refuses rather than invents.
document.body.insertAdjacentHTML("beforeend", `
  <div id="palette-veil">
    <div id="palette">
      <input id="pal-input" placeholder="Ask your meetings anything…" autocomplete="off">
      <div id="palette-body">
        <div class="pal-hint"><span><b>↵</b> ask</span><span><b>esc</b> close</span><span>Answers come only from your meeting notes.</span></div>
      </div>
    </div>
  </div>`);
const veil = $("#palette-veil"), palInput = $("#pal-input"), palBody = $("#palette-body");
let palTimer, palSeq = 0;

function palOpen() {
  veil.classList.add("open");
  palInput.value = ""; palReset();
  setTimeout(() => palInput.focus(), 0);
}
function palClose() { veil.classList.remove("open"); }
function palReset() {
  palBody.innerHTML = `<div class="pal-hint"><span><b>↵</b> ask</span><span><b>esc</b> close</span><span>Answers come only from your meeting notes.</span></div>`;
}

document.addEventListener("keydown", (e) => {
  const cmd = e.metaKey || e.ctrlKey;
  if (cmd && (e.key.toLowerCase() === "k" || e.code === "Space")) { e.preventDefault(); palOpen(); }
  else if (e.key === "Escape" && veil.classList.contains("open")) palClose();
});
veil.addEventListener("mousedown", (e) => { if (e.target === veil) palClose(); });

function palGoto(mid, off) {
  palClose();
  state.meetingId = mid;
  if (off != null) state.deepLink = Number(off);
  render();
  window.scrollTo(0, 0);
}

palInput.addEventListener("input", () => {
  clearTimeout(palTimer);
  const q = palInput.value.trim();
  if (!q) return palReset();
  palTimer = setTimeout(async () => {
    const hits = await api(`/api/search?q=${encodeURIComponent(q)}`);
    if (palInput.value.trim() !== q) return;
    palBody.innerHTML = `
      <div class="pal-hint"><span><b>↵</b> ask across all meetings</span><span>${hits.length} matching line${hits.length === 1 ? "" : "s"}</span></div>
      ${hits.slice(0, 8).map((h) => `
        <div class="pal-row" data-pmid="${h.meeting_id}" data-poff="${h.offset_s}">
          <span class="ts">${esc(h.title.slice(0, 16))} · ${fmtTs(h.offset_s)}</span>
          <span class="txt">${h.hit}</span>
        </div>`).join("") || `<div class="pal-hint">No matching lines.</div>`}`;
    palBody.querySelectorAll("[data-pmid]").forEach((el) =>
      el.addEventListener("click", () => palGoto(el.dataset.pmid, el.dataset.poff)));
  }, 200);
});

palInput.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const q = palInput.value.trim();
  if (!q) return;
  const seq = ++palSeq;
  palBody.innerHTML = `<div class="pal-hint">Reading across every meeting…</div>`;
  let r;
  try { r = await api(`/api/ask?q=${encodeURIComponent(q)}`); }
  catch (err) { if (seq === palSeq) palBody.innerHTML = `<div class="pal-hint">Ask failed: ${esc(String(err))}</div>`; return; }
  if (seq !== palSeq || !veil.classList.contains("open")) return;
  palBody.innerHTML = `<div class="pal-answer">
    <div class="pal-hint"><span><b>${r.mode === "synthesized" ? "Answer" : "Closest passages"}</b></span>
      <span class="pill ${r.exit === "shipped" ? "pass" : "block"}">${esc(r.exit)}</span></div>
    ${r.summary ? `<div style="font-size:14.5px;line-height:1.6;padding:2px 10px 10px">${esc(r.summary)}</div>
      <div style="padding:0 10px 8px">${r.answer.map((p) => `
        <span class="backlink" data-pmid="${p.meeting_id}" data-poff="${p.offset_s}" title="${esc(p.quote)}">${esc(p.meeting_title)} · ${fmtTs(p.offset_s)}</span>`).join(" ")}</div>`
    : r.answer.length ? r.answer.map((p) => `
      <div class="claim">${esc(p.text)}<br>
        <span class="backlink" data-pmid="${p.meeting_id}" data-poff="${p.offset_s}">${esc(p.meeting_title)} · ${fmtTs(p.offset_s)}</span></div>`).join("")
      : `<div class="pal-hint">Nothing in your meetings supports an answer to that — refusing rather than guessing.</div>`}
    ${r.blocked.length ? `<div class="pal-hint">${r.blocked.length} sentence(s) dropped — no receipt in the notes</div>` : ""}
    ${r.summary || r.answer.length ? `<div style="padding:6px 10px 4px"><button class="copybtn" id="pal-continue">Continue in Needle 🪡</button></div>` : ""}
  </div>`;
  $("#pal-continue")?.addEventListener("click", async () => {
    // Seed a thread with this exchange AND its retrieved chunks, so the first
    // follow-up already has an evidence corpus to ground against.
    const seed = {
      question: q,
      content: r.summary || (r.answer[0]?.text ?? ""),
      payload: { mode: r.mode, exit: r.exit,
        points: r.answer.map((p) => ({ text: p.text, quote: p.quote, meeting_id: p.meeting_id, meeting_title: p.meeting_title, offset_s: p.offset_s })),
        chunk_ids: r.receipts.map((s) => s.chunk_id) },
    };
    const { id } = await fetch("/api/needle/new", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seed }) }).then((x) => x.json());
    palClose();
    state.needleId = id; state.view = "needle"; state.meetingId = null;
    render();
  });
  palBody.querySelectorAll("[data-pmid]").forEach((el) =>
    el.addEventListener("click", () => palGoto(el.dataset.pmid, el.dataset.poff)));
});

render();
</script>
</body>
</html>
