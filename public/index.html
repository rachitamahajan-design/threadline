<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadline</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3efe7;            /* warm cream paper */
    --surface: #fdfcf8;
    --ink: #1d1b16;           /* cartoon outline ink */
    --ink-2: #57534a;
    --ink-3: #8f8a7d;
    --thread: #e8752e;        /* the orange thread */
    --thread-soft: #f7d9c4;
    --node-meeting: #2a78d6; --node-person: #eb6834; --node-topic: #1baf7a;
    --pass: #17694a; --block: #cf3f3e;
    --line: #d9d3c5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #201e19; --surface: #2a2721;
      --ink: #f4f1e8; --ink-2: #c6c1b2; --ink-3: #8f8a7d;
      --thread: #f08644; --thread-soft: #4a3826;
      --node-meeting: #3987e5; --node-person: #d95926; --node-topic: #199e70;
      --pass: #3fa87b; --block: #e66767;
      --line: #454034;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15.5px/1.55 ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--line) 0.8px, transparent 0.8px);
    background-size: 26px 26px;
  }
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 26px; position: sticky; top: 0; z-index: 5;
    background: var(--bg); border-bottom: 2px solid var(--ink);
  }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
  .logo svg { display: block; }
  nav { display: flex; gap: 6px; }
  nav button {
    border: 2px solid transparent; background: none; color: var(--ink-2); font: inherit; font-weight: 700;
    padding: 6px 14px; border-radius: 99px; cursor: pointer;
  }
  nav button:hover { color: var(--ink); }
  nav button.active {
    background: var(--surface); color: var(--ink); border-color: var(--ink);
    box-shadow: 2.5px 2.5px 0 var(--ink);
  }
  #search {
    margin-left: auto; width: 290px; padding: 8px 14px;
    border: 2px solid var(--ink); border-radius: 99px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  #search::placeholder { color: var(--ink-3); }
  #rec {
    border: 2px solid var(--ink); font: inherit; font-weight: 800; cursor: pointer;
    padding: 7px 16px; border-radius: 99px; color: #fff; background: var(--thread);
    box-shadow: 2.5px 2.5px 0 var(--ink);
  }
  #rec:active { translate: 2px 2px; box-shadow: none; }
  #rec.recording { animation: pulse 1.4s ease-in-out infinite; background: var(--block); }
  @keyframes pulse { 50% { opacity: 0.7; } }

  main { max-width: 960px; margin: 0 auto; padding: 30px 26px 60px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 4px; }
  .sub { color: var(--ink-2); margin-bottom: 26px; }
  .card {
    background: var(--surface); border: 2px solid var(--ink);
    border-radius: 16px; padding: 20px 22px; margin-bottom: 20px;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .card h2 {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
    margin-bottom: 14px; font-weight: 800;
  }
  /* stitched divider — the thread motif */
  .todo, .m-row, .claim { border-top: 2px dashed var(--line); }
  .todo:first-of-type, .m-row:first-of-type, .claim:first-of-type { border-top: 0; }

  .todo { display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; }
  .todo input {
    appearance: none; width: 20px; height: 20px; margin-top: 2px; cursor: pointer; flex: none;
    border: 2px solid var(--ink); border-radius: 6px; background: var(--surface);
    display: grid; place-content: center;
  }
  .todo input:checked { background: var(--thread); }
  .todo input:checked::before { content: "✕"; color: #fff; font-weight: 900; font-size: 12px; }
  .todo.done .t-task { text-decoration: line-through wavy var(--thread); color: var(--ink-3); }
  .t-task { font-weight: 700; }
  .t-meta { color: var(--ink-2); font-size: 13.5px; }
  .receipt {
    font-size: 13.5px; color: var(--ink-2); margin-top: 5px; cursor: pointer;
    border-left: 3px solid var(--thread); padding: 3px 10px; border-radius: 3px;
    background: color-mix(in srgb, var(--thread) 9%, transparent);
  }
  .stats { display: flex; gap: 34px; margin: 0 0 26px; }
  .stat b { display: block; font-size: 24px; font-weight: 800; color: var(--ink); }
  .stat span { font-size: 13px; color: var(--ink-3); font-weight: 700; }
  textarea.notes {
    width: 100%; min-height: 130px; resize: vertical; font: inherit; color: var(--ink);
    background: color-mix(in srgb, var(--thread) 4%, transparent);
    border: 2px dashed var(--line); border-radius: 10px; padding: 12px 14px; outline: none;
  }
  textarea.notes:focus { border-color: var(--thread); }
  .draft { white-space: pre-wrap; font-size: 14.5px; background: color-mix(in srgb, var(--thread) 5%, transparent); border-radius: 10px; padding: 14px 16px; }
  .copybtn {
    border: 2px solid var(--ink); background: var(--surface); font: inherit; font-weight: 700; font-size: 13px;
    padding: 4px 14px; border-radius: 99px; cursor: pointer; margin-top: 10px; box-shadow: 2px 2px 0 var(--ink);
  }
  .copybtn:active { translate: 2px 2px; box-shadow: none; }
  .receipt:hover { background: color-mix(in srgb, var(--thread) 18%, transparent); }

  .pill {
    display: inline-block; font-size: 12.5px; font-weight: 700; padding: 2px 11px; border-radius: 99px;
    border: 2px solid var(--ink); color: var(--ink); background: var(--surface);
  }
  .pill.pass { background: var(--pass); color: #fff; }
  .pill.block { background: var(--block); color: #fff; }

  .m-row { display: flex; gap: 14px; padding: 13px 0; cursor: pointer; align-items: baseline; }
  .m-row:hover .m-title { color: var(--thread); text-decoration: underline wavy var(--thread) 1.5px; }
  .m-title { font-weight: 800; }
  .m-date { color: var(--ink-3); font-size: 13px; min-width: 88px; font-weight: 700; }

  .utt { display: flex; gap: 12px; padding: 7px 0; }
  .utt.hl { background: color-mix(in srgb, var(--thread) 14%, transparent); border-radius: 10px; padding: 7px 10px; margin: 0 -10px; }
  .utt .who { min-width: 76px; font-weight: 800; font-size: 13px; color: var(--ink-2); padding-top: 2px; }
  .utt .ts { color: var(--ink-3); font-size: 12px; min-width: 40px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .claim { padding: 10px 0; }
  .backlink {
    display: inline-block; margin: 3px 8px 3px 0; padding: 5px 13px; border-radius: 99px;
    border: 2px solid var(--ink); background: var(--thread-soft); color: var(--ink);
    cursor: pointer; font-size: 13.5px; font-weight: 700; box-shadow: 2px 2px 0 var(--ink);
  }
  .backlink:active { translate: 2px 2px; box-shadow: none; }

  #graph-wrap { position: relative; height: 560px; overflow: hidden; border-radius: 14px; padding: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  .legend { display: flex; gap: 20px; align-items: center; padding: 12px 6px 0; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 7px; border: 2px solid var(--ink); vertical-align: -1px; }
  .legend .l-m::before { background: var(--node-meeting); border-radius: 50%; }
  .legend .l-p::before { background: var(--node-person); border-radius: 3px; }
  .legend .l-t::before { background: var(--node-topic); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); border: 0; width: 14px; height: 14px; }

  .empty { color: var(--ink-3); text-align: center; padding: 36px 0; }
  .empty svg { display: block; margin: 0 auto 12px; }
  .exit-line { font-size: 13.5px; color: var(--ink-2); margin-top: 12px; }
  b { color: var(--thread); }
  .live-partial { color: var(--ink-3); font-style: italic; }
  .live-you .who { color: var(--thread); }
  .live-status { font-size: 12px; color: var(--ink-3); padding: 2px 0; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <!-- needle & thread mark -->
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <path d="M3 26 C 8 30, 12 22, 16 24 S 24 30, 28 24" stroke="var(--thread)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5.2"/>
      <path d="M8 23 L 26 5" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M8 23 L 26 5" stroke="var(--surface)" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="24.6" cy="6.4" rx="2.9" ry="4.6" transform="rotate(45 24.6 6.4)" stroke="var(--ink)" stroke-width="2.4"/>
      <path d="M3 26 C 6 28.5, 8.5 25.5, 8 23.4" stroke="var(--thread)" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    Threadline
  </div>
  <nav>
    <button data-view="today" class="active">Today</button>
    <button data-view="meetings">Meetings</button>
    <button data-view="graph">Threads</button>
  </nav>
  <input id="search" placeholder="Pull a thread… search every meeting">
  <button id="rec">● Record</button>
</header>
<main id="main"></main>

<script>
const $ = (s) => document.querySelector(s);
const main = $("#main");
const state = { view: "today", meetingId: null, highlight: null };
const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtTs = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (p) => fetch(p).then((r) => r.json());

const SPOOL_SVG = `<svg width="72" height="72" viewBox="0 0 72 72" fill="none">
  <rect x="22" y="14" width="28" height="44" rx="5" stroke="currentColor" stroke-width="3"/>
  <rect x="17" y="8" width="38" height="10" rx="5" stroke="currentColor" stroke-width="3"/>
  <rect x="17" y="54" width="38" height="10" rx="5" stroke="currentColor" stroke-width="3"/>
  <path d="M24 24h24M24 31h24M24 38h24M24 45h24" stroke="currentColor" stroke-width="2.4"/>
  <path d="M50 40 C 62 42, 58 56, 68 58" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5.4"/>
</svg>`;

document.querySelectorAll("nav button").forEach((b) =>
  b.addEventListener("click", () => { state.view = b.dataset.view; state.meetingId = null; render(); }));

async function render() {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view && !state.meetingId));
  if (state.meetingId) return renderMeeting(state.meetingId);
  if (state.view === "today") return renderToday();
  if (state.view === "meetings") return renderMeetings();
  if (state.view === "graph") return renderGraph();
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}

async function renderToday() {
  const { todos, meetings, stats } = await api("/api/today");
  const open = todos.filter((t) => !t.done);
  const mins = Math.round((stats?.seconds ?? 0) / 60);
  main.innerHTML = `
    <h1>${greeting()}, Rachita</h1>
    <div class="sub">${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</div>
    <div class="stats">
      <div class="stat"><b>${stats?.meetings ?? 0}</b><span>meetings captured</span></div>
      <div class="stat"><b>${mins < 60 ? mins + "m" : Math.floor(mins / 60) + "h " + (mins % 60) + "m"}</b><span>listened</span></div>
      <div class="stat"><b>${stats?.open_actions ?? 0}</b><span>loose ends</span></div>
      <div class="stat"><b>${stats?.decisions ?? 0}</b><span>decisions</span></div>
    </div>
    <div class="card"><h2>Loose ends · pulled from your meetings</h2>
      ${todos.length ? todos.map((t) => `
        <div class="todo ${t.done ? "done" : ""}">
          <input type="checkbox" ${t.done ? "checked" : ""} data-id="${t.id}">
          <div>
            <div class="t-task">${esc(t.body.task)}</div>
            <div class="t-meta">${t.body.owner ? esc(t.body.owner) : "unassigned"}${t.body.due ? ` · due ${esc(t.body.due)}` : ""}</div>
            <div class="receipt" data-mid="${t.meeting_id}" data-q="${esc(t.body.task)}">"${esc(t.quote ?? t.body.task)}" — ${esc(t.meeting_title)}</div>
          </div>
        </div>`).join("") : `<div class="empty">${SPOOL_SVG}No loose ends yet. Run <code>npm run demo</code> or hit ● Record.</div>`}
    </div>
    <div class="card"><h2>Recent meetings</h2>${meetings.map(meetingRow).join("")}</div>`;
  main.querySelectorAll(".todo input").forEach((cb) =>
    cb.addEventListener("change", async () => {
      await fetch("/api/todo", { method: "POST", body: JSON.stringify({ id: Number(cb.dataset.id), done: cb.checked }) });
      render();
    }));
  wireMeetingLinks();
}

function meetingRow(m) {
  const bits = [];
  if (m.n_decisions) bits.push(`${m.n_decisions} decision${m.n_decisions === 1 ? "" : "s"}`);
  if (m.n_actions) bits.push(`${m.n_actions} action${m.n_actions === 1 ? "" : "s"}`);
  const people = (m.participants ?? "").split(",").filter(Boolean).join(" · ");
  return `
    <div class="m-row" data-mid="${m.id}">
      <div class="m-date">${fmtDate(m.started_at)}</div>
      <div>
        <div class="m-title">${esc(m.title)}</div>
        <div class="t-meta">${esc(m.headline ?? "")}</div>
        <div class="t-meta">${bits.length ? `<b>${bits.join(" · ")}</b>` : ""}${bits.length && people ? " — " : ""}${esc(people)}</div>
      </div>
      <span class="pill ${m.exit === "shipped" ? "pass" : ""}" style="margin-left:auto">${esc(m.exit ?? "…")}</span>
    </div>`;
}

async function renderMeetings() {
  const ms = await api("/api/meetings");
  main.innerHTML = `<h1>Meetings</h1><div class="sub">Every stitch stays on this laptop.</div>
    <div class="card">${ms.length ? ms.map(meetingRow).join("") : `<div class="empty">${SPOOL_SVG}Nothing here yet.</div>`}</div>`;
  wireMeetingLinks();
}

async function renderMeeting(id) {
  const { meeting, utterances, claims, runs, backlinks } = await api(`/api/meeting?id=${encodeURIComponent(id)}`);
  const byKind = (k) => claims.filter((c) => c.kind === k && c.gate === "passed");
  const blocked = claims.filter((c) => c.gate === "blocked");
  const hl = state.highlight;
  main.innerHTML = `
    <h1>${esc(meeting.title)}</h1>
    <div class="sub">${fmtDate(meeting.started_at)} · ${Math.round(meeting.duration_s / 60)} min · mode: ${esc(meeting.mode)}</div>
    ${meeting.summary ? `<div class="card"><h2>Summary</h2><p>${esc(meeting.summary)}</p></div>` : ""}
    <div class="card"><h2>Your notes · editable, saved locally</h2>
      <textarea class="notes" id="my-notes" placeholder="Type anything — your words live alongside the generated notes.">${esc(meeting.my_notes ?? "")}</textarea>
    </div>
    ${followUpCard(meeting, claims)}
    ${byKind("decision").length ? `<div class="card"><h2>Decisions</h2>${byKind("decision").map((c, i) => `
      <div class="claim">✓ ${esc(c.body.text)}
        <button class="copybtn" style="margin-left:8px;padding:2px 12px" data-share-decision="${i}">Share ↗</button>
      </div>`).join("")}</div>` : ""}
    ${byKind("action_item").length ? `<div class="card"><h2>Action items</h2>${byKind("action_item").map((c) => `
      <div class="claim"><b>${esc(c.body.owner ?? "?")}</b> — ${esc(c.body.task)}${c.body.due ? ` <span class="pill">due ${esc(c.body.due)}</span>` : ""}</div>`).join("")}</div>` : ""}
    ${byKind("risk").length ? `<div class="card"><h2>Risks</h2>${byKind("risk").map((c) => `
      <div class="claim">${esc(c.body.category)} · <span class="t-meta">"${esc(c.body.quote)}"</span></div>`).join("")}</div>` : ""}
    ${backlinks.length ? `<div class="card"><h2>Threaded to</h2>${backlinks.map((b) => `
      <span class="backlink" data-mid="${b.id}">${esc(b.title)} <span style="opacity:.6">via ${esc(b.via)}</span></span>`).join("")}</div>` : ""}
    <div class="card"><h2>Transcript</h2>
      ${utterances.map((u) => `
        <div class="utt ${hl && u.text.toLowerCase().includes(hl.toLowerCase().slice(0, 24)) ? "hl" : ""}">
          <div class="ts">${fmtTs(u.offset_s)}</div>
          <div class="who">${esc(u.speaker ?? u.speaker_role)}</div>
          <div>${esc(u.text)}</div>
        </div>`).join("")}
    </div>
    <div class="exit-line">Run exit: <span class="pill ${meeting.exit === "shipped" ? "pass" : "block"}">${esc(meeting.exit ?? "?")}</span>
      ${claims.filter((c) => c.gate === "passed").length} claims passed ·
      ${blocked.length} blocked by gates${blocked.length ? ` (${blocked.map((b) => esc(b.gate_reason)).join("; ")})` : ""}</div>`;
  state.highlight = null;
  wireMeetingLinks();
  wireNotesAutosave(id);
  const decisions = byKind("decision");
  const people = [...new Set(utterances.map((u) => u.speaker).filter(Boolean))];
  main.querySelectorAll("[data-share-decision]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const d = decisions[Number(btn.dataset.shareDecision)];
      shareDecisionCard(d.body.text, meeting, people);
    }));
}

/**
 * Growth loop: a decision becomes a beautiful 1200x630 PNG card.
 * Rendered locally on canvas — nothing leaves the laptop.
 */
function shareDecisionCard(text, meeting, people) {
  const W = 1200, H = 630, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  // card base
  x.fillStyle = "#f3efe7"; x.fillRect(0, 0, W, H);
  x.strokeStyle = "#1d1b16"; x.lineWidth = 6; x.strokeRect(14, 14, W - 28, H - 28);
  // stitched top thread
  x.strokeStyle = "#e8752e"; x.lineWidth = 5; x.setLineDash([16, 14]); x.lineCap = "round";
  x.beginPath(); x.moveTo(60, 92); x.quadraticCurveTo(W / 2, 130, W - 60, 92); x.stroke();
  x.setLineDash([]);
  x.fillStyle = "#8f8a7d"; x.font = "700 26px ui-rounded, system-ui";
  x.fillText("DECISION", 70, 68);
  // decision text, wrapped
  x.fillStyle = "#1d1b16"; x.font = "800 52px ui-rounded, system-ui";
  const words = text.split(" ");
  let line = "", y = 210;
  for (const w of words) {
    if (x.measureText(line + " " + w).width > W - 160) { x.fillText(line, 70, y); y += 66; line = w; }
    else line = line ? line + " " + w : w;
  }
  x.fillText(line, 70, y);
  // meta
  x.fillStyle = "#57534a"; x.font = "600 30px ui-rounded, system-ui";
  x.fillText(`${meeting.title} · ${fmtDate(meeting.started_at)}`, 70, H - 150);
  if (people.length) x.fillText(people.join(" · "), 70, H - 105);
  // attribution
  x.strokeStyle = "#e8752e"; x.lineWidth = 4; x.setLineDash([10, 9]);
  x.beginPath(); x.moveTo(70, H - 62); x.lineTo(240, H - 62); x.stroke(); x.setLineDash([]);
  x.fillStyle = "#8f8a7d"; x.font = "700 26px ui-rounded, system-ui";
  x.fillText("stitched by Threadline", 256, H - 53);
  const a = document.createElement("a");
  a.download = "threadline-decision.png";
  a.href = c.toDataURL("image/png");
  a.click();
}

function followUpCard(meeting, claims) {
  const actions = claims.filter((c) => c.kind === "action_item" && c.gate === "passed");
  const decisions = claims.filter((c) => c.kind === "decision" && c.gate === "passed");
  if (!actions.length && !decisions.length) return "";
  const lines = [
    `Hi all,`,
    ``,
    `Quick recap of "${meeting.title}":`,
    ``,
    ...(decisions.length ? ["What we decided:", ...decisions.map((d) => `• ${d.body.text}`), ""] : []),
    ...(actions.length ? ["Next steps:", ...actions.map((a) => `• ${a.body.owner ?? "TBD"}: ${a.body.task}${a.body.due ? ` (${a.body.due})` : ""}`), ""] : []),
    `Full notes attached. Shout if I missed anything.`,
  ];
  const draft = lines.join("\n");
  return `<div class="card"><h2>Follow-up draft · built only from what was said</h2>
    <div class="draft" id="draft-text">${esc(draft)}</div>
    <button class="copybtn" onclick="navigator.clipboard.writeText(document.getElementById('draft-text').textContent).then(()=>{this.textContent='Copied ✓';setTimeout(()=>this.textContent='Copy draft',1500)})">Copy draft</button>
  </div>`;
}

function wireNotesAutosave(meetingId) {
  const ta = $("#my-notes");
  if (!ta) return;
  let t;
  ta.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => fetch("/api/notes", { method: "POST", body: JSON.stringify({ id: meetingId, notes: ta.value }) }), 600);
  });
}

function wireMeetingLinks() {
  main.querySelectorAll("[data-mid]").forEach((el) =>
    el.addEventListener("click", () => {
      state.meetingId = el.dataset.mid;
      if (el.dataset.q) state.highlight = el.dataset.q;
      render();
      window.scrollTo(0, 0);
    }));
}

async function renderGraph() {
  const { nodes, edges } = await api("/api/graph");
  main.innerHTML = `<h1>Threads</h1>
    <div class="sub">${nodes.length} knots · ${edges.length} threads. Drag to explore; click a meeting to open it.</div>
    <div class="card" id="graph-wrap"><canvas id="graph"></canvas></div>
    <div class="legend"><span class="l-m">Meeting</span><span class="l-p">Person</span><span class="l-t">Topic</span>
      <button class="copybtn" style="margin-left:auto" id="export-graph">Share this brain ↗</button></div>`;
  const canvas = $("#graph"), wrap = $("#graph-wrap");
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const COLOR = { meeting: css.getPropertyValue("--node-meeting"), person: css.getPropertyValue("--node-person"), topic: css.getPropertyValue("--node-topic") };
  const INK = css.getPropertyValue("--ink"), INK3 = css.getPropertyValue("--ink-3"), THREAD = css.getPropertyValue("--thread"), SURFACE = css.getPropertyValue("--surface");

  const ns = nodes.map((n, i) => ({
    ...n, label: n.meeting_title ?? n.label,
    x: W / 2 + 180 * Math.cos((i / nodes.length) * 2 * Math.PI),
    y: H / 2 + 180 * Math.sin((i / nodes.length) * 2 * Math.PI),
    vx: 0, vy: 0, r: n.kind === "meeting" ? 22 : n.kind === "person" ? 13 : 9,
  }));
  const byId = Object.fromEntries(ns.map((n) => [n.id, n]));
  const es = edges.filter((e) => byId[e.src] && byId[e.dst]);
  let drag = null;

  function tick() {
    for (const a of ns) {
      for (const b of ns) {
        if (a === b) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = Math.max(dx * dx + dy * dy, 40);
        const f = 2600 / d2;
        a.vx += (dx / Math.sqrt(d2)) * f; a.vy += (dy / Math.sqrt(d2)) * f;
      }
      a.vx += (W / 2 - a.x) * 0.004; a.vy += (H / 2 - a.y) * 0.004;
    }
    for (const e of es) {
      const a = byId[e.src], b = byId[e.dst];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.max(Math.hypot(dx, dy), 1);
      const f = (d - 110) * 0.012;
      a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    }
    for (const n of ns) {
      if (n === drag) continue;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x = Math.max(n.r + 4, Math.min(W - n.r - 4, n.x + n.vx));
      n.y = Math.max(n.r + 4, Math.min(H - n.r - 4, n.y + n.vy));
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // threads: stitched dashed lines with a gentle sag, like real thread
    ctx.strokeStyle = THREAD; ctx.lineWidth = 2; ctx.setLineDash([7, 6]); ctx.lineCap = "round";
    for (const e of es) {
      const a = byId[e.src], b = byId[e.dst];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + Math.min(34, Math.hypot(b.x - a.x, b.y - a.y) * 0.12);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke();
    }
    ctx.setLineDash([]);
    for (const n of ns) {
      ctx.fillStyle = COLOR[n.kind] ?? INK3;
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
      ctx.beginPath();
      if (n.kind === "person") {
        const s = n.r;
        ctx.roundRect(n.x - s, n.y - s, s * 2, s * 2, 5);
      } else if (n.kind === "topic") {
        ctx.moveTo(n.x, n.y - n.r); ctx.lineTo(n.x + n.r, n.y); ctx.lineTo(n.x, n.y + n.r); ctx.lineTo(n.x - n.r, n.y); ctx.closePath();
      } else {
        ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI);
      }
      ctx.fill(); ctx.stroke();
      if (n.kind === "meeting" || n.kind === "person") {
        ctx.fillStyle = INK; ctx.font = "800 12px ui-rounded, system-ui"; ctx.textAlign = "center";
        const label = n.label.length > 22 ? n.label.slice(0, 21) + "…" : n.label;
        ctx.fillText(label, n.x, n.y + n.r + 16);
      }
    }
  }

  let frames = 0;
  (function loop() { tick(); draw(); if (++frames < 600 || drag) requestAnimationFrame(loop); else drawLabelsFinal(); })();
  function drawLabelsFinal() {
    draw();
    ctx.fillStyle = INK3; ctx.font = "700 11px ui-rounded, system-ui"; ctx.textAlign = "center";
    for (const n of ns) if (n.kind === "topic") ctx.fillText(n.label.length > 18 ? n.label.slice(0, 17) + "…" : n.label, n.x, n.y + n.r + 13);
  }

  const hit = (mx, my) => ns.find((n) => Math.hypot(n.x - mx, n.y - my) <= n.r + 4);
  canvas.addEventListener("mousedown", (ev) => {
    const r = canvas.getBoundingClientRect();
    drag = hit(ev.clientX - r.left, ev.clientY - r.top) ?? null;
    if (drag) requestAnimationFrame(function dl() { tick(); draw(); if (drag) requestAnimationFrame(dl); });
  });
  canvas.addEventListener("mousemove", (ev) => {
    const r = canvas.getBoundingClientRect();
    if (drag) { drag.x = ev.clientX - r.left; drag.y = ev.clientY - r.top; }
    else canvas.style.cursor = hit(ev.clientX - r.left, ev.clientY - r.top) ? "pointer" : "grab";
  });
  window.addEventListener("mouseup", () => { drag = null; });
  canvas.addEventListener("click", (ev) => {
    const r = canvas.getBoundingClientRect();
    const n = hit(ev.clientX - r.left, ev.clientY - r.top);
    if (n?.kind === "meeting") { state.meetingId = n.id; render(); }
  });

  // Growth loop: export the brain as a presentation-ready image.
  $("#export-graph").addEventListener("click", () => {
    const pad = 90, W2 = W + 40, H2 = H + pad + 70;
    const out = document.createElement("canvas");
    out.width = W2 * dpr; out.height = H2 * dpr;
    const o = out.getContext("2d");
    o.scale(dpr, dpr);
    o.fillStyle = "#f3efe7"; o.fillRect(0, 0, W2, H2);
    o.strokeStyle = "#1d1b16"; o.lineWidth = 4; o.strokeRect(8, 8, W2 - 16, H2 - 16);
    o.fillStyle = "#1d1b16"; o.font = "800 30px ui-rounded, system-ui";
    o.fillText("My meeting brain", 30, 52);
    o.fillStyle = "#8f8a7d"; o.font = "700 16px ui-rounded, system-ui";
    o.fillText(`${ns.filter((n) => n.kind === "meeting").length} meetings · ${ns.filter((n) => n.kind === "person").length} people · ${ns.filter((n) => n.kind === "topic").length} topics — stitched by Threadline`, 30, 76);
    o.drawImage(canvas, 0, 0, canvas.width, canvas.height, 20, pad, W, H);
    const a = document.createElement("a");
    a.download = "threadline-brain.png";
    a.href = out.toDataURL("image/png");
    a.click();
  });
}

// Growth loop: long excerpts copied from notes carry a quiet attribution.
document.addEventListener("copy", (e) => {
  const sel = document.getSelection()?.toString() ?? "";
  if (sel.length < 140 || !e.clipboardData) return;
  e.clipboardData.setData("text/plain", `${sel}\n\n— stitched by Threadline`);
  e.preventDefault();
});

// ── Live recording ──────────────────────────────────────────────────────
const recBtn = $("#rec");
let recording = false, evtSource = null;

recBtn.addEventListener("click", async () => {
  if (!recording) {
    const title = prompt("Meeting title?", "Untitled meeting");
    if (title === null) return;
    const r = await fetch("/api/record/start", { method: "POST", body: JSON.stringify({ title }) }).then((x) => x.json());
    if (r.error) return alert(r.error);
    recording = true;
    recBtn.textContent = "■ Stop & stitch";
    recBtn.classList.add("recording");
    renderLive(title);
  } else {
    recBtn.textContent = "… stitching";
    recBtn.disabled = true;
    const liveNotes = $("#live-notes")?.value ?? "";
    const r = await fetch("/api/record/stop", { method: "POST" }).then((x) => x.json());
    if (r.meetingId && liveNotes.trim())
      await fetch("/api/notes", { method: "POST", body: JSON.stringify({ id: r.meetingId, notes: liveNotes }) });
    recording = false;
    recBtn.disabled = false;
    recBtn.textContent = "● Record";
    recBtn.classList.remove("recording");
    evtSource?.close();
    if (r.meetingId && r.exit !== "failed") { state.meetingId = r.meetingId; render(); }
    else { alert("Nothing was captured — check mic/screen-recording permissions."); render(); }
  }
});

function renderLive(title) {
  main.innerHTML = `<h1>${esc(title)}</h1><div class="sub">Recording — no bot in your call. Words land as they're said.</div>
    <div class="card"><h2>Your notes · type while you talk</h2>
      <textarea class="notes" id="live-notes" placeholder="Jot anything — it's saved with the meeting when you stop."></textarea></div>
    <div class="card"><h2>Live transcript</h2><div id="live-feed"><div class="empty">${SPOOL_SVG}listening…</div></div></div>
    <div class="card"><h2>Capture status</h2><div id="live-status"></div></div>`;
  const feed = $("#live-feed"), statusBox = $("#live-status");
  const partials = {};
  evtSource = new EventSource("/api/record/events");
  evtSource.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    if (e.type === "status") {
      statusBox.insertAdjacentHTML("beforeend", `<div class="live-status">${esc(e.message)}</div>`);
    } else if (e.type === "partial") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      let el = partials[e.speaker];
      if (!el) {
        feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}" id="p-${e.speaker}"><div class="who">${e.speaker}</div><div class="live-partial"></div></div>`);
        el = partials[e.speaker] = feed.lastElementChild;
      }
      el.querySelector(".live-partial").textContent = e.text;
    } else if (e.type === "final") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      const el = partials[e.speaker];
      if (el) { delete partials[e.speaker]; el.remove(); }
      feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="ts">${fmtTs(e.offsetS)}</div><div class="who">${e.speaker}</div><div>${esc(e.text)}</div></div>`);
      window.scrollTo(0, document.body.scrollHeight);
    }
  };
}

let searchTimer;
$("#search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) return render();
  searchTimer = setTimeout(async () => {
    const hits = await api(`/api/search?q=${encodeURIComponent(q)}`);
    main.innerHTML = `<h1>“${esc(q)}”</h1><div class="sub">${hits.length} meeting${hits.length === 1 ? "" : "s"} on this thread</div>
      <div class="card">${hits.length ? hits.map((h) => `
        <div class="m-row" data-mid="${h.id}">
          <div class="m-date">${fmtDate(h.started_at)}</div>
          <div><div class="m-title">${esc(h.title)}</div><div class="t-meta">${h.hit}</div></div>
        </div>`).join("") : `<div class="empty">${SPOOL_SVG}No thread found — it searches every word of every meeting.</div>`}</div>`;
    wireMeetingLinks();
  }, 250);
});

render();
</script>
