<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadline</title>
<!-- carries an id, not a bare tag, so the build check's script-extracting regex
     still isolates the app script at the bottom of the file -->
<script id="tl-theme-boot">
  /* Theme, applied BEFORE first paint so the app never flashes the wrong one.
     localStorage "tl-theme" holds "auto" | "light" | "dark"; "auto" resolves
     against the OS preference and re-resolves whenever the OS flips. */
  (function () {
    var KEY = "tl-theme";
    window.__tlThemePref = function () {
      try { var v = localStorage.getItem(KEY); return v === "light" || v === "dark" ? v : "auto"; }
      catch (e) { return "auto"; }
    };
    window.__tlApplyTheme = function () {
      var pref = window.__tlThemePref();
      var resolved = pref === "auto"
        ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : pref;
      document.documentElement.setAttribute("data-theme", resolved);
      return { pref: pref, resolved: resolved };
    };
    window.__tlApplyTheme();
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (window.__tlThemePref() === "auto") {
          window.__tlApplyTheme();
          window.dispatchEvent(new CustomEvent("tl-theme"));
        }
      });
    } catch (e) { /* older Safari: auto simply won't live-update */ }
  })();
</script>
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     THEME TOKENS — warm porcelain (light) and warm espresso (dark).

     Light lives on :root. Dark is declared TWICE, on purpose:
       1. :root[data-theme="dark"]              — the explicit choice
       2. @media dark { :root:not([data-theme="light"]) } — the no-JS fallback
     The <head> boot script normally stamps an explicit data-theme before first
     paint, so (2) only matters if scripts are blocked. THE TWO DARK BLOCKS ARE
     IDENTICAL — edit one, edit the other.
     ═══════════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: light;
    --is-dark: 0;
    --bg: #f6f4f1;              /* warm porcelain */
    --surface: #fffdfa;
    --ink: #1e1c19;             /* warm black */
    --ink-2: #57534c;
    --ink-3: #8e8880;
    --thread: #5b74e0;          /* the thread */
    --thread-soft: #ecedfa;
    --thread-press: color-mix(in srgb, var(--thread) 85%, #000);
    --warm: #e8752e;
    --pass: #3d8b68; --block: #cf5a52;
    --rec: #e0443e;             /* the recording red, as ink */
    --red: #ff5f57;             /* the "now" dot */
    --red-ink: #d0433c;
    --red-wash: color-mix(in srgb, #ff5f57 13%, transparent);
    --line: rgba(74, 62, 48, 0.13);   /* warm hairline */
    --shadow: 0 1px 2px rgb(58 44 28 / 0.05), 0 8px 32px rgb(58 44 28 / 0.09);
    --shadow-sm: 0 1px 2px rgb(58 44 28 / .06), 0 1px 1px rgb(58 44 28 / .04);
    --shadow-lift: 0 2px 6px rgb(58 44 28 / .09), 0 12px 34px rgb(58 44 28 / .14);
    --shadow-pop: 0 2px 6px rgb(60 50 30 / 0.06), 0 16px 44px rgb(30 25 15 / 0.14);
    --shadow-panel: 0 24px 80px rgb(45 34 22 / 0.28), 0 2px 6px rgb(45 34 22 / .09);
    --veil: rgb(38 30 22 / 0.26);

    /* ── glass ── */
    --card: rgba(255, 253, 250, 0.72);
    --pal-bg: rgba(255, 253, 250, 0.82);
    --card-solid: #fffdfa;
    --glass-border: rgba(255, 252, 246, 0.6);
    --glass-blur: blur(24px) saturate(1.7);
    --chrome: rgba(252, 250, 246, 0.72);
    --hover: rgba(74, 62, 48, 0.06);
    --sunk: rgba(74, 62, 48, 0.045);
    --radius: 18px;
    --radius-sm: 11px;

    /* ── gradient accents ── */
    --grad-blue: linear-gradient(135deg, #eaedfb, #dde3f8);
    --grad-peach: linear-gradient(135deg, #ffefe0, #ffe1cd);
    --grad-mint: linear-gradient(135deg, #e6f7ec, #d7f0e0);
    --grad-lilac: linear-gradient(135deg, #f3eaff, #e8ddfa);
    --grad-record: linear-gradient(135deg, #ff5f57, #e0443e);

    /* ── the thread props: spool, brain nodes, mindmap branches ── */
    --spool: #efeae2; --spool-line: rgb(33 32 28 / 0.14);
    --node-topic: #cf9a35; --node-person: #a39e94;
    --mm-meet: #5b74e0; --mm-people: #1baf7a; --mm-dec: #eb6834;
    --mm-open: #e87ba4; --mm-topic: #cf9a35;

    /* ── shell metrics ── */
    --hdr-h: 58px;
    --side-w: 248px;
    --side-w-collapsed: 64px;

    /* corner wash behind everything */
    --wash:
      radial-gradient(900px 620px at 6% -8%, #f0eefa 0%, transparent 62%),
      radial-gradient(820px 560px at 104% 4%, #fdf1e5 0%, transparent 60%),
      radial-gradient(760px 620px at 88% 104%, #f1f4ec 0%, transparent 62%);
  }

  /* ── DARK (1 of 2): the explicit choice ── */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --is-dark: 1;
    --bg: #181512;              /* warm charcoal */
    --surface: #1f1c18;
    --ink: #f1ece4;
    --ink-2: #b4aa9c;
    --ink-3: #8b8175;
    --thread: #93a4f2;          /* lighter periwinkle: 1.3px strokes must survive */
    --thread-soft: #2b2e46;
    --thread-press: color-mix(in srgb, var(--thread) 82%, #fff);
    --warm: #f0954f;
    --pass: #5cbf92; --block: #e8867c;
    --rec: #ff7166;
    --red: #ff7166;
    --red-ink: #ffa79e;
    --red-wash: color-mix(in srgb, #ff5f57 18%, transparent);
    --line: rgba(255, 246, 235, 0.11);
    --shadow: 0 1px 2px rgb(0 0 0 / 0.42), 0 10px 36px rgb(0 0 0 / 0.44);
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .45), 0 1px 1px rgb(0 0 0 / .3);
    --shadow-lift: 0 2px 6px rgb(0 0 0 / .45), 0 14px 38px rgb(0 0 0 / .5);
    --shadow-pop: 0 2px 6px rgb(0 0 0 / 0.4), 0 18px 48px rgb(0 0 0 / 0.5);
    --shadow-panel: 0 26px 84px rgb(0 0 0 / 0.62), 0 2px 6px rgb(0 0 0 / .4);
    --veil: rgb(10 7 4 / 0.55);

    --card: rgba(40, 36, 31, 0.66);
    --pal-bg: rgba(42, 37, 32, 0.9);
    --card-solid: #241f1b;
    --glass-border: rgba(255, 246, 235, 0.09);
    --chrome: rgba(26, 23, 19, 0.74);
    --hover: rgba(255, 246, 235, 0.07);
    --sunk: rgba(255, 246, 235, 0.05);

    --grad-blue: linear-gradient(135deg, #262b45, #1e2235);
    --grad-peach: linear-gradient(135deg, #3b2a1e, #2c2017);
    --grad-mint: linear-gradient(135deg, #1e3229, #172720);
    --grad-lilac: linear-gradient(135deg, #2f2643, #241d34);

    --spool: #3b352c; --spool-line: rgb(255 246 235 / 0.18);
    --node-topic: #e0b356; --node-person: #9b9184;
    --mm-meet: #8fa2f2; --mm-people: #4fce9d; --mm-dec: #f5885a;
    --mm-open: #f09cbd; --mm-topic: #e0b356;

    --wash:
      radial-gradient(900px 620px at 6% -8%, #23212f 0%, transparent 62%),
      radial-gradient(820px 560px at 104% 4%, #2b2118 0%, transparent 60%),
      radial-gradient(760px 620px at 88% 104%, #1c2620 0%, transparent 62%);
  }

  /* ── DARK (2 of 2): system preference, no explicit choice (no-JS fallback) ── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --is-dark: 1;
      --bg: #181512;
      --surface: #1f1c18;
      --ink: #f1ece4;
      --ink-2: #b4aa9c;
      --ink-3: #8b8175;
      --thread: #93a4f2;
      --thread-soft: #2b2e46;
      --thread-press: color-mix(in srgb, var(--thread) 82%, #fff);
      --warm: #f0954f;
      --pass: #5cbf92; --block: #e8867c;
      --rec: #ff7166;
      --red: #ff7166;
      --red-ink: #ffa79e;
      --red-wash: color-mix(in srgb, #ff5f57 18%, transparent);
      --line: rgba(255, 246, 235, 0.11);
      --shadow: 0 1px 2px rgb(0 0 0 / 0.42), 0 10px 36px rgb(0 0 0 / 0.44);
      --shadow-sm: 0 1px 2px rgb(0 0 0 / .45), 0 1px 1px rgb(0 0 0 / .3);
      --shadow-lift: 0 2px 6px rgb(0 0 0 / .45), 0 14px 38px rgb(0 0 0 / .5);
      --shadow-pop: 0 2px 6px rgb(0 0 0 / 0.4), 0 18px 48px rgb(0 0 0 / 0.5);
      --shadow-panel: 0 26px 84px rgb(0 0 0 / 0.62), 0 2px 6px rgb(0 0 0 / .4);
      --veil: rgb(10 7 4 / 0.55);

      --card: rgba(40, 36, 31, 0.66);
      --pal-bg: rgba(42, 37, 32, 0.9);
      --card-solid: #241f1b;
      --glass-border: rgba(255, 246, 235, 0.09);
      --chrome: rgba(26, 23, 19, 0.74);
      --hover: rgba(255, 246, 235, 0.07);
      --sunk: rgba(255, 246, 235, 0.05);

      --grad-blue: linear-gradient(135deg, #262b45, #1e2235);
      --grad-peach: linear-gradient(135deg, #3b2a1e, #2c2017);
      --grad-mint: linear-gradient(135deg, #1e3229, #172720);
      --grad-lilac: linear-gradient(135deg, #2f2643, #241d34);

      --spool: #3b352c; --spool-line: rgb(255 246 235 / 0.18);
      --node-topic: #e0b356; --node-person: #9b9184;
      --mm-meet: #8fa2f2; --mm-people: #4fce9d; --mm-dec: #f5885a;
      --mm-open: #f09cbd; --mm-topic: #e0b356;

      --wash:
        radial-gradient(900px 620px at 6% -8%, #23212f 0%, transparent 62%),
        radial-gradient(820px 560px at 104% 4%, #2b2118 0%, transparent 60%),
        radial-gradient(760px 620px at 88% 104%, #1c2620 0%, transparent 62%);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    background-image: var(--wash); background-attachment: fixed;
    font: 14.5px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overflow-x: hidden;
  }
  .ic { display: inline-block; flex: none; vertical-align: -0.16em; }

  /* ── slim glass toolbar ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 0 clamp(12px, 2vw, 22px); height: var(--hdr-h);
    position: sticky; top: 0; z-index: 25;
    background: var(--chrome);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 16px; letter-spacing: -0.02em; }
  .logo svg { display: block; }
  .hspacer { flex: 1; }

  /* ── generic icon button ── */
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 32px; height: 32px; padding: 0; flex: none;
    border: 1px solid transparent; border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--ink-2); font: inherit;
    transition: background .14s, color .14s, border-color .14s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn.bordered { border-color: var(--line); background: var(--card); }
  .icon-btn:disabled { opacity: .45; cursor: default; }
  #nav-toggle { display: none; }

  /* ── the record button: one component, everywhere ── */
  /* the header pill is always visible: Record at rest, the red Stop control
     while a take is live (however it was started) */
  .rec-btn {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    border: 1px solid var(--glass-border); border-radius: 999px;
    background: var(--card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    color: var(--ink); font: inherit; font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em;
    padding: 7px 16px 7px 13px; cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s, background .2s, color .2s;
  }
  .rec-btn::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--grad-record); box-shadow: 0 0 0 0 rgb(224 68 62 / 0.5);
  }
  .rec-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
  .rec-btn:disabled { opacity: .6; cursor: default; transform: none; }
  .rec-btn.on, .rec-btn.recording {
    background: var(--grad-record); border-color: rgb(224 68 62 / .6); color: #fff;
    box-shadow: 0 2px 10px rgb(224 68 62 / .32);
  }
  .rec-btn.on::before, .rec-btn.recording::before {
    background: #fff; animation: rec-pulse 1.7s ease-out infinite;
  }
  @keyframes rec-pulse {
    0%   { box-shadow: 0 0 0 0 rgb(255 255 255 / 0.65); }
    70%  { box-shadow: 0 0 0 7px rgb(255 255 255 / 0); }
    100% { box-shadow: 0 0 0 0 rgb(255 255 255 / 0); }
  }
  @keyframes pulse { 50% { opacity: 0.75; } }

  /* ── shell ── */
  .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--hdr-h)); }
  .shell.side-collapsed { grid-template-columns: var(--side-w-collapsed) minmax(0, 1fr); }
  #side {
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px 10px 10px; position: sticky; top: var(--hdr-h);
    height: calc(100vh - var(--hdr-h)); overflow-y: auto; overflow-x: hidden;
    border-right: 1px solid var(--line);
    background: var(--chrome);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    transition: transform .26s cubic-bezier(.32,.72,.3,1);
  }
  .side-top { display: flex; align-items: center; justify-content: flex-end; padding: 0 2px 4px; }
  .side-collapsed .side-top { justify-content: center; }
  #side-toggle .ic { transition: transform .2s; }
  .side-collapsed #side-toggle .ic { transform: rotate(180deg); }

  /* the "Search ⌘K" pill in the rail */
  .side-search {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 1px solid var(--line); border-radius: 10px; background: var(--sunk);
    color: var(--ink-2); font: inherit; font-size: 13.5px; font-weight: 500;
    padding: 7px 9px; margin-bottom: 10px; cursor: pointer;
    transition: background .14s, border-color .14s, color .14s;
  }
  .side-search:hover { background: var(--hover); color: var(--ink); border-color: color-mix(in srgb, var(--thread) 32%, var(--line)); }
  .kbd {
    font: 600 10.5px/1 -apple-system, system-ui; color: var(--ink-3);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px;
    background: var(--card-solid); letter-spacing: 0;
  }
  .side-search .kbd { margin-left: auto; }

  .side-section { margin-bottom: 16px; }
  .side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
  .side-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
    font-weight: 700; padding: 0 10px 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .side-head .lbl { display: inline-flex; align-items: center; gap: 6px; }
  .side-head button {
    border: 0; background: none; border-radius: 7px; width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; line-height: 1; color: var(--ink-3); flex: none;
  }
  .side-head button:hover { color: var(--thread); background: var(--thread-soft); }
  .side-link {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 0; background: none;
    color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 10px; border-radius: 10px; cursor: pointer; transition: background .12s, color .12s;
  }
  .side-link > .ic { color: var(--ink-3); transition: color .12s; }
  .side-link .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-link:hover { color: var(--ink); background: var(--hover); }
  .side-link:hover > .ic { color: var(--ink-2); }
  .side-link.active {
    background: var(--card-solid); color: var(--ink); font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .side-link.active > .ic { color: var(--thread); }
  .side-empty { padding: 2px 12px; font-size: 12.5px; color: var(--ink-3); }

  /* profile block, pinned bottom — click opens Profile / Developer docs */
  .profile { display: flex; align-items: center; gap: 9px; padding: 4px 6px 8px; cursor: pointer; border-radius: 10px; transition: background .14s; }
  .profile:hover { background: var(--hover); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-content: center;
    background: var(--grad-blue); color: var(--thread); font-weight: 700; font-size: 12.5px;
    border: 1px solid var(--glass-border); overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .pname { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #google-btn {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: 1px solid var(--line); background: var(--card); font: inherit; font-weight: 500; font-size: 13px;
    padding: 7px 10px; border-radius: 10px; cursor: pointer; color: var(--ink-2); text-align: left;
    transition: border-color .15s, color .15s, background .15s;
  }
  #google-btn:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); background: var(--hover); }
  #google-btn:disabled { cursor: default; color: var(--pass); }
  #google-btn .gb-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* collapsed icon rail */
  .side-collapsed #side { padding: 12px 8px 10px; }
  .side-collapsed .side-search { justify-content: center; padding: 7px 0; }
  .side-collapsed .side-search .lbl, .side-collapsed .side-search .kbd { display: none; }
  .side-collapsed .side-link { justify-content: center; padding: 9px 0; gap: 0; }
  .side-collapsed .side-link .lbl, .side-collapsed .side-link .sub-count { display: none; }
  .side-collapsed .side-head { justify-content: center; padding: 0 0 6px; }
  .side-collapsed .side-head .lbl { display: none; }
  .side-collapsed .profile { justify-content: center; padding: 4px 0 8px; }
  .side-collapsed .pname, .side-collapsed #theme-btn { display: none; }
  .side-collapsed #google-btn { justify-content: center; padding: 7px 0; }
  .side-collapsed #google-btn .gb-label { display: none; }
  .side-collapsed .side-empty { display: none; }

  #side-scrim {
    position: fixed; inset: 0; z-index: 19; background: var(--veil);
    backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .22s;
  }

  main { max-width: min(1120px, 100%); margin: 0 auto; padding: clamp(20px, 3.4vw, 40px) clamp(16px, 3vw, 36px) 90px; width: 100%; }

  /* ── typography ── */
  main h1, .page-title {
    font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
    font-size: clamp(26px, 3vw, 34px); font-weight: 600; letter-spacing: -0.02em;
    line-height: 1.14; margin-bottom: 6px;
  }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 6px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-3);
  }
  .num, .stat b, .m-date, .pal-row .meta { font-variant-numeric: tabular-nums; }
  .sub { color: var(--ink-2); font-size: 14px; margin-bottom: clamp(18px, 2.4vw, 28px); }

  .card {
    background: var(--card); border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-radius: var(--radius); padding: clamp(16px, 2.2vw, 24px) clamp(16px, 2.4vw, 26px);
    margin-bottom: 34px; box-shadow: var(--shadow);
  }
  .card h2 {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 15px; letter-spacing: -0.01em; color: var(--ink);
    margin-bottom: 14px; font-weight: 650;
  }
  .card h2 .h2-note { font-size: 12.5px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  /* ── Home: gradient stat cards ── */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: clamp(12px, 1.6vw, 18px); margin: 4px 0 clamp(18px, 2.4vw, 24px);
  }
  .stat {
    background: var(--grad-blue); border: 1px solid var(--glass-border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: clamp(14px, 1.9vw, 18px) clamp(15px, 2vw, 20px); min-width: 0;
  }
  .stat.s-peach { background: var(--grad-peach); }
  .stat.s-mint { background: var(--grad-mint); }
  .stat.s-lilac { background: var(--grad-lilac); }
  .stat .ic { display: block; color: var(--ink-2); opacity: calc(.72 + var(--is-dark) * .22); margin-bottom: clamp(12px, 2vw, 20px); }
  .stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; }
  .stat span { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }

  .home-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (min-width: 1100px) { .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ── Home: Up next, Granola "Coming up" ── */
  .card h2.serif-h {
    font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
    font-size: 19px; font-weight: 600; letter-spacing: -0.02em;
  }
  .up-lead { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 14px; padding: 2px 0 4px; align-items: start; }
  .up-cal { text-align: center; padding-top: 1px; }
  .up-daynum {
    font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
    font-size: 34px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .up-mon { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-top: 5px; }
  .up-dow { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .up-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-right: 5px; vertical-align: 1px; }
  .up-body { position: relative; padding-left: 15px; min-width: 0; }
  .up-tick { position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 3px; background: var(--thread); opacity: .85; }
  .up-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; }
  .up-line { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 5px; }
  .up-time { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .up-time .ampm { font-size: 10.5px; letter-spacing: .04em; margin-left: 2px; }
  .up-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 8px; white-space: nowrap;
  }
  .up-chip .ic { color: var(--ink-3); }
  .up-chip.now { border-color: transparent; background: var(--red-wash); color: var(--red-ink); font-weight: 650; }
  .up-chip.soon { border-color: transparent; background: var(--thread-soft); color: var(--thread); font-weight: 600; }
  .up-people { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .up-slim {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    position: relative; padding: 10px 0 10px 15px; border-top: 1px solid var(--line); margin-top: 12px;
  }
  .up-slim + .up-slim { margin-top: 0; }
  .up-slim .up-tick { top: 12px; bottom: 12px; opacity: .38; }
  .up-slim .s-time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
  .up-slim .s-title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; min-width: 0; }
  .up-slim .s-people { font-size: 12px; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Home: past meetings, grouped by day ── */
  .day-head { margin: 16px 0 2px; }
  .day-head:first-child { margin-top: 0; }
  .mtg-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; cursor: pointer; }
  .mtg-row + .mtg-row { border-top: 1px solid var(--line); }
  .mtg-ico {
    width: 32px; height: 32px; border-radius: 10px; flex: none; margin-top: 1px;
    background: var(--sunk); border: 1px solid var(--line); color: var(--ink-3);
    display: grid; place-content: center;
  }
  .mtg-row:hover .mtg-ico { color: var(--thread); }
  .mtg-main { flex: 1; min-width: 0; }
  .mtg-title { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; transition: color .12s; }
  .mtg-row:hover .mtg-title { color: var(--thread); }
  .mtg-sum {
    font-size: 12.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mtg-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; margin-top: 1px; }
  .mtg-time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px; }
  .mtg-time .ic { color: var(--ink-3); opacity: .8; }
  .mtg-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .mtg-meta b { color: var(--ink-2); font-weight: 600; }
  @media (max-width: 560px) {
    /* two-up so the stats stay a row, not a tower */
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat .ic { margin-bottom: 10px; }
  }
  @media (max-width: 520px) {
    .mtg-row { flex-wrap: wrap; }
    .mtg-side { flex: 1 1 100%; flex-direction: row; align-items: center; padding-left: 44px; margin-top: 6px; justify-content: flex-start; gap: 10px; }
  }

  /* ── the centered search pill (Home / Meetings) ── */
  .search-pill {
    display: flex; align-items: center; gap: 10px;
    width: 100%; max-width: 560px; margin: 0 auto clamp(20px, 3vw, 30px);
    border: 1px solid var(--glass-border); border-radius: 999px;
    background: var(--card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--shadow); cursor: pointer;
    padding: 11px 14px 11px 17px; color: var(--ink-3); font: inherit; font-size: 14px; text-align: left;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .search-pill:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
  .search-pill .ic { color: var(--ink-3); }
  .search-pill .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Meetings: the list's own filter bar (text + topic chips) ── */
  .filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
  .fb-field {
    display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 0;
    background: var(--card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border); border-radius: 999px; box-shadow: var(--shadow);
    padding: 8px 14px; transition: border-color .15s, box-shadow .15s;
  }
  .fb-field .ic { color: var(--ink-3); flex: none; }
  .fb-field:focus-within { border-color: color-mix(in srgb, var(--thread) 50%, var(--line)); box-shadow: var(--shadow-lift); }
  .fb-field input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    font: inherit; font-size: 14px; color: var(--ink);
  }
  .fb-field input::placeholder { color: var(--ink-3); }
  .fb-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .fchip {
    font: inherit; font-size: 12px; font-weight: 550; cursor: pointer; white-space: nowrap;
    max-width: 22ch; overflow: hidden; text-overflow: ellipsis;
    color: var(--ink-2); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; transition: color .12s, background .12s, border-color .12s;
  }
  .fchip:hover { color: var(--thread); border-color: color-mix(in srgb, var(--thread) 45%, var(--line)); }
  .fchip.on { background: var(--thread); border-color: var(--thread); color: #fff; font-weight: 650; }
  .fb-clear {
    font: inherit; font-size: inherit; cursor: pointer; color: var(--thread);
    background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px;
  }
  /* the filter hides rows in place; .mtg-row's own display would beat [hidden] */
  .mtg-row[hidden], .day-head[hidden], .empty[hidden] { display: none; }
  .mtg-row.mtg-first { border-top: 0; }
  @media (max-width: 560px) {
    .filterbar { gap: 8px; }
    .fb-field { flex: 1 1 100%; }
    .fb-chips { flex: 1 1 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; scrollbar-width: none; }
    .fb-chips::-webkit-scrollbar { display: none; }
  }

  /* ── meeting detail: the chip row under the title ── */
  .chip-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0 2px; }
  button.up-chip { font: inherit; font-size: 11.5px; cursor: pointer; background: var(--card); }
  button.up-chip:hover { border-color: color-mix(in srgb, var(--thread) 45%, var(--line)); color: var(--thread); }
  button.up-chip:hover .ic { color: var(--thread); }
  .up-chip .who { max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── glass popovers & dropdowns (time editor, topic picker, ⋯ menu) ── */
  .glass-pop {
    position: absolute; z-index: 60; min-width: 250px;
    background: var(--card); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px; font-size: 13px;
  }
  .glass-pop.menu { padding: 6px; min-width: 216px; }
  .pop-title {
    display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 2px 2px 10px;
  }
  .pop-lbl { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
  .pop-lbl input {
    display: block; width: 100%; margin-top: 5px; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 6px 9px; box-sizing: border-box;
  }
  .pop-lbl input:focus { outline: none; border-color: color-mix(in srgb, var(--thread) 50%, var(--line)); }
  .pop-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .pop-actions .copybtn { margin-top: 2px; }
  .pop-actions .primary { background: var(--thread); border-color: var(--thread); color: #fff; font-weight: 600; }
  .pop-actions .primary:hover { background: var(--thread-press); color: #fff; }
  .glass-pop .topic-select { width: 100%; max-width: none; font-size: 13px; padding: 7px 9px; color: var(--ink); }
  .menu-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: none; background: none; font: inherit; font-size: 13px; color: var(--ink);
    padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .menu-row .ic { color: var(--ink-3); flex: none; }
  .menu-row:hover { background: var(--hover); }
  .menu-row:hover .ic { color: var(--thread); }
  .menu-row.danger { color: var(--block); }
  .menu-row.danger .ic { color: var(--block); }
  .menu-row.danger:hover { background: color-mix(in srgb, var(--block) 12%, transparent); }
  .menu-row.danger:hover .ic { color: var(--block); }
  .menu-sep { height: 1px; background: var(--line); margin: 6px 6px; }

  /* ── responsive: sidebar becomes a drawer ── */
  @media (max-width: 900px) {
    .shell, .shell.side-collapsed { grid-template-columns: minmax(0, 1fr); }
    #nav-toggle { display: inline-flex; }
    #side {
      position: fixed; left: 0; top: var(--hdr-h); z-index: 20;
      width: min(280px, 84vw); transform: translateX(-102%);
      box-shadow: 12px 0 40px rgb(16 24 40 / .16), var(--shadow-panel);
    }
    .side-collapsed #side { padding: 12px 10px 10px; }
    .side-collapsed .side-link { justify-content: flex-start; padding: 8px 10px; gap: 10px; }
    .side-collapsed .side-link .lbl, .side-collapsed .side-search .lbl,
    .side-collapsed .pname, .side-collapsed #google-btn .gb-label,
    .side-collapsed .side-head .lbl, .side-collapsed .side-empty { display: revert; }
    .side-collapsed .side-head .lbl { display: inline-flex; }
    .side-collapsed .side-search, .side-collapsed #google-btn { justify-content: flex-start; padding: 7px 10px; }
    .side-collapsed .profile { justify-content: flex-start; padding: 4px 6px 8px; }
    .side-collapsed #theme-btn { display: inline-flex; }
    .side-top { display: none; }
    body.drawer-open #side { transform: none; }
    body.drawer-open #side-scrim { opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 640px) {
    .card { border-radius: 15px; }
    .rec-btn { padding: 7px 13px 7px 11px; font-size: 13px; }
    /* meeting rows: the date gets its own line so the title isn't squeezed */
    .m-row { flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .m-row > .m-date { min-width: 100%; }
    .m-row > div:not(.m-date) { flex: 1 1 auto; min-width: 0; }
  }

  /* ── thread: a fine silk line, not a dash ── */
  .loose-rail { position: relative; padding-left: 26px; }
  .rail-svg, .weave-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
  .weave-svg { z-index: 1; }
  /* the checkbox is the eyelet: it sits above the thread so the thread
     disappears behind it mid-weave and re-emerges on the other side */
  .todo input { position: relative; z-index: 2; }
  .needle-flyer { position: absolute; z-index: 3; pointer-events: none; filter: drop-shadow(0 1px 1px rgb(40 40 60 / 0.2)); }
  .receipt::before {
    content: ""; display: inline-block; width: 14px; height: 1.5px; margin: 0 8px 0 0; vertical-align: 4px; border-radius: 2px;
    background: color-mix(in srgb, var(--thread) 50%, transparent);
  }
  .todo.done .receipt::before { background: var(--thread); }
  .stitch-connector { display: block; margin: -24px 0 -2px 56px; }
  #rail-needle {
    position: absolute; left: -11px; top: -12px; z-index: 3; pointer-events: none;
    filter: drop-shadow(0 1px 1px rgb(40 40 60 / 0.18));
    transition: opacity .25s;
  }
  .open-stitch { display: none; width: 18px; height: 1.5px; margin-left: 10px; vertical-align: 4px; border-radius: 2px;
    background: color-mix(in srgb, var(--thread) 50%, transparent); }
  .m-row:hover .open-stitch { display: inline-block; }

  .todo { display: flex; gap: 13px; padding: 13px 0; align-items: flex-start; }
  .todo + .todo { border-top: 1px solid var(--line); }
  /* the checkbox is a cloth eyelet: a round hole with a stitched rim */
  .todo input {
    appearance: none; -webkit-appearance: none; margin-top: 3px; width: 19px; height: 19px;
    border-radius: 50%; border: 2px solid var(--ink-3); background: transparent;
    cursor: pointer; flex: none; transition: border-color .2s;
    box-shadow: inset 0 1px 2.5px rgb(0 0 0 / calc(0.14 + var(--is-dark) * 0.24));
  }
  .todo input { display: grid; place-content: center; }
  .todo input:checked { border-color: var(--thread); }
  .todo input:checked::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--thread); }
  .todo.done .t-task { text-decoration: line-through; color: var(--ink-3); }
  .t-task { font-weight: 620; font-size: 15px; letter-spacing: -0.008em; }
  .t-meta { color: var(--ink-3); font-size: 12.5px; margin-top: 1px; }
  .receipt {
    font-size: 12.5px; color: var(--ink-3); margin-top: 7px; cursor: pointer;
    padding: 2px 0; transition: color .12s; font-style: italic;
  }
  .receipt:hover { color: var(--thread); }

  .pill {
    display: inline-block; font-size: 11.5px; font-weight: 550; padding: 2.5px 10px; border-radius: 99px;
    background: color-mix(in srgb, var(--line) 55%, transparent); color: var(--ink-2);
  }
  .pill.pass { background: color-mix(in srgb, var(--pass) 12%, transparent); color: var(--pass); }
  .pill.block { background: color-mix(in srgb, var(--block) 12%, transparent); color: var(--block); }

  .m-row { display: flex; gap: 16px; padding: 14px 0; cursor: pointer; align-items: baseline; }
  .topic-select {
    appearance: none; -webkit-appearance: none; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink-3); font: 500 11.5px -apple-system, system-ui;
    padding: 3px 8px; cursor: pointer; max-width: 110px;
  }
  .topic-select:hover { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); color: var(--thread); }
  .m-row + .m-row { border-top: 1px solid var(--line); }
  .m-row:hover .m-title { color: var(--thread); }
  .m-title { font-weight: 570; font-size: 14.5px; transition: color .12s; }
  .m-date { color: var(--ink-3); font-size: 12.5px; min-width: 84px; font-variant-numeric: tabular-nums; }

  .utt { display: flex; gap: 14px; padding: 8px 0; }
  .utt.hl { background: var(--thread-soft); border-radius: 8px; padding: 8px 12px; margin: 0 -12px; }
  .utt .who { min-width: 72px; font-weight: 600; font-size: 12.5px; color: var(--ink-2); padding-top: 2px; }
  .utt .ts { color: var(--ink-3); font-size: 11.5px; min-width: 38px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .claim { padding: 10px 0; font-size: 14.5px; }
  .claim + .claim { border-top: 1px solid var(--line); }
  .backlink {
    display: inline-block; margin: 3px 8px 3px 0; padding: 5px 13px; border-radius: 9px;
    background: var(--thread-soft); color: var(--thread);
    cursor: pointer; font-size: 13px; font-weight: 550; transition: filter .12s;
  }
  .backlink:hover { filter: brightness(calc(0.96 + var(--is-dark) * 0.16)); }

  #graph-wrap { position: relative; height: 640px; overflow: hidden; padding: 0; }
  #graph-tip {
    position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; box-shadow: var(--shadow-pop); max-width: 220px; transition: opacity .12s;
  }
  #graph-tip b { display: block; font-weight: 650; font-size: 13px; letter-spacing: -0.01em; }
  #graph-tip span { color: var(--ink-3); font-size: 11.5px; }
  #brain-q {
    position: absolute; left: 14px; top: 14px; z-index: 2; width: 210px;
    border: 1px solid var(--line); border-radius: 9px; background: color-mix(in srgb, var(--surface) 92%, transparent);
    padding: 6px 11px; font: 12.5px -apple-system, system-ui; color: var(--ink); outline: none;
  }
  #brain-q:focus { border-color: color-mix(in srgb, var(--thread) 45%, var(--line)); }
  #brain-share {
    position: absolute; left: 236px; top: 14px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 9px; background: color-mix(in srgb, var(--surface) 92%, transparent);
    padding: 6px 12px; font: 550 12.5px -apple-system, system-ui; color: var(--ink-2); cursor: pointer;
  }
  #brain-share:hover { border-color: color-mix(in srgb, var(--thread) 45%, var(--line)); color: var(--thread); }
  #brain-share[hidden] { display: none; }
  #brain-share:disabled { opacity: .65; cursor: default; }
  #graph-ctl {
    position: absolute; right: 14px; bottom: 14px; z-index: 2;
    display: flex; flex-direction: column; gap: 6px;
  }
  #graph-ctl button {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-2); font-size: 15px; font-weight: 600;
    cursor: pointer; box-shadow: var(--shadow); line-height: 1;
  }
  #graph-ctl button:hover { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); color: var(--thread); }
  #graph-panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: 372px; z-index: 2;
    background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: -14px 0 34px rgb(0 0 0 / calc(0.09 + var(--is-dark) * 0.36)); overflow-y: auto; padding: 22px 24px 26px;
    transform: translateX(100%); opacity: 0;
    transition: transform .26s cubic-bezier(.32,.72,.3,1), opacity .2s;
  }
  #graph-panel.open { transform: none; opacity: 1; }
  .gp-k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; }
  .gp-item { position: relative; padding-left: 14px; margin: 0 0 8px 8px; }
  .gp-item::before {
    content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 1.4px; opacity: .65;
    background: repeating-linear-gradient(to bottom, var(--thread) 0 7px, transparent 7px 12px);
  }
  .gp-avatar {
    width: 22px; height: 22px; border-radius: 50%; border: 1.6px solid var(--ink-3);
    display: grid; place-content: center; font-size: 10.5px; font-weight: 650; color: var(--ink-2); flex: none;
  }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  .legend { display: flex; gap: 20px; align-items: center; padding: 14px 6px 0; font-size: 12.5px; color: var(--ink-2); }
  .legend i { font-style: normal; color: var(--ink-3); font-size: 11.5px; }
  .legend span::before { content: ""; display: inline-block; margin-right: 7px; vertical-align: -1px; }
  .legend { font-size: 13.5px; color: var(--ink-2); font-weight: 550; }
  .legend .l-m::before { width: 11px; height: 11px; border-radius: 50%; background: var(--thread); box-shadow: 0 0 7px rgb(91 116 224 / 0.75); }
  .legend .l-p::before { width: 8px; height: 8px; border-radius: 50%; background: var(--node-person); }
  .legend .l-t::before { width: 12px; height: 12px; border-radius: 50%; background: var(--node-topic); box-shadow: 0 0 7px rgb(207 154 53 / 0.7); }

  .empty { color: var(--ink-3); text-align: center; padding: 44px 0; font-size: 13.5px; }
  .empty svg { display: none; }
  .exit-line { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; }
  b { font-weight: 600; }
  textarea.notes {
    width: 100%; min-height: 130px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea.notes:focus { border-color: color-mix(in srgb, var(--thread) 45%, var(--line)); box-shadow: 0 0 0 3px var(--thread-soft); }
  .copybtn {
    border: 1px solid var(--line); background: var(--surface); font: inherit; font-weight: 500; font-size: 12.5px;
    padding: 5px 14px; border-radius: 9px; cursor: pointer; margin-top: 10px; color: var(--ink-2);
    transition: border-color .12s, color .12s;
  }
  .copybtn:hover { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); color: var(--thread); }
  .live-partial { color: var(--ink-3); font-style: italic; }
  .live-you .who { color: var(--thread); }
  .live-status { font-size: 11.5px; color: var(--ink-3); padding: 2px 0; font-family: ui-monospace, monospace; }

  .up-item { padding: 12px 0; }
  .up-item + .up-item { border-top: 1px solid var(--line); }
  .up-when { font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; color: var(--thread); text-transform: uppercase; }
  .prep { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; position: relative; padding-left: 14px; }
  .prep::before {
    content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 1.4px; opacity: .65;
    background: repeating-linear-gradient(to bottom, var(--thread) 0 7px, transparent 7px 12px);
  }
  .prep.past::before { background: repeating-linear-gradient(to bottom, var(--ink-3) 0 7px, transparent 7px 12px); opacity: .5; }
  .prep b { display: block; font-weight: 600; color: var(--ink-2); }
  /* Structured summary document */
  .ts-chip {
    font-size: 10.5px; color: var(--thread); background: var(--thread-soft);
    border: none; border-radius: 6px; padding: 1px 6px; margin-left: 6px;
    cursor: pointer; font-variant-numeric: tabular-nums;
  }
  /* Correction flow */
  #correct-fab {
    position: absolute; z-index: 30; padding: 5px 12px; font-size: 12.5px;
    background: var(--ink); color: var(--bg); border: none; border-radius: 8px;
    cursor: pointer; box-shadow: var(--shadow);
  }
  #correct-modal, .tl-modal {
    position: fixed; inset: 0; z-index: 40; background: var(--veil);
    display: flex; align-items: center; justify-content: center;
  }
  #correct-modal .box, .tl-modal .box {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
    max-width: 620px; width: 92%; max-height: 80vh; overflow-y: auto; padding: 22px 24px;
  }
  #correct-modal h2, .tl-modal h2 { margin-bottom: 10px; }
  #correct-modal .occ { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  #correct-modal .occ input { margin-top: 3px; }
  #correct-modal .grp { margin: 14px 0 4px; font-size: 12px; font-weight: 650; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
  #correct-modal .actions, .tl-modal .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .tl-modal input[type=text], .tl-modal textarea, .tl-modal select {
    width: 100%; font: inherit; font-size: 13.5px; padding: 8px 10px; margin: 4px 0 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .tl-modal label { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
  /* Suggestion chips: the model proposes, the user files. */
  .tag-chip.suggest { background: none; border-style: dashed; color: var(--ink-2); }
  .tag-chip.suggest button { font-weight: 700; }
  .tag-chip.suggest button[data-accept] { color: var(--pass); }
  .tag-chip.suggest button[data-dismiss] { color: var(--block); }
  /* Project workspace */
  .proj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; margin-bottom: 34px; }

  /* Ask-this-project: a wide bar docked at the bottom of the project screen */
  .ask-float {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 60;
    width: min(880px, calc(100vw - 48px));
    display: flex; flex-direction: column; gap: 10px;
  }
  .ask-log {
    max-height: min(440px, 55vh); overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .ask-log[hidden] { display: none; }
  .ask-msg { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; border-radius: 12px; padding: 9px 13px; max-width: 92%; }
  .ask-msg.q { align-self: flex-end; background: var(--ink); color: var(--surface); }
  .ask-msg.a { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .ask-msg.a .ask-src { display: block; margin-top: 6px; font-size: 11.5px; color: var(--ink-3); }
  .ask-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 22px;
    background: var(--card); border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 999px; box-shadow: var(--shadow);
  }
  .ask-bar input { flex: 1; border: none; outline: none; background: none; font: inherit; font-size: 14.5px; color: var(--ink); }
  .ask-bar input::placeholder { color: var(--ink-3); }
  .ask-bar button {
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px;
    font: 600 13.5px inherit; font-family: inherit; background: var(--surface); color: var(--ink); cursor: pointer;
    white-space: nowrap;
  }
  .ask-bar button:hover { border-color: var(--ink-3); }
  .ask-bar button:disabled { opacity: 0.5; cursor: default; }
  .proj-grid .card { margin: 0; }
  .proj-desc { font-size: 14px; color: var(--ink-2); margin: 4px 0 14px; cursor: pointer; max-width: 720px; }
  .proj-desc:hover { color: var(--thread); }
  .doc-row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; cursor: pointer; }
  .doc-row + .doc-row { border-top: 1px solid var(--line); }
  .doc-row:hover .doc-title { color: var(--thread); }
  .doc-row .doc-title { font-weight: 600; font-size: 14px; }
  .claim.todo.done > div { text-decoration: line-through; color: var(--ink-3); }
  .add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .add-row input, .add-row select {
    font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .add-row input[name=task] { flex: 1; min-width: 160px; }
  #doc-editor {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 26px 30px; min-height: 380px;
    font-size: 14.5px; line-height: 1.65; outline: none;
  }
  #doc-editor:focus-within { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); }
  #doc-title {
    font: inherit; font-size: 24px; font-weight: 800; border: none; background: none;
    color: var(--ink); width: 100%; outline: none; margin-bottom: 8px;
  }
  /* Granola-style workspace: notes are the main frame */
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w, 400px); gap: 30px; align-items: start; }
  .workspace.collapsed { grid-template-columns: minmax(0, 1fr) 0px; gap: 0; }
  .workspace.collapsed #side-panel { display: none; }
  #panel-reopen {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 20;
    writing-mode: vertical-rl; padding: 14px 6px; font-size: 12px; font-weight: 650;
    background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); border-right: none;
    border-radius: 10px 0 0 10px; cursor: pointer; box-shadow: var(--shadow);
  }
  .panel-grip {
    position: absolute; left: -4px; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 5;
  }
  .panel-grip:hover, .panel-grip.dragging { background: linear-gradient(to right, transparent 3px, var(--thread) 3px, var(--thread) 5px, transparent 5px); opacity: .55; }
  .tag-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--thread-soft); color: var(--thread);
    border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600;
  }
  .tag-chip button { border: none; background: none; color: inherit; cursor: pointer; font-size: 13px; padding: 0; opacity: .7; }
  .tag-chip button:hover { opacity: 1; }
  .tag-add { border: 1px dashed var(--line); background: none; color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .tag-add:hover { color: var(--thread); border-color: var(--thread); }
  #tag-menu {
    position: absolute; z-index: 35; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 180px;
  }
  #tag-menu button { display: block; width: 100%; text-align: left; border: none; background: none; font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--ink); }
  #tag-menu button:hover { background: var(--thread-soft); }
  #rec-inline { border: 1px solid var(--line); background: var(--surface); color: var(--block); font: inherit; font-size: 12.5px; font-weight: 650; border-radius: 10px; padding: 6px 14px; cursor: pointer; }
  #rec-inline:hover { border-color: var(--block); }
  .ws-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  /* title + chips take the slack; the action buttons wrap as one cluster,
     pushed right by their own auto margin (so the old spacer can stay flat) */
  .ws-head .spacer { flex: 0 0 0; }
  .ws-head > div:first-child { flex: 1 1 320px; min-width: 0; }
  .ws-actions { display: flex; align-items: center; gap: 10px; flex: none; margin-left: auto; }
  #notes-doc {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 26px 30px; min-height: 320px;
    font-size: 14.5px; line-height: 1.65; outline: none;
  }
  #notes-doc:focus-within { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); }
  #notes-doc h1, #doc-editor h1 { font-size: 20px; margin: 14px 0 6px; }
  #notes-doc h2, #doc-editor h2 { font-size: 16px; margin: 14px 0 4px; }
  #notes-doc h3, #doc-editor h3 { font-size: 14px; margin: 10px 0 2px; color: var(--ink-2); }
  #notes-doc p, #doc-editor p { margin: 6px 0; }
  #notes-doc ul, #doc-editor ul { margin: 4px 0 4px 20px; padding: 0; }
  #notes-doc li, #doc-editor li { margin: 2px 0; }
  #notes-doc li.task, #doc-editor li.task { list-style: none; margin-left: -18px; }
  #notes-doc li.task input, #doc-editor li.task input { margin-right: 7px; accent-color: var(--thread); }
  #notes-doc { position: relative; }
  #notes-doc.is-empty::before {
    content: attr(data-ph);
    position: absolute; top: 26px; left: 30px; right: 30px;
    color: var(--ink-3); pointer-events: none;
  }
  #notes-doc.flash { animation: notes-flash 1.2s ease; }
  @keyframes notes-flash { 0% { background: var(--thread-soft); } 100% { background: var(--surface); } }
  /* Chat */
  /* ── Block 2: chat, Granola-style ─────────────────────────────────────────
     The composer is a floating bar pinned to the bottom of the notes column;
     the conversation lives in a sheet that draws OVER the notes when the bar is
     engaged and disappears when it isn't. Page scroll moves only the notes:
     the dock is sticky, the sheet has its own scroll, and so does the
     transcript panel. */
  main.wide {
    max-width: 1560px; height: calc(100vh - 62px); overflow: hidden;
    display: flex; flex-direction: column; padding: 28px 36px 0;
  }
  main.wide .workspace { flex: 1; min-height: 0; align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .ws-main {
    display: flex; flex-direction: column; min-height: 0; position: relative;
    overflow-y: auto; overscroll-behavior: contain; padding: 2px 4px 0 2px;
  }
  #chat-dock {
    position: sticky; bottom: 0; margin-top: auto; padding: 26px 2px 14px; z-index: 15;
    /* Notes slide beneath the bar; the fade keeps the hand-off legible. */
    background: linear-gradient(to top, var(--bg) 62%, transparent);
  }
  #chat-sheet {
    position: absolute; left: 2px; right: 2px; bottom: calc(100% - 12px);
    display: flex; flex-direction: column; overflow: hidden;
    max-height: min(62vh, 640px);
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow-panel);
  }
  #chat-sheet.closed { display: none; }
  .chat-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .chat-top .spacer { flex: 1; }
  .chat-icon {
    border: none; background: none; color: var(--ink-3); font: inherit; font-size: 14px;
    cursor: pointer; padding: 2px 5px; border-radius: 7px; line-height: 1;
  }
  .chat-icon:hover { color: var(--ink-2); background: var(--bg); }
  #chat-log { display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; overflow-y: auto; flex: 1; }
  #chat-log:empty::before {
    content: "Ask about this meeting, / for a handoff — every claim carries a receipt you can click.";
    color: var(--ink-3); font-size: 13px; text-align: center; padding: 26px 0 14px;
  }
  .chat-b { font-size: 14px; line-height: 1.65; }
  .chat-b.user {
    align-self: flex-end; max-width: 85%; background: var(--thread-soft);
    padding: 8px 13px; border-radius: 13px; font-size: 13.5px;
  }
  .chat-b.ai { align-self: stretch; color: var(--ink); }
  .chat-b.thinking { color: var(--ink-3); }
  .chat-acts { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .say-more {
    border: 1px solid var(--line); background: none; color: var(--ink-2); font: inherit; font-size: 12px;
    border-radius: 999px; padding: 3px 13px; cursor: pointer;
  }
  .say-more:hover { color: var(--thread); border-color: var(--thread); }
  #chat-bar {
    display: flex; gap: 10px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px;
    box-shadow: var(--shadow-pop);
  }
  #chat-bar:focus-within { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); }
  #chat-input { flex: 1; border: none; background: none; font: inherit; font-size: 14px; color: var(--ink); outline: none; }
  .chat-model { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #chat-send {
    border: none; background: var(--ink); color: var(--bg); width: 26px; height: 26px; border-radius: 50%;
    font: inherit; font-size: 13px; cursor: pointer; display: grid; place-content: center; flex: none;
  }
  #chat-send:disabled { background: var(--ink-3); cursor: default; }
  /* Side panel */
  #side-panel {
    position: relative; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .panel-tabs { display: flex; gap: 4px; align-items: center; padding: 10px 12px 0; position: sticky; top: 0; background: var(--surface); z-index: 2; border-bottom: 1px solid var(--line); }
  .panel-tab { border: none; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 6px 10px 9px; cursor: pointer; border-bottom: 2px solid transparent; }
  .panel-tab:hover { color: var(--ink-2); }
  .panel-title { font-size: 13px; font-weight: 600; color: var(--ink); padding: 6px 10px 9px; border-bottom: 2px solid var(--thread); }
  .panel-body { padding: 12px 16px 16px; }
  .panel-body .utt { font-size: 13px; }
  .utt .txt[contenteditable="true"] { outline: 2px solid var(--thread-soft); border-radius: 4px; padding: 1px 4px; }
  .utt .txt { cursor: text; }
  /* Toast */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px;
    font-size: 13px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center;
  }
  #toast button { border: none; background: none; color: var(--thread-soft); font: inherit; font-weight: 650; cursor: pointer; }
  /* Selection fix input */
  #fix-pop { position: absolute; z-index: 30; display: flex; gap: 6px; align-items: center;
    background: var(--ink); border-radius: 8px; padding: 5px 8px; box-shadow: var(--shadow); }
  #fix-pop span { color: var(--bg); font-size: 12px; }
  #fix-pop input { border: none; border-radius: 5px; font: inherit; font-size: 12.5px; padding: 2px 7px; width: 120px; outline: none; }
  .people-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .people-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; }
  .people-chip:hover { border-color: var(--thread); }
  .up-item { position: relative; padding-left: 22px; }
  .up-item.compact { padding: 10px 0 10px 22px; }
  .up-item.compact::before { top: 8px; bottom: 8px; }
  .up-item::before {
    content: ""; position: absolute; left: 5px; top: 20px; bottom: 6px; width: 1.4px; opacity: .45;
    background: repeating-linear-gradient(to bottom, var(--ink-3) 0 11px, transparent 11px 19px);
  }
  .up-item:first-child::before { background: repeating-linear-gradient(to bottom, var(--thread) 0 11px, transparent 11px 19px); opacity: .5; }
  .up-title { font-weight: 620; font-size: 15.5px; letter-spacing: -0.01em; margin: 1px 0 1px; }
  .up-item:first-child .up-title { font-weight: 650; font-size: 18.5px; letter-spacing: -0.015em; line-height: 1.3; margin: 1px 0 2px; }
    .up-needle {
    position: absolute; left: -9px; top: 1px; transform: rotate(58deg); transform-origin: 14% 50%;
    filter: drop-shadow(0 1px 1px rgb(40 40 60 / 0.18)); pointer-events: none;
  }

  /* ── command palette: Spotlight for your meetings (⌘K / ⌘Space) ── */
  #palette-veil {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: var(--veil); backdrop-filter: blur(6px) saturate(1.2); -webkit-backdrop-filter: blur(6px) saturate(1.2);
  }
  #palette-veil.open { display: block; }
  #palette {
    position: fixed; left: 50%; top: 13%; transform: translateX(-50%);
    width: min(640px, 92vw); z-index: 41;
    background: var(--pal-bg); border: 1px solid var(--glass-border); border-radius: 16px;
    backdrop-filter: blur(34px) saturate(1.8); -webkit-backdrop-filter: blur(34px) saturate(1.8);
    box-shadow: var(--shadow-panel); overflow: hidden;
  }
  .pal-search { display: flex; align-items: center; gap: 11px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .pal-search > .ic { color: var(--ink-3); flex: none; }
  #palette input {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink);
    font: 500 18px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui;
    letter-spacing: -0.015em; padding: 2px 0;
  }
  #palette input::placeholder { color: var(--ink-3); }
  #palette-body { max-height: 56vh; overflow-y: auto; padding: 8px 10px 12px; }
  .pal-hint { color: var(--ink-3); font-size: 12px; padding: 10px 10px 6px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .pal-hint b { font-weight: 600; color: var(--ink-2); }
  .pal-group { padding: 10px 10px 4px; }
  .pal-row {
    display: flex; gap: 11px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer;
  }
  .pal-row > .ic { color: var(--ink-3); flex: none; }
  .pal-row:hover, .pal-row.sel { background: var(--thread-soft); }
  .pal-row.sel > .ic, .pal-row:hover > .ic { color: var(--thread); }
  .pal-row .ts { color: var(--ink-3); font-size: 11.5px; flex: none; width: 118px; }
  .pal-row .txt { flex: 1; font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal-row .meta { flex: none; font-size: 11.5px; color: var(--ink-3); }
  .pal-answer { padding: 12px 10px 4px; }
  .pal-answer .claim { padding: 8px 0; }

  /* ── Block 1: the notes card (summary + themed outline) ───────────────── */
  #outline { margin: 0; }
  #outline .card { margin: 0; }
  .out-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .out-head h2 { margin: 0; }
  .out-head .spacer { flex: 1; }
  .out-stamp { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .out-stamp b { font-weight: 600; color: var(--ink-2); }
  /* Mode selector: which kind of meeting this is. It picks the themes the notes
     reach for and which handoff gets suggested. */
  .mode-chip {
    position: relative; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 4px 11px 4px 10px; font: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer;
  }
  .mode-chip:hover { border-color: var(--thread); color: var(--thread); }
  .mode-chip .caret { color: var(--ink-3); margin-left: 3px; font-size: 10px; }
  .out-summary {
    font-size: 14.5px; line-height: 1.62; color: var(--ink); margin: 6px 0 2px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .out-tree { margin: 8px 0 0; padding: 0; list-style: none; }
  .out-tree ul { margin: 2px 0 6px 16px; padding: 0; list-style: none; }
  .out-theme > .out-label {
    font-weight: 640; font-size: 14.5px; letter-spacing: -0.008em; display: block; margin: 12px 0 2px;
  }
  .out-tree > .out-theme:first-child > .out-label { margin-top: 2px; }
  .out-sub > .out-label { font-weight: 600; font-size: 13.5px; color: var(--ink-2); display: block; margin: 7px 0 1px; }
  .out-leaf { position: relative; padding-left: 15px; margin: 3px 0; font-size: 14px; }
  .out-leaf::before {
    content: ""; position: absolute; left: 3px; top: 8px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--ink-3); opacity: .55;
  }
  .out-leaf.low::before { background: none; border: 1px solid var(--ink-3); width: 5px; height: 5px; }
  .out-text[contenteditable="true"] { outline: 2px solid var(--thread-soft); border-radius: 4px; padding: 0 3px; }
  .out-text.edited::after { content: "edited"; font-size: 10px; color: var(--ink-3); margin-left: 6px; letter-spacing: .02em; }
  /* Receipts are footnote numbers, not segment ids. At rest they are a faint
     superscript that stays out of the reader's way; hovering the line they belong
     to lights them up. Only colour changes, never size — a chip that appears out
     of nothing shifts the text under the cursor, and mid-sentence it leaves a
     hole that reads like a typo. */
  .src {
    border: none; background: none; color: var(--ink-3); font: inherit; font-size: 9.5px;
    font-weight: 700; border-radius: 4px; padding: 0 3px; margin-left: 2px; cursor: pointer;
    font-variant-numeric: tabular-nums; vertical-align: 4px; letter-spacing: .02em; line-height: 1;
    opacity: .5; transition: background .12s ease, color .12s ease, opacity .12s ease;
  }
  .out-leaf:hover .src, .out-summary:hover .src, .out-theme:hover .src, .hcard li:hover .src,
  .hcard tr:hover .src, .hcard p:hover .src, .hcard .email:hover .src, .src:focus-visible {
    background: var(--thread-soft); color: var(--thread); opacity: 1;
  }
  .src:hover { filter: brightness(calc(0.95 + var(--is-dark) * 0.18)); }
  .low-flag {
    font-size: 10px; color: var(--ink-3); border: 1px dashed var(--line); border-radius: 5px;
    padding: 0 4px; margin-left: 6px; vertical-align: 1px;
  }
  .review-banner {
    display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--ink-2);
    background: color-mix(in srgb, var(--warm) 9%, transparent); border: 1px solid color-mix(in srgb, var(--warm) 28%, transparent);
    border-radius: 9px; padding: 7px 11px; margin: 10px 0 0;
  }
  .review-banner b { font-weight: 650; color: var(--ink); }
  .out-skeleton div {
    height: 11px; border-radius: 5px; margin: 9px 0;
    background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 45%, var(--surface)) 50%, var(--line) 75%);
    background-size: 220% 100%; animation: shimmer 1.3s linear infinite;
  }
  .out-skeleton div:nth-child(2) { width: 78%; margin-left: 16px; }
  .out-skeleton div:nth-child(3) { width: 64%; margin-left: 16px; }
  .out-skeleton div:nth-child(4) { width: 44%; }
  .out-skeleton div:nth-child(5) { width: 71%; margin-left: 16px; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  /* ── Handoffs: greyed suggestion until asked for. Lives in the chat card. */
  .handoff-row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: flex-end; padding: 0 2px 9px; }
  .handoff-row:empty { padding: 0; }
  .handoff-row .label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 600; margin-right: auto; }
  .hchip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-3);
    box-shadow: var(--shadow-sm);
    border-radius: 10px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
    transition: color .14s, border-color .14s, background .14s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  /* The "/" badge mirrors the slash menu: this is a thing you can also type. */
  .hchip .slash {
    border: 1px solid var(--line); border-radius: 5px; font-size: 10px; font-weight: 700;
    width: 16px; height: 16px; display: grid; place-content: center; color: var(--ink-3);
  }
  .hchip .chev { color: var(--ink-3); font-size: 11px; }
  .hchip.suggested { border-style: dashed; }
  .hchip:hover:not(:disabled) { color: var(--thread); border-color: var(--thread); background: var(--thread-soft); }
  .hchip.active { color: var(--thread); border-color: transparent; background: var(--thread-soft); font-weight: 600; }
  .hchip:disabled { opacity: .55; cursor: progress; }
  .hchip.more { color: var(--ink-3); border-style: dotted; }
  .hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 15px 18px 12px; }
  .hcard > h3 { font-size: 14.5px; margin: 0 0 2px; letter-spacing: -0.008em; }
  .hcard .hmeta { font-size: 11px; color: var(--ink-3); margin-bottom: 9px; }
  .hcard .hbody { font-size: 13.5px; }
  .hcard .hbody h4 { font-size: 12.5px; margin: 12px 0 3px; color: var(--ink-2); }
  .hcard .hbody ul { margin: 3px 0 3px 16px; padding: 0; }
  .hcard .hbody li { margin: 3px 0; }
  .hcard .hbody p { margin: 5px 0; }
  .hcard .hbody table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0; }
  .hcard .hbody th { text-align: left; font-weight: 650; color: var(--ink-2); border-bottom: 1px solid var(--line); padding: 5px 8px 5px 0; }
  .hcard .hbody td { border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; vertical-align: top; }
  .hcard .hbody .email { white-space: pre-wrap; font-size: 13.5px; }
  .hcard .hgroup { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .hcard .hgroup:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .hcard .hgroup .ghead { display: flex; align-items: baseline; gap: 8px; }
  .hcard .hgroup .ghead b { font-size: 13px; }
  .hfoot { display: flex; gap: 6px; align-items: center; margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .hfoot .spacer { flex: 1; }
  .hbtn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 8px;
    padding: 3px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .hbtn:hover { color: var(--thread); border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); }
  .hbtn.tiny { font-size: 11px; padding: 1px 8px; }
  /* Per-snippet "copy for Slack" — invisible until you hover the line it belongs to. */
  .snip-copy {
    display: inline; border: 0; background: none; color: var(--ink-3); cursor: pointer;
    padding: 2px 4px; margin-left: 6px; vertical-align: baseline;
    opacity: 0; transition: opacity .12s ease, color .12s ease;
  }
  .out-leaf:hover > .snip-copy, .out-theme:hover > .snip-copy, .out-sub:hover > .snip-copy,
  .out-summary:hover .snip-copy { opacity: 1; }
  .snip-copy:hover { color: var(--thread); }
  .hedit {
    width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font: inherit; font-size: 13px; line-height: 1.6; background: var(--bg); color: var(--ink); resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .hcard.pending { opacity: .6; }
  #slash-menu {
    position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow-pop), var(--shadow);
    padding: 6px; width: 330px; max-height: 300px; overflow-y: auto;
  }
  #slash-menu button {
    display: block; width: 100%; text-align: left; border: none; background: none; font: inherit;
    padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--ink);
  }
  #slash-menu button:hover, #slash-menu button.sel { background: var(--thread-soft); }
  #slash-menu b { display: block; font-size: 13px; font-weight: 600; }
  #slash-menu span { display: block; font-size: 11.5px; color: var(--ink-3); }
  .utt.seg-hl { background: var(--thread-soft); border-radius: 8px; padding: 8px 12px; margin: 0 -12px; transition: background .3s; }
  .utt .segid {
    font-size: 9.5px; color: var(--ink-3); font-weight: 650; letter-spacing: .03em;
    display: block; font-variant-numeric: tabular-nums;
  }
  .utt.low .txt::after { content: "heard poorly"; font-size: 9.5px; color: var(--ink-3); margin-left: 7px; white-space: nowrap; }

  /* ── Phase 1 restyle pass: every page inherits the glass ── */
  /* editor headings stay in the UI face, not the serif page face */
  #notes-doc h1, #doc-editor h1, #notes-doc h2, #doc-editor h2 { font-family: inherit; letter-spacing: -0.01em; font-weight: 650; }
  #notes-doc h1, #doc-editor h1 { font-size: 20px; }

  .copybtn, .tag-add, .people-chip, #rec-inline, #graph-ctl button, .topic-select, #panel-reopen {
    border-radius: var(--radius-sm);
  }
  .copybtn { display: inline-flex; align-items: center; gap: 6px; background: var(--card); }
  .copybtn:hover { background: var(--hover); }
  .copybtn .ic { color: currentColor; }
  #notes-doc, #doc-editor, #side-panel, #chat-bar, .chat-b.ai, #graph-tip, #tag-menu,
  #correct-modal .box, .tl-modal .box, .people-chip, #brain-q {
    background: var(--card); border-color: var(--glass-border);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  }
  #notes-doc, #doc-editor, #side-panel, #chat-bar, #correct-modal .box, .tl-modal .box { border-radius: var(--radius); }
  /* Inside the fixed-height workspace the grid row sizes the panel; a viewport
     height here inflated the row and clipped the sticky chat dock below the fold. */
  main.wide #side-panel { top: auto; height: auto; }
  .panel-tabs { background: transparent; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: var(--radius) var(--radius) 0 0; }
  textarea.notes, .draft, .add-row input, .add-row select { background: var(--sunk); border-color: var(--line); border-radius: var(--radius-sm); }
  .topic-select { background: var(--card); }
  #graph-wrap { height: clamp(420px, 62vh, 640px); }

  /* fluid: nothing overflows between 360px and 2560px */
  .proj-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .ws-head h1 { font-size: clamp(23px, 2.6vw, 30px); }
  @media (max-width: 900px) {
    .workspace, .workspace.collapsed { grid-template-columns: minmax(0, 1fr); }
    #side-panel { position: static; height: auto; max-height: 60vh; }
  }
  img, svg, video, canvas { max-width: 100%; }
  main table, .draft, pre { max-width: 100%; overflow-x: auto; }
</style>

const $ = (s) => document.querySelector(s);

const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtTs = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
/** "3:19 PM" — a wall clock, tabular. */
const fmtClock = (ms) => new Date(ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
/** Midnight-anchored day index, so "yesterday" means the calendar day, not 24h. */
const dayStart = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
/** "Today" / "Yesterday" for the last two days, then "Wed, Aug 12". */
function dayLabel(ms) {
  const diff = Math.round((dayStart(Date.now()) - dayStart(ms)) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff === -1) return "Tomorrow";
  return new Date(ms).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
/** [[label, rows], …] keeping the incoming order. */
function groupByDay(rows, key = (r) => r.started_at) {
  const out = [];
  for (const r of rows) {
    const label = dayLabel(key(r));
    if (out.length && out[out.length - 1][0] === label) out[out.length - 1][1].push(r);
    else out.push([label, [r]]);
  }
  return out;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (p) => fetch(p).then(async (r) => { const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` })); if (!r.ok) throw new Error(j.error ?? `HTTP ${r.status}`); return j; });
/** One sprite, one helper: every button in the app gets a real icon. */
const icon = (n, s = 16) => `<svg class="ic" width="${s}" height="${s}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const MODES = ["discovery", "investor", "1:1", "team meeting", "standup"];

/** Suggestion chips + delete, appended onto whichever meeting page rendered. */
/** Mode + topic pickers shown while a recording is running. */
async function liveMetaBar() {

    <select class="topic-select" id="live-topic" title="Thread">${html}</select>

  host.after(bar);
  $("#live-mode").addEventListener("change", (e) =>
    fetch("/api/record/meta", { method: "POST", body: JSON.stringify({ mode: e.target.value }) }));
  $("#live-topic").addEventListener("change", (e) =>
    topicSelectChange(e.target, (tid) =>
