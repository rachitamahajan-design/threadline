  });

  wireCorrections(id);
  state.highlight = null;
}

/** Replace the notes doc with an AI result — guarded against mid-flight typing. */
function applyNotesUpdate(doc, meetingId, beforeMd, newMd, toastMsg) {
  const currentMd = domToMd(doc);
  if (currentMd !== beforeMd && !confirm("You edited the notes while AI was working. Replace with the AI version?")) return;
  doc.innerHTML = mdToDom(newMd);
  doc.dataset.lastSaved = newMd;
  doc.classList.remove("flash"); void doc.offsetWidth; doc.classList.add("flash");
  if (toastMsg) showToast(toastMsg);
}

// ══ Grounded notes & handoffs ════════════════════════════════════════════
// The outline is always on and sits at the top. Handoffs are chips that do
// nothing until clicked — the type-appropriate one is dashed and grey until it
// has actually been run. Every claim carries a segment chip that lands the
// reader on the transcript line it came from: trust you can click.

/** Mirror of lib/segments.ts — utterance index → segment id. */
const segIdOf = (idx) => `S${String(Number(idx) + 1).padStart(3, "0")}`;

/**
 * Click a receipt → the transcript panel opens on the exact line(s) it cites.
 *
 * Done by toggling classes rather than re-rendering the meeting: a re-render
 * would throw away the handoff cards sitting in the chat log, and the panel's
 * content is always in the DOM anyway (collapsing it only hides it).
 */
function jumpToSegments(ids) {
  const list = Array.isArray(ids) ? ids : [ids];
  const ws = main.querySelector(".workspace");
  if (ws && !panelState.open) {
    panelState.open = true;
    localStorage.setItem("tl-panel", "open");
    ws.classList.remove("collapsed");
    document.getElementById("panel-reopen")?.remove();
  }
  main.querySelectorAll(".utt.seg-hl").forEach((u) => u.classList.remove("seg-hl"));
  let first = null;
  for (const id of list) {
    const el = main.querySelector(`.utt[data-seg="${id}"]`);
    if (!el) continue;
    el.classList.add("seg-hl");
    if (!first) first = el;
  }
  if (first) scrollTranscriptTo(first);
  else showToast("That line is no longer in this transcript.");
}

/**
 * Receipts as footnotes.
 *
 * A reader does not care that a claim came from segment S004 — that is our
 * bookkeeping. They care that it is claim number 3 in what they are reading and
 * that clicking it shows the words. So each block gets its own counter, numbered
 * in reading order, and identical citations share a number the way footnotes do.
 */
function makeReceipts() {
  const seen = new Map();
  let n = 0;
  return (source) => {
    if (!source?.length) return "";
    const key = source.join(",");
    if (!seen.has(key)) seen.set(key, ++n);
    return `<button class="src" data-src="${esc(key)}" title="Show the line${source.length > 1 ? "s" : ""} this rests on">${seen.get(key)}</button>`;
  };
}

function wireSrcChips(root) {
  root.querySelectorAll("[data-src]").forEach((b) =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      jumpToSegments(b.dataset.src.split(","));
    }));
}

/** The themed outline: labels are plain text, leaves carry numbered receipts. */
function outlineTree(bullets, rc, prefix = "") {
  return bullets
    .map((b, i) => {
      const path = prefix ? `${prefix}.${i}` : String(i);
      const isLeaf = !b.children || !b.children.length;
      if (isLeaf)
        return `<li class="out-leaf ${b.lowConfidence ? "low" : ""}">
          <span class="out-text ${b.edited ? "edited" : ""}" data-path="${path}" title="Click to edit">${esc(b.text)}</span><button class="snip-copy" data-snip="${path}" title="Copy for Slack">${icon("copy", 12)}</button>${rc(b.source)}${
            b.lowConfidence ? `<span class="low-flag" title="Every line this rests on was heard poorly — worth checking">heard poorly</span>` : ""
          }</li>`;
      return `<li class="${prefix ? "out-sub" : "out-theme"}">
        <span class="out-label out-text ${b.edited ? "edited" : ""}" data-path="${path}" title="Click to rename this theme">${esc(b.text)}</span><button class="snip-copy" data-snip="${path}" title="Copy for Slack">${icon("copy", 12)}</button>
        <ul>${outlineTree(b.children, rc, path)}</ul>
      </li>`;
    })
    .join("");
}

const MODE_LABELS = {
  investor: "Investor",
  vendor: "Vendor",
  customer: "Customer",
  team: "Team",
  one_on_one: "1:1",
};

/** Header shared by every state of the notes card, so the chrome never jumps. */
function notesHead(extra = "") {
  return `<div class="out-head">
    <h2>Notes</h2>
    <button class="hbtn" id="out-structure" title="Rebuild the notes from the transcript for this mode">☰ Structure my notes</button>
    <span class="spacer"></span>
    ${extra}
  </div>`;
}

/**
 * The mode chip, in the meeting header. It is a property of the MEETING — it
 * decides which sections the notes reach for and which handoff gets suggested —
 * so it sits with the title, not inside the notes card, and it survives every
 * re-render of the card below it.
 */
function renderModeChip(meetingId, data) {
  const slot = $("#mode-slot");
  if (!slot) return;
  const mode = data.meeting_type ?? "team";
  slot.innerHTML = `<button class="mode-chip" id="mode-chip" title="What kind of meeting this is — it picks the sections the notes reach for, and which handoff is suggested">✦ ${esc(MODE_LABELS[mode] ?? mode)}<span class="caret">▾</span></button>`;
  slot.querySelector("#mode-chip").addEventListener("click", (e) => openModePicker(meetingId, data, e.currentTarget));
}

/**
 * Block 1. One notes surface: the grounded outline when there is one, otherwise
 * the founder's own editable page. Structure turns the second into the first.
 */
function notesCard(data) {
  const outline = data.outline;
  const mode = data.meeting_type;
  const rough = (data.meeting?.my_notes ?? "").trim();
  if (!outline) {
    return `<div class="card">
      ${notesHead()}
      <div id="notes-doc" contenteditable="true" data-ph="🧵 Start a thread… or hit Structure my notes"></div>
      ${data.model && !data.model.configured
        ? `<div class="review-banner"><b>No model configured.</b><span>Add PYAI_API_KEY or OPENAI_API_KEY to .env to have notes write themselves.</span></div>`
        : ""}
    </div>`;
  }
  const rc = makeReceipts();
  const empty = !outline.notes?.themes?.length && !outline.notes?.summary;
  const summary = outline.notes?.summary;
  return `<div class="card">
    ${notesHead(
      // An empty outline has nothing to copy or edit, and the version stamp is
      // system info — the header stays bare until there is content.
      empty
        ? ""
        : `<span class="out-stamp">${outline.edited ? "<b>edited</b> · " : ""}${esc(outline.promptVersion)}</span>
       <button class="hbtn" id="out-copy">Copy</button>
       <button class="hbtn" id="out-edit">Edit</button>`,
    )}
    ${empty
      ? `<div class="empty" style="padding:18px 0">No notes from this recording — there wasn't enough in the transcript to summarize. Keep recording, or edit the transcript and structure again.</div>`
      : `${summary?.text
            ? `<p class="out-summary"><span class="out-text ${summary.edited ? "edited" : ""}" data-path="summary" title="Click to edit">${esc(summary.text)}</span><button class="snip-copy" data-snip="summary" title="Copy for Slack">${icon("copy", 12)}</button>${rc(summary.source)}${
                summary.lowConfidence ? `<span class="low-flag">heard poorly</span>` : ""
              }</p>`
            : ""}
         <ul class="out-tree">${outlineTree(outline.notes.themes ?? [], rc)}</ul>`}
    ${outline.needsReview && !empty
      ? `<div class="review-banner"><b>Low confidence — please review.</b>
          <span>${outline.dropped ? `${outline.dropped} line${outline.dropped === 1 ? "" : "s"} the transcript didn't support ${outline.dropped === 1 ? "was" : "were"} dropped rather than guessed at.` : "Some lines couldn't be verified."}</span></div>`
      : ""}
    ${rough ? `<div class="hfoot"><span class="spacer"></span><button class="hbtn tiny" id="out-rough">your rough notes ›</button></div>` : ""}
  </div>`;
}

/** Fetch + render block 1 (and seed blocks 2's chips). Skeleton while it works. */
async function renderOutlineSection(meetingId, opts = {}) {
  const box = $("#outline");
  if (!box) return;
  box.innerHTML = `<div class="card">${notesHead()}
    <div class="out-skeleton"><div></div><div></div><div></div><div></div><div></div></div></div>`;
  const data = await api(`/api/outline?id=${encodeURIComponent(meetingId)}${opts.generate === false ? "&generate=0" : ""}`);
  data.meeting = opts.meeting ?? null;
  if (data.error && !data.outline) {
    showOutlineFailure(meetingId, box, data, opts);
  } else {
    box.innerHTML = notesCard(data);
    wireOutline(meetingId, data);
  }
  renderModeChip(meetingId, data);
  renderHandoffRow(meetingId, data.catalog ?? [], data.handoffs ?? []);
  for (const run of data.handoffs ?? []) appendHandoffCard(meetingId, run, { replay: true });
  return data;
}

/**
 * Failure invariance, user-facing: a failed generation renders in the card —
 * never an alert() — and always offers a retry. The retry itself is silent:
 * the same skeleton any generation shows, then whatever the outcome is.
 */
function showOutlineFailure(meetingId, box, data, opts = {}) {
  box.innerHTML = `<div class="card">${notesHead()}<div class="empty" style="padding:22px 0">${esc(data.error)}
    <div style="margin-top:10px"><button class="hbtn" id="out-retry">Retry</button></div></div></div>`;
  wireOutline(meetingId, data);
  $("#out-retry")?.addEventListener("click", async (e) => {
    e.currentTarget.disabled = true;
    box.innerHTML = `<div class="card">${notesHead()}
      <div class="out-skeleton"><div></div><div></div><div></div><div></div><div></div></div></div>`;
    if (data.runId) await post("/api/run/retry", { id: data.runId });
    else await post("/api/outline/generate", { id: meetingId, force: true });
    renderOutlineSection(meetingId, { ...opts, generate: false });
  });
}

function wireOutline(meetingId, data) {
  const box = $("#outline");
  if (!box) return;
  const outline = data.outline;
  wireSrcChips(box);

  // The free page, when there is no structured outline yet: the founder's own
  // notes, autosaved, and fed to Structure as steering.
  const doc = $("#notes-doc");
  if (doc) {
    doc.innerHTML = data.meeting?.my_notes ? mdToDom(data.meeting.my_notes) : "<p><br></p>";
    doc.classList.toggle("is-empty", !doc.textContent.trim());
    wireNotesEditor(meetingId, doc);
  }

  $("#out-structure")?.addEventListener("click", async (e) => {
    if (outline?.edited && !confirm("You've edited these notes. Structuring again replaces them with a fresh pass. Continue?")) return;
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = "☰ Structuring…";
    const body = $("#outline .card");
    // Rough notes steer the structure; they never become a citation.
    const hints = doc ? domToMd(doc) : "";
    const out = await post("/api/outline/generate", { id: meetingId, force: true, mode: data.meeting_type, hints });
    if (out.error && !out.outline) {
      // In-card failure + retry, never an alert. The run record has the rest.
      return showOutlineFailure(meetingId, box, { ...data, error: out.error, runId: out.runId });
    }
    const next = { ...data, outline: out.outline, meeting_type: out.meeting_type ?? data.meeting_type, catalog: out.catalog ?? data.catalog };
    box.innerHTML = notesCard(next);
    wireOutline(meetingId, next);
    renderHandoffRow(meetingId, next.catalog ?? [], data.handoffs ?? []);
    showToast(outline ? "Notes rebuilt" : "Notes structured");
  });

  $("#out-copy")?.addEventListener("click", async (e) => {
    // Copy is the Slack-ready form: summary + bold themes + bullet lines, no receipts.
    // Rich HTML so Slack renders it; the mrkdwn text rides along as the fallback.
    await copyRich(outlineToHtml(outline.notes), outlineToSlack(outline.notes));
    flashBtn(e.currentTarget, "Copied ✓");
  });

  $("#out-edit")?.addEventListener("click", () => openOutlineEditor(meetingId, data));

  // The rough page is never lost when notes get structured — it is one click away.
  $("#out-rough")?.addEventListener("click", () => {
    box.innerHTML = `<div class="card">${notesHead(`<button class="hbtn" id="out-back">‹ structured notes</button>`)}
      <div id="notes-doc" contenteditable="true" data-ph="🧵 Your own notes…"></div></div>`;
    const raw = $("#notes-doc");
    raw.innerHTML = data.meeting?.my_notes ? mdToDom(data.meeting.my_notes) : "<p><br></p>";
    wireNotesEditor(meetingId, raw);
    $("#out-back").addEventListener("click", () => {
      box.innerHTML = notesCard(data);
      wireOutline(meetingId, data);
    });
  });

  if (!outline) return;

  // Per-snippet copy: one theme (with its children) or the summary, Slack-ready.
  box.querySelectorAll(".snip-copy").forEach((btn) =>
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const p = btn.dataset.snip;
      let subtree;
      if (p === "summary") {
        if (!outline.notes?.summary?.text) return;
        subtree = { summary: outline.notes.summary, themes: [] };
      } else {
        const node = bulletAtPath(outline.notes, p);
        if (!node) return;
        subtree = { themes: [node] };
      }
      copyRich(outlineToHtml(subtree), outlineToSlack(subtree));
      showToast("Copied for Slack ✓");
    }));

  // Inline edit of one line, saved as the whole tree so the summary, labels and
  // leaves all travel the same path.
  box.querySelectorAll(".out-text[data-path]").forEach((el) =>
    el.addEventListener("click", () => {
      if (el.isContentEditable) return;
      const original = el.textContent;
      el.contentEditable = "true";
      el.focus();
      const done = async (save) => {
        el.contentEditable = "false";
        const text = el.textContent.trim();
        if (!save || !text || text === original.trim()) { el.textContent = original; return; }
        const node = el.dataset.path === "summary" ? outline.notes.summary : bulletAtPath(outline.notes, el.dataset.path);
        if (!node) { el.textContent = original; return; }
        node.text = text;
        node.edited = true;
        const out = await post("/api/outline/edit", { id: meetingId, markdown: outlineToMarkdown(outline.notes, true) });
        if (out.error) { alert(out.error); el.textContent = original; return; }
        el.classList.add("edited");
        outline.edited = true;
      };
      el.addEventListener("blur", () => done(true), { once: true });
      el.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); el.blur(); }
        if (ev.key === "Escape") { el.textContent = original; el.blur(); }
      });
    }));
}

/** Mode picker: the meeting type, which drives themes and the suggested handoff. */
function openModePicker(meetingId, data, anchor) {
  document.getElementById("slash-menu")?.remove();
  const r = anchor.getBoundingClientRect();
  const menu = document.createElement("div");
  menu.id = "slash-menu";
  menu.style.width = "260px";
  menu.innerHTML = Object.entries(MODE_LABELS)
    .map(
      ([id, label]) => `<button data-mode="${id}"><b>${id === data.meeting_type ? "✓ " : ""}${esc(label)}</b>
        <span>${esc(MODE_BLURBS[id])}</span></button>`,
    )
    .join("");
  menu.style.left = `${Math.min(r.left + window.scrollX, window.innerWidth - 280)}px`;
  menu.style.top = `${r.bottom + window.scrollY + 6}px`;
  document.body.appendChild(menu);
  const close = (ev) => {
    if (!menu.contains(ev.target) && ev.target !== anchor) { menu.remove(); document.removeEventListener("mousedown", close); }
  };
  document.addEventListener("mousedown", close);
  menu.querySelectorAll("[data-mode]").forEach((b) =>
    b.addEventListener("click", async () => {
      menu.remove();
      const mode = b.dataset.mode;
      if (mode === data.meeting_type) return;
      const out = await post("/api/meeting/type", { id: meetingId, type: mode });

      data.meeting_type = out.meeting_type;
      data.catalog = out.catalog ?? data.catalog;
      renderModeChip(meetingId, data);
      renderHandoffRow(meetingId, data.catalog ?? [], data.handoffs ?? []);

      // rather than silently spending a model call.
      showToast(`Mode set to ${MODE_LABELS[data.meeting_type]}`, "Rebuild notes", () => $("#out-structure")?.click());
    }));
}

const MODE_BLURBS = {

/** Full-outline markdown editor — the round-trip made visible. */

/** Client-side mirror of lib/outline.ts. `withSources` false = clipboard form. */
function outlineToMarkdown(notes, withSources) {
  const lines = [];
  if (notes?.summary?.text) {
    const src = withSources && notes.summary.source?.length ? ` [${notes.summary.source.join(", ")}]` : "";
    lines.push(`${notes.summary.text}${src}`, "");
  }
  const walk = (bullets, depth) => {
    for (const b of bullets ?? []) {
      const indent = "  ".repeat(depth);
      const leaf = !b.children || !b.children.length;
      if (leaf) {
        const src = withSources && b.source?.length ? ` [${b.source.join(", ")}${b.lowConfidence ? " ?" : ""}]` : "";
        lines.push(`${indent}- ${b.text}${src}`);
      } else {
        lines.push(`${indent}- ${b.text}`);
        walk(b.children, depth + 1);
      }
    }
  };
  walk(notes?.themes ?? [], 0);
  return lines.join("\n");
}

/**
 * Slack "mrkdwn" form of the outline (or of a subtree — pass `{themes:[node]}`).
 * Slack renders no `#` headings and no nested `-` lists, so themes become bold
 * lines and every leaf is a literal bullet character with literal indentation.
 */
function outlineToSlack(notes) {
  const lines = [];
  if (notes?.summary?.text) lines.push(notes.summary.text, "");
  const walk = (bullets, depth) => {
    for (const b of bullets ?? []) {
      const hasKids = b.children && b.children.length;
      if (hasKids && depth === 0) {
        lines.push(`*${b.text}*`);
      } else {
        const indent = "    ".repeat(Math.max(0, depth - 1));
        const mark = depth >= 2 ? "◦" : "•";
        lines.push(`${indent}${mark} ${b.text}`);
      }
      if (hasKids) walk(b.children, depth + 1);
    }
  };
  walk(notes?.themes ?? [], 0);
  if (lines.length && lines[lines.length - 1] !== "") lines.push("");
  lines.push("_Powered by Threadline 🪡_");
  return lines.join("\n");
}

/**
 * HTML form of the same outline. Slack does not convert mrkdwn on paste, but its
 * composer does consume pasted HTML — so bold themes and nested lists survive.
 */
function outlineToHtml(notes) {
  const out = [];
  if (notes?.summary?.text) out.push(`<p>${esc(notes.summary.text)}</p>`);

  // Children of a bullet, as a <ul> (each <li> may hold a nested <ul>).
  const list = (bullets) =>
    `<ul>${(bullets ?? []).map((b) =>
      `<li>${esc(b.text)}${b.children && b.children.length ? list(b.children) : ""}</li>`).join("")}</ul>`;

  // Top level: bullets with children become a bold line + their list; consecutive
  // childless ones are grouped into a single <ul> so they read as one block.
  let loose = [];
  const flush = () => { if (loose.length) { out.push(list(loose)); loose = []; } };
  for (const b of notes?.themes ?? []) {
    if (b.children && b.children.length) {
      flush();
      out.push(`<p><b>${esc(b.text)}</b></p>`, list(b.children));
    } else {
      loose.push({ text: b.text });
    }
  }
  flush();

  out.push('<p><i><a href="https://github.com/rachitamahajan-design/threadline">Powered by Threadline 🪡</a></i></p>');
  return out.join("");
}

/**
 * Clipboard write carrying both flavours: rich HTML for Slack and friends,
 * plain text for editors that only take text. Falls back on old/insecure origins.
 */
async function copyRich(html, plain) {
  try {
    await navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([plain], { type: "text/plain" }),
    })]);
  } catch {
    await navigator.clipboard.writeText(plain); // http:// or old browser
  }
}

function bulletAtPath(notes, path) {
  let level = notes?.themes ?? [];
  let node = null;
  for (const i of path.split(".").map(Number)) {
    node = level?.[i];
    if (!node) return null;
    level = node.children;
  }
  return node;
}

// ── Handoff chips: nothing runs unprompted ─────────────────────────────────

/** The catalog the composer's ＋ opens. Updated whenever the mode changes. */
let currentCatalog = [];

function renderHandoffRow(meetingId, catalog, runs) {
  const row = $("#handoff-row");
  if (!row) return;
  const ran = new Set((runs ?? []).map((r) => r.handoffId));
  const dflt = catalog.find((h) => h.isDefault);
  const chip = (h, active) =>
    `<button class="hchip ${active ? "active" : "suggested"}" data-run="${h.id}"
      title="${esc(h.blurb)}${active ? "" : " — suggested for this meeting type. Click to run it."}">
      <span class="slash">/</span>${esc(h.label)}<span class="chev">›</span></button>`;
  // The type's default sits here greyed and dashed until it has actually run.
  const chips = dflt ? [chip(dflt, ran.has(dflt.id))] : [];
  for (const h of catalog.filter((h) => !h.isDefault && ran.has(h.id))) chips.push(chip(h, true));
  row.innerHTML = chips.join("");

  row.querySelectorAll("[data-run]").forEach((b) =>
    b.addEventListener("click", () => {
      // An active chip is a bookmark, not a rerun button: open the conversation
      // on its most recent card. Rerunning stays on the card's own Regenerate.
      if (b.classList.contains("active")) {
        openChatSheet();
        const cards = document.querySelectorAll(`#chat-log .hcard[data-handoff="${b.dataset.run}"]`);
        const last = cards[cards.length - 1];
        if (last) return void last.scrollIntoView({ block: "nearest" });
      }
      runHandoffFromUI(meetingId, b.dataset.run, b);
    }));
  // The full menu lives in the composer, next to the input — picking a handoff is
  // the same gesture as asking for one, so it belongs in the same place.
  const more = $("#handoff-more");
  if (more && !more.dataset.wired) {
    more.dataset.wired = "1";
    more.addEventListener("click", () => openHandoffMenu(meetingId, currentCatalog, more));
  }
  currentCatalog = catalog;
}

function openHandoffMenu(meetingId, catalog, anchor) {
  document.getElementById("slash-menu")?.remove();
  const r = anchor.getBoundingClientRect();
  const menu = document.createElement("div");
  menu.id = "slash-menu";
  menu.innerHTML = catalog
    .map(
      (h) => `<button data-pick="${h.id}"><b>${esc(h.label)}${h.isDefault ? " · suggested" : ""}${
        h.scope === "cross-meeting" ? " · across meetings" : ""
      }</b><span>${esc(h.blurb)}</span></button>`,
    )
    .join("");
  menu.style.left = `${Math.min(r.left + window.scrollX, window.innerWidth - 350)}px`;
  document.body.appendChild(menu);
  // Anchored in the lower half (the composer ＋), the menu opens upward.
  if (r.top > window.innerHeight / 2) menu.style.top = `${r.top + window.scrollY - menu.offsetHeight - 8}px`;
  else menu.style.top = `${r.bottom + window.scrollY + 6}px`;
  const close = (ev) => {
    if (!menu.contains(ev.target) && ev.target !== anchor) { menu.remove(); document.removeEventListener("mousedown", close); }
  };
  document.addEventListener("mousedown", close);
  menu.querySelectorAll("[data-pick]").forEach((b) =>
    b.addEventListener("click", () => {
      menu.remove();
      runHandoffFromUI(meetingId, b.dataset.pick);
    }));
}

/** Run a handoff and render its card into the chat log. */
async function runHandoffFromUI(meetingId, handoffId, chip, opts = {}) {
  const cross = handoffId === "collated_feedback";
  if (chip) { chip.disabled = true; chip.dataset.was = chip.innerHTML; chip.innerHTML = "<span class=\"slash\">/</span>Running…"; }
  const placeholder = pendingCard(handoffId);
  const out = await post(cross ? "/api/handoff/cross" : "/api/handoff/run", {
    meeting_id: meetingId,
    handoff_id: handoffId,
    refine: opts.refine,
  });
  placeholder.remove();
  if (chip) { chip.disabled = false; chip.innerHTML = chip.dataset.was; }
  if (out.error || !out.run) {
    const b = document.createElement("div");
    b.className = "chat-b ai";
    b.textContent = `⚠ ${out.error ?? "that handoff produced nothing"}`;
    $("#chat-log").appendChild(b);
    return null;
  }
  markChipActive(handoffId);
  appendHandoffCard(meetingId, out.run);
  return out.run;
}

/** A suggested chip stops being a suggestion once it has produced something. */
function markChipActive(handoffId) {
  const chip = $(`#handoff-row [data-run="${handoffId}"]`);
  if (chip) {
    chip.classList.remove("suggested");
    chip.classList.add("active");
  }
}

function pendingCard(handoffId) {
  openChatSheet();
  const el = document.createElement("div");
  el.className = "hcard pending";
  el.innerHTML = `<h3>${esc(handoffId.replace(/_/g, " "))}</h3>
    <div class="hmeta">grounding it in the transcript…</div>
    <div class="out-skeleton"><div></div><div></div><div></div></div>`;
  $("#chat-log").appendChild(el);
  el.scrollIntoView({ block: "nearest" });
  return el;
}

const HANDOFF_LABELS = {
  team_actions: "Team action items",
  pricing_quote: "Pricing quote",
  followup_email: "Follow-up email",
  summary_next_steps: "Summary & next steps",
  candidate_feedback: "Candidate feedback",
  collated_feedback: "Collated customer feedback",
};

function appendHandoffCard(meetingId, run, opts = {}) {
  const log = $("#chat-log");
  if (!log) return;
  const el = document.createElement("div");
  el.className = "hcard";
  el.dataset.runId = run.id;
  el.dataset.handoff = run.handoffId;
  el.innerHTML = handoffCardInner(run);
  log.appendChild(el);
  wireHandoffCard(meetingId, run, el);
  // A fresh card summons the sheet; replayed history stays tucked away until
  // the chat is engaged.
  if (!opts.replay) {
    openChatSheet();
    el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  return el;
}

function handoffCardInner(run) {
  const label = HANDOFF_LABELS[run.handoffId] ?? run.handoffId;
  return `<h3>${esc(label)}</h3>
    <div class="hmeta">${run.edited ? "<b>edited</b> · " : ""}${esc(run.promptVersion)}${
      run.dropped ? ` · ${run.dropped} unsupported line${run.dropped === 1 ? "" : "s"} dropped` : ""
    }</div>
    <div class="hbody">${run.edited && run.editedMarkdown ? `<div class="email">${esc(run.editedMarkdown)}</div>` : handoffBody(run)}</div>
    ${run.needsReview ? `<div class="review-banner"><b>Low confidence — please review.</b><span>Some lines couldn't be verified against the transcript and were dropped.</span></div>` : ""}
    <div class="hfoot">
      <button class="hbtn" data-act="copy">Copy</button>
      <button class="hbtn" data-act="edit">Edit</button>
      <button class="hbtn" data-act="regen">Regenerate</button>
      <button class="hbtn" data-act="refine">Refine…</button>
      <span class="spacer"></span>
      <button class="hbtn tiny" data-act="why" title="Prompt version, dropped lines and why">why?</button>
      <button class="hbtn tiny" data-act="dismiss" title="Remove this card">✕</button>
    </div>`;
}

/** One renderer per output shape. Each one keeps its receipts clickable. */
function handoffBody(run) {
  const v = run.value ?? {};
  // Each card numbers its own receipts from 1, like footnotes on a page.
  const rc = makeReceipts();
  const items = (list) =>
    `<ul>${(list ?? [])
      .map((i) => `<li>${esc(i.text)}${rc(i.source)}${i.lowConfidence ? `<span class="low-flag">heard poorly</span>` : ""}</li>`)
      .join("")}</ul>`;
  const actions = (list) =>
    `<ul>${(list ?? [])
      .map(
        (i) => `<li><b>${esc(i.owner)}</b> — ${esc(i.text)}${i.due ? ` <span class="pill">${esc(i.due)}</span>` : ""}${rc(i.source)}${
          i.lowConfidence ? `<span class="low-flag">heard poorly</span>` : ""
        }</li>`,
      )
      .join("")}</ul>`;

  switch (run.handoffId) {
    case "team_actions":
      return (v.perOwner ?? [])
        .map(
          (g, i) => `<div class="hgroup"><div class="ghead"><b>${esc(g.owner)}</b>
            <button class="hbtn tiny" data-block="${i}">Copy this block</button></div>${actions(g.items)}</div>`,
        )
        .join("");
    case "pricing_quote":
      return `${
        (v.quotes ?? []).length
          ? `<table><thead><tr><th>Item</th><th>Price</th><th>Unit</th><th>Terms</th><th>Valid until</th><th></th></tr></thead>
             <tbody>${v.quotes
               .map(
                 (q) => `<tr><td>${esc(q.item)}</td><td><b>${esc(q.price)}</b></td><td>${esc(q.unit || "—")}</td>
                   <td>${esc(q.terms || "—")}</td><td>${esc(q.validUntil || "—")}</td>
                   <td>${rc(q.source)}${q.lowConfidence ? `<span class="low-flag">heard poorly</span>` : ""}</td></tr>`,
               )
               .join("")}</tbody></table>`
          : `<p style="color:var(--ink-3)">No price was quoted clearly enough to record.</p>`
      }${(v.unclear ?? []).length ? `<h4>Not quoted / unclear</h4>${items(v.unclear)}` : ""}`;
    case "followup_email":
      return `<p><b>Subject:</b> ${esc(v.subject ?? "")}</p><div class="email">${emailBody(v.body ?? "", rc)}</div>`;
    case "summary_next_steps":
      return `<ul class="out-tree">${outlineTree(v.themes ?? [], rc)}</ul>
        ${(v.nextSteps ?? []).length ? `<h4>Next steps</h4>${actions(v.nextSteps)}` : ""}
        ${(v.openQuestions ?? []).length ? `<h4>Open questions</h4>${items(v.openQuestions)}` : ""}`;
    case "candidate_feedback":
      return `${(v.signals ?? []).length ? `<h4>Signals observed</h4>${items(v.signals)}` : ""}
        ${(v.strengths ?? []).length ? `<h4>Strengths</h4>${items(v.strengths)}` : ""}
        ${(v.concerns ?? []).length ? `<h4>Concerns</h4>${items(v.concerns)}` : ""}
        <h4>Stated lean</h4>${
          v.statedLean
            ? `<p>${esc(v.statedLean.text)}${rc(v.statedLean.source)}</p>`
            : `<p style="color:var(--ink-3)">None stated on the call — left for you to decide.</p>`
        }`;
    case "collated_feedback":
      return `<ul>${(v.themes ?? [])
        .map(
          (t) => `<li><b>${esc(t.theme)}</b> <span class="pill">${t.frequency} mention${t.frequency === 1 ? "" : "s"}</span>
            <span class="t-meta">${esc(String(t.kind ?? "").replace("_", " "))}</span><br>
            <span class="t-meta">heard in: ${(t.examples ?? [])
              .map((e) => `${esc(v.meetingTitles?.[e.meetingId] ?? e.meetingId)} ${rc(e.source)}`)
              .join(" · ")}</span></li>`,
        )
        .join("")}</ul>`;
    default:
      return `<div class="email">${esc(run.markdown ?? "")}</div>`;
  }
}

/** Email body: inline `[S004]` markers become chips, `**bold**` becomes bold. */
function emailBody(body, rc) {
  return esc(body)
    .replace(/\[((?:[A-Za-z]\d+)(?:\s*,\s*[A-Za-z]\d+)*)\]/g, (m, ids) => rc(ids.split(",").map((s) => s.trim())))
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

function wireHandoffCard(meetingId, run, el) {
  wireSrcChips(el);
  const act = (name) => el.querySelector(`[data-act="${name}"]`);

  el.querySelectorAll("[data-block]").forEach((b) =>
    b.addEventListener("click", async () => {
      const g = run.value.perOwner[Number(b.dataset.block)];
      const md = `${g.owner}\n${g.items.map((i) => `- ${i.text}${i.due ? ` (${i.due})` : ""}`).join("\n")}`;
      await navigator.clipboard.writeText(md);
      flashBtn(b, "Copied ✓");
    }));

  act("copy").addEventListener("click", async (e) => {
    await navigator.clipboard.writeText(run.edited && run.editedMarkdown ? run.editedMarkdown : run.markdown);

  act("regen").addEventListener("click", async () => {
    // An edit is never silently thrown away.
    if (run.edited && !confirm("You've edited this. Regenerating replaces your version. Continue?")) return;
    el.classList.add("pending");
    const fresh = await runHandoffFromUI(meetingId, run.handoffId);
    if (fresh) el.remove();

  act("refine").addEventListener("click", async () => {
    const instruction = prompt("How should this change?\n(e.g. \"shorter\", \"group by team\", \"warmer opening\")");
    if (!instruction?.trim()) return;
    el.classList.add("pending");
    const fresh = await runHandoffFromUI(meetingId, run.handoffId, null, { refine: instruction.trim() });
    if (fresh) el.remove();
    else el.classList.remove("pending");
  });

  act("why").addEventListener("click", async () => {
    const dbg = await api(`/api/grounding/debug?id=${encodeURIComponent(meetingId)}`);
    const mine = (dbg.handoffs ?? []).find((h) => h.id === run.id) ?? {};
    const lines = [
      `prompt: ${run.promptVersion}`,
      `model: ${dbg.model?.provider}/${dbg.model?.model}`,
      `statements extracted: ${dbg.statements?.count ?? 0} (${dbg.statements?.dropped?.length ?? 0} refused at extraction)`,
      `dropped here: ${mine.dropped ?? run.dropped ?? 0}`,
      "",
      ...(mine.failures ?? run.failures ?? []).slice(0, 8).map((f) => `[${f.rule}] ${f.detail}`),
      ...(dbg.statements?.dropped ?? []).slice(0, 5).map((d) => `[extraction] "${d.text.slice(0, 60)}" — ${d.reason}`),
    ];
    alert(lines.join("\n"));
  });

  act("dismiss").addEventListener("click", async () => {
    await post("/api/handoff/delete", { id: run.id });
    el.remove();
  });
}

function flashBtn(btn, text) {
  const was = btn.textContent;
  btn.textContent = text;
  setTimeout(() => (btn.textContent = was), 1400);
}

const post = (url, body) =>
  fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());

/** `/` in the chat box opens the handoff menu. Typing filters it. */
function wireSlashMenu(meetingId, input, catalog) {
  let menu = null;
  let sel = 0;
  const close = () => { menu?.remove(); menu = null; };
  const draw = (query) => {
    const matches = catalog.filter((h) => `${h.label} ${h.blurb}`.toLowerCase().includes(query.toLowerCase()));
    if (!matches.length) return close();
    if (!menu) {
      menu = document.createElement("div");
      menu.id = "slash-menu";
      document.body.appendChild(menu);
    }
    sel = Math.min(sel, matches.length - 1);
    menu.innerHTML = matches
      .map(
        (h, i) => `<button data-pick="${h.id}" class="${i === sel ? "sel" : ""}"><b>${esc(h.label)}${
          h.isDefault ? " · suggested" : ""
        }</b><span>${esc(h.blurb)}</span></button>`,
      )
      .join("");
    const r = input.getBoundingClientRect();
    menu.style.left = `${r.left + window.scrollX}px`;
    menu.style.top = `${r.top + window.scrollY - menu.offsetHeight - 8}px`;
    menu.querySelectorAll("[data-pick]").forEach((b) =>
      b.addEventListener("mousedown", (e) => {
        e.preventDefault();
        input.value = "";
        close();
        runHandoffFromUI(meetingId, b.dataset.pick);
      }));
    return matches;
  };

  input.addEventListener("input", () => {
    if (!input.value.startsWith("/")) return close();
    sel = 0;
    draw(input.value.slice(1));
  });
  input.addEventListener("keydown", (e) => {
    if (!menu) return;
    const buttons = [...menu.querySelectorAll("[data-pick]")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length;
      buttons.forEach((b, i) => b.classList.toggle("sel", i === sel));
    } else if (e.key === "Enter") {
      e.preventDefault();
      e.stopImmediatePropagation();
      const pick = buttons[sel]?.dataset.pick;
      input.value = "";
      close();
      if (pick) runHandoffFromUI(meetingId, pick);
    } else if (e.key === "Escape") close();
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
}

/** Autosave + word-swap detection: fixing a name in your notes fixes it everywhere. */
function wireNotesEditor(meetingId, doc) {
  doc.dataset.lastSaved = domToMd(doc);
  let t;
  doc.addEventListener("input", () => {
    doc.classList.toggle("is-empty", !doc.textContent.trim());
    clearTimeout(t);
    t = setTimeout(async () => {
      const md = domToMd(doc);
      const last = doc.dataset.lastSaved ?? "";
      if (md === last) return;
      doc.dataset.lastSaved = md;
      await fetch("/api/notes", { method: "POST", body: JSON.stringify({ id: meetingId, notes: md }) });
      const swap = detectWordSwapClient(last, md);
      if (swap) {
        const out = await fetch("/api/correction/auto", {
          method: "POST",
          body: JSON.stringify({ meeting_id: meetingId, from_text: swap.from, to_text: swap.to, exclude: { notes: true } }),
        }).then((r) => r.json());
        if (out.applied > 0)
          showToast(`“${swap.from}” → “${swap.to}” · fixed ${out.applied} other place${out.applied === 1 ? "" : "s"}`, "Undo", async () => {
            await fetch("/api/correction/undo", { method: "POST", body: JSON.stringify({ event_id: out.eventId }) });
            renderMeeting(meetingId);
          });
      }
    }, 700);
  });
  // Paste as plain text; checkboxes save on toggle; tidy markdown on blur.
  doc.addEventListener("paste", (e) => {
    e.preventDefault();
    document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
  });
  doc.addEventListener("change", (e) => {
    if (e.target?.type === "checkbox") doc.dispatchEvent(new Event("input"));
  });
  doc.addEventListener("blur", () => {
    const md = domToMd(doc);
    doc.innerHTML = mdToDom(md) || "<p><br></p>";
    doc.classList.toggle("is-empty", !doc.textContent.trim());
  });
}

/** Mirror of the server's detectWordSwap — one capitalized token run swapped. */
function detectWordSwapClient(before, after) {
  if (before === after || !before || !after) return null;
  if (Math.abs(before.length - after.length) > 40) return null;
  const a = before.split(/(\s+)/), b = after.split(/(\s+)/);
  let start = 0;
  while (start < a.length && start < b.length && a[start] === b[start]) start++;
  let endA = a.length - 1, endB = b.length - 1;
  while (endA >= start && endB >= start && a[endA] === b[endB]) { endA--; endB--; }
  const from = a.slice(start, endA + 1).join("").trim();
  const to = b.slice(start, endB + 1).join("").trim();
  if (!from || !to || from === to) return null;
  if (from.includes("\n") || to.includes("\n") || from.length > 40 || to.length > 40) return null;
  const w = (s) => s.split(/\s+/).filter(Boolean);
  if (w(from).length > 3 || w(to).length > 3) return null;
  if (!/^[A-Z]/.test(from) || !/^[A-Z]/.test(to)) return null;
  return { from, to };
}

/** The conversation sheet: visible only while the chat is engaged. */
function openChatSheet() {
  const sheet = $("#chat-sheet");
  if (!sheet) return;
  sheet.classList.remove("closed");
  const log = $("#chat-log");
  if (log) log.scrollTop = log.scrollHeight;
}
function closeChatSheet() {
  $("#chat-sheet")?.classList.add("closed");
}

// Clicking anywhere outside the dock dismisses the sheet — the notes come back.
// One document-level listener, replaced (not stacked) on every meeting render.
let chatOutsideClick = null;

/**
 * Block 2. Grounded answers, handoff cards and their options all land here, in
 * arrival order — inside a sheet that draws over the notes while you chat and
 * gets out of the way when you leave. Chat talks to OpenAI (the composer bar
 * names the model).
 */
function wireChat(meetingId) {
  const log = $("#chat-log"), input = $("#chat-input"), send = $("#chat-send");
  const history = (chatHistory[meetingId] ??= []);
  // The notes page only exists while the notes are unstructured; look it up on
  // demand so chat never holds a reference to an element that has been replaced.
  const notesDoc = () => $("#notes-doc");

  const bubble = (role, text) => {
    const b = document.createElement("div");
    b.className = `chat-b ${role}`;
    b.innerHTML = esc(text).replace(/\[(\d+(?:\.\d+)?)s\]/g, (m, s) => `<button class="ts-chip" data-jump="${s}">${fmtTs(Number(s))}</button>`);
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
    b.querySelectorAll("[data-jump]").forEach((c) => c.addEventListener("click", () => jumpToOffset(Number(c.dataset.jump))));
    return b;
  };

  /** Footer under an answer: keep going, or take it with you. */
  const answerActions = (question, text) => {
    const row = document.createElement("div");
    row.className = "chat-acts";
    row.innerHTML = `<button class="say-more">Say more</button>
      <button class="chat-icon" data-act="copy" title="Copy">⧉</button>`;
    log.appendChild(row);
    row.querySelector(".say-more").addEventListener("click", () => {
      row.remove();
      askWith(`Say more about that: ${question}`);
    });
    row.querySelector('[data-act="copy"]').addEventListener("click", async (e) => {
      await navigator.clipboard.writeText(text);
      flashBtn(e.currentTarget, "✓");
    });
  };

  for (const h of history) bubble(h.role === "user" ? "user" : "ai", h.content);

  const askWith = async (message) => {
    if (!message) return;
    openChatSheet();
    bubble("user", message);
    history.push({ role: "user", content: message });
    const thinking = bubble("ai thinking", "…");
    const before = notesDoc() ? domToMd(notesDoc()) : "";
    const out = await post("/api/chat", { meeting_id: meetingId, message, history: history.slice(0, -1), notes: before });
    thinking.remove();
    if (out.error) { bubble("ai", `⚠ ${out.error}`); return; }
    // "draft the follow-up email" comes back as a handoff card, not prose.
    if (out.handoff) {
      const label = HANDOFF_LABELS[out.handoff.handoffId] ?? out.handoff.handoffId;
      history.push({ role: "assistant", content: `(ran the ${label} handoff)` });
      markChipActive(out.handoff.handoffId);
      appendHandoffCard(meetingId, out.handoff);
      return;
    }
    bubble("ai", out.answer);
    history.push({ role: "assistant", content: out.answer });
    answerActions(message, out.answer);
    if (out.notes) {
      // Chat rewrote the founder's own page. If it is on screen, swap it in
      // place; if the structured notes are showing instead, just say so.
      if (notesDoc()) applyNotesUpdate(notesDoc(), meetingId, before, out.notes, "Notes updated from chat");
      else showToast("Your rough notes were updated", "Show them", () => $("#out-rough")?.click());
    }
    log.scrollTop = log.scrollHeight;
  };

  const ask = () => {
    const message = input.value.trim();
    input.value = "";
    askWith(message);
  };
  if (input && !input.disabled) {
    send.addEventListener("click", ask);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") ask();
      if (e.key === "Escape") { closeChatSheet(); input.blur(); }
    });
    // Engaging the bar is what summons the conversation over the notes.
    input.addEventListener("focus", openChatSheet);
  }
  $("#chat-min")?.addEventListener("click", closeChatSheet);
  $("#chat-clear")?.addEventListener("click", () => {
    // Clears the conversation only. Handoff cards are saved outputs — they are
    // removed with their own ✕, not by wiping the thread.
    chatHistory[meetingId] = [];
    log.querySelectorAll(".chat-b, .chat-acts").forEach((el) => el.remove());
  });
  if (chatOutsideClick) document.removeEventListener("mousedown", chatOutsideClick);
  chatOutsideClick = (e) => {
    const dock = $("#chat-dock");
    if (!dock || dock.contains(e.target)) return;
    // Menus live on <body>, but a click in them is still a chat gesture.
    if (document.getElementById("slash-menu")?.contains(e.target)) return;
    closeChatSheet();
  };
  document.addEventListener("mousedown", chatOutsideClick);
}

/** Click a transcript line to fix it; a name swap propagates everywhere. */
function wireTranscriptEdits(meetingId, body) {
  body.querySelectorAll(".utt .txt").forEach((el) =>
    el.addEventListener("click", () => {
      if (el.isContentEditable) return;
      const idx = Number(el.closest(".utt").dataset.idx);
      const original = el.textContent;
      el.contentEditable = "true";
      el.focus();
      const done = async (save) => {
        el.contentEditable = "false";
        const text = el.textContent.trim();
        if (!save || text === original || !text) { el.textContent = original; return; }
        const out = await fetch("/api/utterance/edit", {
          method: "POST",
          body: JSON.stringify({ meeting_id: meetingId, idx, text }),
        }).then((r) => r.json());
        if (out.error) { alert(out.error); el.textContent = original; return; }
        if (out.correction?.applied > 0)
          showToast(`“${out.correction.from}” → “${out.correction.to}” · fixed ${out.correction.applied} other place${out.correction.applied === 1 ? "" : "s"}`, "Undo", async () => {
            await fetch("/api/correction/undo", { method: "POST", body: JSON.stringify({ event_id: out.correction.eventId }) });
            renderMeeting(meetingId);
          });
      };
      el.addEventListener("blur", () => done(true), { once: true });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); el.blur(); }
        if (e.key === "Escape") { done(false); }
      });
    }));
}

/**
 * Center a transcript row inside the side panel WITHOUT scrolling the page —
 * scrollIntoView walks every scrollable ancestor, so it used to drag the whole
 * window down and shove the meeting title off-screen.
 */
function scrollTranscriptTo(el) {
  const body = document.getElementById("panel-body");
  if (!body || !body.contains(el)) return;
  const top = el.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
  body.scrollTo({ top: top - body.clientHeight / 2 + el.clientHeight / 2, behavior: "smooth" });
}

function jumpToOffset(off) {
  let best = null, bestD = Infinity;
  main.querySelectorAll(".utt[data-off]").forEach((u) => {
    const d = Math.abs(Number(u.dataset.off) - off);
    if (d < bestD) { bestD = d; best = u; }
  });
  if (best) {
    scrollTranscriptTo(best);
    best.classList.add("hl");
    setTimeout(() => best.classList.remove("hl"), 2500);
  }
}

/** SSE live transcript into the side panel. */
function wireLiveFeed() {
  const feed = $("#live-feed"), statusBox = $("#live-status");
  if (!feed) return;
  const partials = {};
  evtSource?.close();
  evtSource = new EventSource("/api/record/events");
  evtSource.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    if (e.type === "status") {
      if (statusBox) statusBox.textContent = e.message;
    } else if (e.type === "partial") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      let el = partials[e.speaker];
      if (!el) {
        feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="who">${e.speaker}</div><div class="live-partial"></div></div>`);
        el = partials[e.speaker] = feed.lastElementChild;
      }
      el.querySelector(".live-partial").textContent = e.text;
      el.scrollIntoView({ block: "end" });
    } else if (e.type === "final") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      const el = partials[e.speaker];
      if (el) { delete partials[e.speaker]; el.remove(); }
      feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="ts">${fmtTs(e.offsetS)}</div><div class="who">${e.speaker}</div><div>${esc(e.text)}</div></div>`);
      feed.lastElementChild.scrollIntoView({ block: "end" });
    }
  };
}

/** Select wrong text → "Correct →" → preview every occurrence → apply everywhere. */
let correctionMeetingId = null;
function wireCorrections(meetingId) {
  document.getElementById("correct-fab")?.remove();
  const alreadyWired = correctionMeetingId !== null;
  correctionMeetingId = meetingId;
  if (alreadyWired) return;
  main.addEventListener("mouseup", () => {
    setTimeout(() => {
      document.getElementById("correct-fab")?.remove();
      if (!state.meetingId) return;
      const sel = window.getSelection();
      const text = sel?.toString().trim();
      if (!text || text.length < 2 || text.length > 40 || text.includes("\n")) return;
      if (sel.anchorNode?.parentElement?.isContentEditable) return;
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      document.getElementById("fix-pop")?.remove();
      const pop = document.createElement("div");
      pop.id = "fix-pop";
      pop.innerHTML = `<span>Fix “${esc(text.length > 18 ? text.slice(0, 18) + "…" : text)}” →</span><input placeholder="correct spelling">`;
      pop.style.left = `${rect.left + window.scrollX}px`;
      pop.style.top = `${rect.bottom + window.scrollY + 6}px`;
      document.body.appendChild(pop);
      const inp = pop.querySelector("input");
      pop.addEventListener("mousedown", (e) => { if (e.target !== inp) e.preventDefault(); });
      inp.focus();
      inp.addEventListener("keydown", async (e) => {
        if (e.key === "Escape") return pop.remove();
        if (e.key !== "Enter") return;
        const to = inp.value.trim();
        pop.remove();
        if (!to || to === text) return;
        const out = await fetch("/api/correction/auto", {
          method: "POST",
          body: JSON.stringify({ meeting_id: correctionMeetingId, from_text: text, to_text: to }),
        }).then((r) => r.json());
        if (out.error) return alert(out.error);
        if (!out.applied) return showToast("Nothing to fix — no occurrences found");
        const mid = correctionMeetingId;
        showToast(`“${text}” → “${to}” · fixed ${out.applied} place${out.applied === 1 ? "" : "s"}`, "Undo", async () => {
          await fetch("/api/correction/undo", { method: "POST", body: JSON.stringify({ event_id: out.eventId }) });
          renderMeeting(mid);
        });
        renderMeeting(mid);
      });
      document.addEventListener("mousedown", function away(e) {
        if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener("mousedown", away); }
      });
    }, 0);
  });
}

const OCC_GROUPS = { summary: "Summary", claim: "Decisions & action items", utterance: "Transcript", node: "Graph", meeting_field: "Meeting fields" };

function correctionModal(meetingId, from, to, occurrences) {
  document.getElementById("correct-modal")?.remove();
  const groups = {};
  occurrences.forEach((o, i) => { (groups[o.target] ??= []).push({ ...o, i }); });
  const modal = document.createElement("div");
  modal.id = "correct-modal";
  modal.innerHTML = `<div class="box">
    <h2>Correct “${esc(from)}” → “${esc(to)}”</h2>
    <div class="t-meta">Found in ${occurrences.length} place${occurrences.length === 1 ? "" : "s"}. Uncheck anything that shouldn't change. Similar spellings are unchecked — check them if they're the same mistake.</div>
    ${Object.entries(OCC_GROUPS).filter(([k]) => groups[k]).map(([k, label]) => `
      <div class="grp">${label}</div>
      ${groups[k].map((o) => `
        <label class="occ"><input type="checkbox" data-ref="${esc(o.ref)}" ${o.match === "exact" ? "checked" : ""}>
          <span>${esc(o.snippet)}${o.match === "fuzzy" ? ` <span class="pill">similar: “${esc(o.token)}”</span>` : ""}</span>
        </label>`).join("")}`).join("")}
    <div class="actions">
      <label style="font-size:12.5px"><input type="checkbox" id="persist-corr" checked> Remember for future meetings</label>
      <span style="flex:1"></span>
      <button class="copybtn" id="corr-cancel">Cancel</button>
      <button class="copybtn" id="corr-apply" style="background:var(--ink);color:var(--bg)">Apply</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
  modal.querySelector("#corr-cancel").addEventListener("click", () => modal.remove());
  modal.querySelector("#corr-apply").addEventListener("click", async () => {
    const refs = [...modal.querySelectorAll("input[data-ref]:checked")].map((c) => c.dataset.ref);
    if (!refs.length) { modal.remove(); return; }
    const out = await fetch("/api/correction/apply", {
      method: "POST",
      body: JSON.stringify({
        meeting_id: meetingId, from_text: from, to_text: to, refs,
        persist_global: modal.querySelector("#persist-corr").checked,
      }),
    }).then((r) => r.json());
    modal.remove();
    if (out.error) { alert(out.error); return; }
    renderMeeting(meetingId);
  });
}

async function renderGraph() {
  const [{ nodes, edges }, meetingsList, topicBuckets] = await Promise.all([api("/api/graph"), api("/api/meetings"), api("/api/projects")]);
  const bucketNames = new Set(topicBuckets.map((t) => t.name.toLowerCase()));
  const meetById = Object.fromEntries(meetingsList.map((m) => [m.id, m]));
  // degree = how many meetings each person/topic touches, for the tooltip meta
  const meetingNeighbors = {};
  for (const e of edges) {
    for (const [a, b] of [[e.src, e.dst], [e.dst, e.src]]) {
      if (nodes.find((n) => n.id === b)?.kind === "meeting") (meetingNeighbors[a] ??= new Set()).add(b);
    }
  }
  const metaOf = (n) => {
    if (n.kind === "meeting") {
      const m = meetById[n.id];
      const people = (meetingNeighbors[n.id]?.size, edges.filter((e) => (e.src === n.id || e.dst === n.id) && e.kind === "attended").length);
      return m ? `${fmtDate(m.started_at)}${people ? ` · ${people} people` : ""}` : "";
    }
    const k = meetingNeighbors[n.id]?.size ?? 0;
    return `in ${k} meeting${k === 1 ? "" : "s"}`;
  };
  // Editorial cut: a knot earns its place by tying meetings together.
  // Fragment topics touching one meeting are noise, not memory.
  const topicDeg = (n) => meetingNeighbors[n.id]?.size ?? 0;
  const keptTopics = nodes
    .filter((n) => n.kind === "topic" && topicDeg(n) >= 2)
    .sort((a, b) => topicDeg(b) - topicDeg(a))
    .slice(0, 24);
  const keptIds = new Set([
    ...nodes.filter((n) => n.kind !== "topic").map((n) => n.id),

  async function brainSnippetGif(q, sub, summary, progress) {

        g.save();
        g.globalAlpha = alpha;
        g.shadowColor = color; g.shadowBlur = glow;
        g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fillStyle = color; g.fill();
        g.shadowBlur = 0;
        g.beginPath(); g.arc(x, y, Math.max(0.6, r * 0.45), 0, 6.2832); g.fillStyle = P.core; g.fill();
        g.restore();
      };
      for (const n of [...sub].sort((x, y) => pts.get(y).z - pts.get(x).z)) {
        const p = pts.get(n), k = beat(n);
        if (n.kind === "topic") dot(p.x, p.y, Math.max(3, n.r * 0.5 * p.s * fit) * k, P.topic, 16 * k, 1);
        else if (n.kind === "meeting") dot(p.x, p.y, 5.5 * p.s * k, P.meeting, 12 * k, 0.95);
        else dot(p.x, p.y, 3 * p.s * k, P.person, 6, 0.75);
      }
      g.textAlign = "center";
      for (const n of sub) {
        const p = pts.get(n);
        if (n.kind === "topic") {
          g.font = "700 11px ui-monospace, SFMono-Regular, monospace"; g.fillStyle = P.labelDim;
          g.fillText(n.label.toUpperCase().slice(0, 24), p.x, p.y - Math.max(8, n.r * 0.5 * fit) - 7);
        } else {
          g.font = "600 11px -apple-system, system-ui"; g.fillStyle = P.label;
          g.fillText(n.label.slice(0, 30), p.x, p.y + 19);
        }
      }
      g.textAlign = "left";

      // the branded panel
      g.strokeStyle = "rgba(255,246,235,0.12)"; g.lineWidth = 1;
      g.beginPath(); g.moveTo(VW + 0.5, 26); g.lineTo(VW + 0.5, GH - 26); g.stroke();
      if (logo) g.drawImage(logo, PX, 34, 30, 30);
      g.fillStyle = C.ink; g.font = '600 24px ui-serif, Georgia, "Times New Roman", serif';
      g.fillText("Threadline", PX + 40, 56);
      g.fillStyle = C.gold; g.font = "700 10.5px ui-monospace, SFMono-Regular, monospace";
      g.fillText("B R A I N   S P O T L I G H T", PX, 96);
      g.fillStyle = C.ink; g.font = TL_FONT.title;
      titleLines.forEach((l, i) => g.fillText(l, PX, 128 + i * 30));
      g.fillStyle = C.ink3; g.font = TL_FONT.small;
      g.fillText(stats, PX, 128 + (titleLines.length - 1) * 30 + 24);
      g.fillStyle = C.ink2; g.font = TL_FONT.small;
      bodyLines.forEach((l, i) => g.fillText(l, PX, bodyTop + i * bodyLH));
      g.strokeStyle = "rgba(255,246,235,0.10)";
      g.beginPath(); g.moveTo(PX, footTop + 0.5); g.lineTo(GW - 34, footTop + 0.5); g.stroke();
      g.fillStyle = C.thread; g.font = TL_FONT.url;
      g.fillText(TL_REPO_LABEL, PX, footTop + 26);
      g.fillStyle = C.ink3; g.font = "12px -apple-system, system-ui";
      g.fillText("The meeting brain that stays on your laptop.", PX, footTop + 45);
    }

    const frames = [];
    for (let t = 0; t < N; t++) {
      frame(t);
      frames.push(g.getImageData(0, 0, GW, GH));
      progress(`Weaving ${t + 1}/${N}…`);
      if (t % 6 === 5) await new Promise((r) => setTimeout(r));
    }
    progress("Stitching GIF…");
    await new Promise((r) => setTimeout(r));
    const blob = tlGif(frames, GW, GH, DELAY);
    frame(0); // leave the canvas on the resting frame for the PNG still
    return { blob, canvas: c };
  }

  /** One node and everything threaded straight to it. */
  const hood = (n) => {
    const out = [n];
    for (const e of es) {
      if (e.a === n && !out.includes(e.b)) out.push(e.b);
      else if (e.b === n && !out.includes(e.a)) out.push(e.a);
    }
    return out;
  };

  /** The shared weave: summarize, render the loop, offer the exports. */
  async function weaveShare(anchor, q, sub, summaryHint, busy, done) {
    busy("Summarizing…");
    let summary = summaryHint || "";
    if (!summary) {
      try {
        const r = await api(`/api/ask?q=${encodeURIComponent(q)}`);
        summary = r?.summary || (r?.answer ?? r?.points ?? []).map((p) => p.text).join(" ");
      } catch {}
    }
    if (!summary) {
      const mts = sub.filter((n) => n.kind === "meeting").map((n) => n.label);
      summary = `Threads in this brain touching “${q}”: ${mts.join(" · ") || sub.map((n) => n.label).join(" · ")}.`;
    }
    try {
      const { blob, canvas: still } = await brainSnippetGif(q, sub, summary, busy);
      const slug = q.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "spotlight";
      const url = URL.createObjectURL(blob);
      openPopover(anchor, `
        <div class="pop-title">${icon("share", 13)}Share this spotlight</div>
        <div style="width:300px;border-radius:12px;border:1px solid var(--glass-border);overflow:hidden">
          <img src="${url}" alt="Animated brain snippet" style="display:block;width:100%"></div>
        <div class="t-meta" style="margin:8px 3px 8px">Loops forever · ${(blob.size / 1048576).toFixed(1)} MB GIF</div>
        <button class="menu-row" data-act="gif">${icon("download", 15)}Download GIF</button>
        <button class="menu-row" data-act="png">${icon("download", 15)}Download PNG still</button>
        <button class="menu-row" data-act="copy">${icon("copy", 15)}Copy still image</button>`, (pop, close) => {
        const run = {
          gif: () => tlDownload(blob, `threadline-brain-${slug}.gif`),
          png: () => still.toBlob((b) => tlDownload(b, `threadline-brain-${slug}.png`), "image/png"),
          copy: async () => {
            try {
              await navigator.clipboard.write([new ClipboardItem({
                "image/png": new Promise((res) => still.toBlob(res, "image/png")),
              })]);
              showToast("Still copied — paste it anywhere");
            } catch {
              showToast("Couldn't reach the clipboard — download instead");
            }
          },
        };
        pop.querySelectorAll("[data-act]").forEach((btn) =>
          btn.addEventListener("click", () => { close(); run[btn.dataset.act](); }));
      });
    } catch (err) {
      showToast("Couldn't weave the snippet — try again?");
      console.error(err);
    } finally { done(); }
  }

  shareBtn.addEventListener("click", () => {
    const q = $("#brain-q").value.trim();
    const sub = ns.filter((n) => spot?.has(n.id));
    if (!q || !sub.length || shareBtn.disabled) return;
    weaveShare(shareBtn, q, sub, "",
      (t) => { shareBtn.disabled = true; shareBtn.textContent = t; }, shareIdle);
  });

  /** Panel buttons share a node's own neighborhood. */
  function wirePanelShare(node, summaryHint) {
    const btn = $("#gp-share");
    if (!btn || !node) return;
    const orig = btn.textContent;
    btn.addEventListener("click", () =>
      weaveShare(btn, node.label, hood(node), summaryHint,
        (t) => { btn.disabled = true; btn.textContent = t; },
        () => { btn.disabled = false; btn.textContent = orig; }));
  }

  async function ctxActions(nodeId) {
    const r = await api(`/api/node/context?id=${encodeURIComponent(nodeId)}`);
    if (r.error) { alert(r.error); return null; }
    return r;
  }
  window.__brainCtxDownload = async (nodeId) => {
    const r = await ctxActions(nodeId);
    if (!r) return;
    const a = document.createElement("a");
    a.download = r.filename;
    a.href = URL.createObjectURL(new Blob([r.markdown], { type: "text/markdown" }));
    a.click();
  };
  window.__brainCtxCopy = async (nodeId, btn) => {
    const r = await ctxActions(nodeId);
    if (!r) return;
    await navigator.clipboard.writeText(r.markdown);
    if (btn) { const t = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => (btn.textContent = t), 1400); }
  };

  /** Peek panel for people and topics — the node's story without leaving the graph. */
  async function openNodePanel(n) {

        <div style="font-size:13px;line-height:1.6;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 14px;white-space:pre-wrap">${esc(meeting.my_notes)}</div></div>` : ""}
      <button id="gp-open" style="margin-top:20px;width:100%;border:0;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;padding:10px 16px;border-radius:10px;color:#fff;background:var(--thread);text-align:left;box-shadow:0 1px 2px rgb(50 60 140 / 0.25)">Open the full meeting →</button>

const recBtn = $("#rec");
let recording = false, evtSource = null, pipWin = null, recTitle = "";

$("#pip-btn").addEventListener("click", () => openCompanion(recTitle || "Recording", true));

recBtn.addEventListener("click", async () => {
  try {
  if (!recording) {
    // No pre-record dialog: naming happens at stop, prefilled from the
    // conversation itself. Starting is one click / one shortcut press.
    await startRecording();
  } else await stopRecording();
  } catch (err) {
    setRecordingUI(false);
    console.error("record click failed:", err);
    alert(`Recording failed: ${err.message}\n\nMake sure you opened http://localhost:4640 (served by \`npm run dev\`), not the file directly or another preview server.`);
  }
});

async function startRecording(title) {
  const resp = await fetch("/api/record/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
  if (!resp.ok) throw new Error(`server responded ${resp.status}`);
  const r = await resp.json();
  if (r.error) { alert(r.error); return false; }
  setRecordingUI(true);
  recTitle = title;
  $("#pip-btn").style.display = "";
  state.meetingId = r.meetingId;
  renderMeeting(r.meetingId, { live: true });
  liveMetaBar();
  openCompanion(title); // best effort — the header ⧉ button is the sure path
  return true;
}

async function stopRecording() {
  recBtn.textContent = "Stitching…";
  recBtn.disabled = true;
  const r = await fetch("/api/record/stop", { method: "POST" }).then((x) => x.json());
  setRecordingUI(false);
  $("#pip-btn").style.display = "none";
  evtSource?.close();
  try { pipWin?.close(); } catch (e) {}
  pipWin = null;
  if (r.meetingId && r.exit !== "failed" && r.exit !== "discarded") {
    sessionStorage.setItem("tl-thread-anim", "1"); // Home plays the needle run: meeting → loose ends
    state.meetingId = r.meetingId; render();
  }
  else { alert(r.reason ?? "Nothing was captured."); render(); }
}

/**

  if (pipWin) return;

    return;

    pipWin = await documentPictureInPicture.requestWindow({ width: 272, height: 74, disallowReturnToOpener: true });
