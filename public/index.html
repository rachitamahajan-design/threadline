}

async function meetExtras(mid) {
  await new Promise((r) => setTimeout(r, 80));
  if (document.getElementById("meet-extras") || !main.querySelector("h1") || state.meetingId !== mid) return;
  const det = await api(`/api/meeting?id=${encodeURIComponent(mid)}`);
  const mentions = det.mentions ?? [], topicIds = det.topicIds ?? [];
  const { list } = await topicOptions(topicIds);
  const names = new Map(list.map((t) => [t.name.toLowerCase(), t]));
  const sugg = [...new Set(mentions.map((x) => names.get(x.toLowerCase())).filter((t) => t && !topicIds.includes(t.id)))];
  if (!sugg.length) return;
  const chips = document.createElement("div");
  chips.id = "meet-extras";
  chips.style.cssText = "margin:2px 0 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap";
  chips.innerHTML = sugg.slice(0, 2).map((t) => `<button class="copybtn" data-sugg="${t.id}" style="margin:0;font-size:12px;padding:3px 11px">Mentions “${esc(t.name)}” — add to thread?</button>`).join("");
  (main.querySelector(".sub") ?? main.querySelector("h1")).after(chips);
  chips.querySelectorAll("[data-sugg]").forEach((b) => b.addEventListener("click", async () => {
    await fetch("/api/project/assign", { method: "POST", body: JSON.stringify({ project_id: Number(b.dataset.sugg), meeting_id: mid }) });
    b.textContent = "Added ✓"; b.disabled = true; loadSidebar();
  }));
}


async function topicOptions(selectedIds = []) {
  const ts = await api("/api/projects");
  return { list: ts, html: `<option value="">no thread</option>` +
    ts.map((t) => `<option value="${t.id}" ${selectedIds.includes(t.id) ? "selected" : ""}>${esc(t.name)}</option>`).join("") +
    `<option value="__new">＋ New thread…</option>` };
}
async function topicSelectChange(sel, onPick) {
  let v = sel.value;
  if (v === "__new") {
    const name = prompt("Thread name?", "");
    if (!name?.trim()) { sel.value = ""; return; }
    const t = await fetch("/api/project", { method: "POST", body: JSON.stringify({ name }) }).then((x) => x.json());
    loadSidebar();
    v = String(t.id);
    sel.insertAdjacentHTML("afterbegin", `<option value="${t.id}">${esc(t.name)}</option>`);
    sel.value = v;
  }
  if (v) onPick(Number(v));
}

/**
 * A glass popover hung under an anchor element. One at a time; closes on
 * outside mousedown or Esc. `wire(pop, close)` gets the live node.
 */
function openPopover(anchor, html, wire, extraClass = "") {
  document.getElementById("tl-pop")?.remove();
  const r = anchor.getBoundingClientRect(); // measure BEFORE any await
  const pop = document.createElement("div");
  pop.id = "tl-pop";
  pop.className = `glass-pop ${extraClass}`.trim();
  pop.innerHTML = html;
  pop.style.visibility = "hidden";
  document.body.appendChild(pop);
  // keep the panel on screen on narrow viewports
  const left = Math.max(10, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 12));
  pop.style.left = `${left}px`;
  // open upward when the anchor sits near the bottom of the viewport (e.g. the identity chip)
  const below = r.bottom + pop.offsetHeight + 6 > document.documentElement.clientHeight;
  pop.style.top = below
    ? `${Math.max(10, r.top + window.scrollY - pop.offsetHeight - 6)}px`
    : `${r.bottom + window.scrollY + 6}px`;
  pop.style.visibility = "";
  const close = () => {
    pop.remove();
    document.removeEventListener("mousedown", onDown);
    document.removeEventListener("keydown", onKey);
  };
  const onDown = (ev) => { if (!pop.contains(ev.target) && !anchor.contains(ev.target)) close(); };
  const onKey = (ev) => { if (ev.key === "Escape") { ev.stopPropagation(); close(); } };
  document.addEventListener("mousedown", onDown);
  document.addEventListener("keydown", onKey);
  wire?.(pop, close);
  return pop;
}

/** Same shape, styled as a dropdown of icon+label rows. */
function openMenuPopover(anchor, rows) {
  const html = rows.map((r) => r.sep
    ? `<div class="menu-sep"></div>`
    : `<button class="menu-row ${r.danger ? "danger" : ""}" data-act="${r.id}">${icon(r.icon, 15)}${esc(r.label)}</button>`).join("");
  return openPopover(anchor, html, (pop, close) => {
    pop.querySelectorAll("[data-act]").forEach((b) =>
      b.addEventListener("click", () => {
        close();
        rows.find((r) => r.id === b.dataset.act)?.run();
      }));
  }, "menu");
}

/** `<input type="datetime-local">` wants local wall time, not an ISO instant. */
const toLocalInput = (ms) => {
  const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
};

/** Edit when a meeting started and how long it ran; persists, then re-renders. */
function openTimeEditor(anchor, meeting, onSaved) {
  openPopover(anchor, `
    <div class="pop-title">${icon("clock", 13)}Meeting time</div>
    <label class="pop-lbl">Starts<input type="datetime-local" id="pop-when" value="${toLocalInput(meeting.started_at)}"></label>
    <label class="pop-lbl">Duration (minutes)<input type="number" id="pop-dur" min="0" step="5" placeholder="—" value="${meeting.duration_minutes ?? ""}"></label>
    <div class="pop-actions">
      <button class="copybtn" data-cancel>Cancel</button>
      <button class="copybtn primary" data-save>Save</button>
    </div>`, (pop, close) => {
    pop.querySelector("[data-cancel]").addEventListener("click", close);
    pop.querySelector("[data-save]").addEventListener("click", async () => {
      const when = pop.querySelector("#pop-when").value;
      const dur = pop.querySelector("#pop-dur").value;
      const payload = { id: meeting.id };
      if (when) {
        const ms = new Date(when).getTime();
        if (Number.isFinite(ms)) payload.started_at = ms;
      }
      if (dur !== "") payload.duration_minutes = Number(dur);
      const out = await fetch("/api/meeting/time", { method: "POST", body: JSON.stringify(payload) }).then((r) => r.json());
      close();
      if (out.error) return alert(out.error);
      showToast("Meeting time updated");
      onSaved?.();
    });
    setTimeout(() => pop.querySelector("#pop-when")?.focus(), 0);
  });
}

// ── Appearance: Auto → Light → Dark, cycling ────────────────────────────────
// The <head> boot script already stamped data-theme before first paint; this

const THEME_CYCLE = ["auto", "light", "dark"];
const THEME_ICON = { auto: "theme-auto", light: "sun", dark: "moon" };
const THEME_LABEL = { auto: "Appearance: Auto (follows your system)", light: "Appearance: Light", dark: "Appearance: Dark" };
/** True when the resolved theme is dark. Read live — canvases repaint from it. */
const isDark = () => document.documentElement.getAttribute("data-theme") === "dark";
function paintThemeButton() {
  const btn = $("#theme-btn");
  if (!btn) return;
  const pref = window.__tlThemePref();
  btn.querySelector("use").setAttribute("href", `#i-${THEME_ICON[pref]}`);
  btn.title = THEME_LABEL[pref];
  btn.setAttribute("aria-label", THEME_LABEL[pref]);
}
$("#theme-btn").addEventListener("click", () => {
  const next = THEME_CYCLE[(THEME_CYCLE.indexOf(window.__tlThemePref()) + 1) % THEME_CYCLE.length];
  try { localStorage.setItem("tl-theme", next); } catch (e) { /* private mode: session-only */ }
  window.__tlApplyTheme();
  paintThemeButton();
  window.dispatchEvent(new CustomEvent("tl-theme"));
  showToast(next === "auto" ? "Appearance follows your system." : `Appearance: ${next}.`);
});

/** Create-project modal: name + what it's about. */
function projectModal(onCreated) {
  document.getElementById("project-modal")?.remove();
  const modal = document.createElement("div");
  modal.id = "project-modal";
  modal.className = "tl-modal";
  modal.innerHTML = `<div class="box">
    <h2>New thread</h2>
    <label>Name</label>
    <input type="text" id="pm-name" placeholder="e.g. Frontend Revamp">
    <label>What's it about? <span style="font-weight:400">(helps file meetings automatically)</span></label>
    <textarea id="pm-desc" rows="3" placeholder="Goal, scope, who's involved…"></textarea>
    <div class="actions">
      <span style="flex:1"></span>
      <button class="copybtn" id="pm-cancel">Cancel</button>
      <button class="copybtn" id="pm-create" style="background:var(--ink);color:var(--bg)">Create</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
  modal.querySelector("#pm-cancel").addEventListener("click", () => modal.remove());
  const create = async () => {
    const name = modal.querySelector("#pm-name").value.trim();
    if (!name) return;
    const description = modal.querySelector("#pm-desc").value.trim();
    const proj = await fetch("/api/project", { method: "POST", body: JSON.stringify({ name, description }) }).then((r) => r.json());
    modal.remove();
    if (proj?.error || !proj?.id) return alert(proj?.error ?? "Could not create thread");
    loadSidebar();
    onCreated?.(proj);
  };
  modal.querySelector("#pm-create").addEventListener("click", create);
  modal.querySelector("#pm-name").addEventListener("keydown", (e) => { if (e.key === "Enter") create(); });
  modal.querySelector("#pm-name").focus();
}

/** Downscale to a 128px cover-cropped JPEG data URI so the avatar stays tiny. */
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const S = 128;
      const c = document.createElement("canvas");
      c.width = S; c.height = S;
      const side = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(img.src); rej(new Error("unreadable image")); };
    img.src = URL.createObjectURL(file);
  });
}

async function loadSpeakerChips(meetingId) {
  const host = document.getElementById("speaker-chips");
  if (!host) return;
  const { run, speakers } = await api(`/api/speaker/status?id=${encodeURIComponent(meetingId)}`).catch(() => ({ run: null, speakers: [] }));
  const unnamed = (speakers ?? []).filter((s) => /^(Speaker|Room) \d+$/.test(s.speaker));
  let html = "";
  if (run?.status === "running" || run?.status === "queued")
    html = `<span class="up-chip" style="border-color:var(--thread);color:var(--thread)">🎙 Speaker identification in progress — this page isn't final yet</span>`;
  else if (run?.status === "failed") html = `<button class="up-chip" id="diar-retry" title="${esc(run.reason ?? "")}">🎙 speaker ID failed — retry</button>`;
  else if (unnamed.length)
    html = unnamed.map((sp) =>
      `<button class="up-chip diar-name" data-sp="${esc(sp.speaker)}" title="First line: ${esc(sp.first_line ?? "")}\nClick to name">🎙 ${esc(sp.speaker)} · ${sp.lines} lines — name?</button>`).join("");
  else if (run?.status === "shipped" && run.reason) html = `<span class="up-chip" title="${esc(run.reason)}">🎙 ${esc(run.reason)}</span>`;
  host.innerHTML = html;
  document.getElementById("diar-retry")?.addEventListener("click", async (e) => {
    e.target.textContent = "🎙 retrying…";
    await fetch("/api/speaker/retry", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: meetingId }) });
    renderMeeting(meetingId);
  });
  host.querySelectorAll(".diar-name").forEach((b) =>
    b.addEventListener("click", async () => {
      const from = b.dataset.sp;
      const to = prompt(`Who is ${from}?\nTheir first line: "${(b.title.split("\n")[0] || "").replace("First line: ", "")}"`);

        body: JSON.stringify({ meeting_id: meetingId, from, to: to.trim() }) }).then((x) => x.json());
      if (r.error) alert(r.error); else renderMeeting(meetingId);
    }));
}

  });

function needleBubble(role, content, payload) {

  const user = role === "user";

  const enumerated = payload?.mode === "enumerated"
    ? points.map((p) => `<div class="claim" style="padding:4px 0">☐ ${esc(p.text)} <span class="backlink" data-mid="${p.meeting_id}" data-off="${p.offset_s}">${esc(p.meeting_title)}</span></div>`).join("")
    : "";

    ? `<div class="t-meta" style="margin-top:6px">Threads I do have: ${payload.suggestions.map((s) => esc(s)).join(" · ")}</div>` : "";
  feed.insertAdjacentHTML("beforeend", `

      ${payload?.blocked ? `<div class="t-meta" style="margin-top:4px">${payload.blocked} ungrounded sentence(s) dropped</div>` : ""}
    </div>`);
  feed.querySelectorAll("[data-mid]").forEach((el) => {
    if (el.dataset.wired) return; el.dataset.wired = "1";

  });
  feed.scrollTop = feed.scrollHeight;
}

/** measureText word wrap: honours explicit newlines, hard-breaks giant words. */
function tlWrap(ctx, text, maxW) {
  const out = [];
  for (const para of String(text ?? "").split("\n")) {
    if (!para.trim()) { out.push(""); continue; }
    let line = "";
    for (const word of para.trim().split(/\s+/)) {
      const next = line ? `${line} ${word}` : word;
      if (ctx.measureText(next).width <= maxW) { line = next; continue; }
      if (line) { out.push(line); line = ""; }
      if (ctx.measureText(word).width <= maxW) { line = word; continue; }
      let chunk = "";
      for (const ch of word) {
        if (chunk && ctx.measureText(chunk + ch).width > maxW) { out.push(chunk); chunk = ch; }
        else chunk += ch;
      }
      line = chunk;
    }
    out.push(line);
  }
  return out;
}

/** roundRect, with a path fallback for engines that lack the native one. */
function tlRound(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/**
 * Render the whole thread as one tall card. Two passes: lay the bubbles out
 * to learn the height, then paint. Returns { canvas, W, H, hits } where hits
 * carries the header geometry the PDF needs (link rect, command baseline).
 */
async function needleCardCanvas(title, msgs) {
  const S = 2, W = 1200, PAD = 56, GAP = 18, LH = 23, BPX = 20, BPY = 15;
  const m = document.createElement("canvas").getContext("2d");
  const bubbleMax = Math.round((W - PAD * 2) * 0.74);

  const laid = msgs.map((msg) => {
    const user = msg.role === "user";
    m.font = TL_FONT.body;
    const lines = tlWrap(m, msg.content, bubbleMax - BPX * 2);
    let w = 0;
    for (const l of lines) w = Math.max(w, m.measureText(l).width);
    const points = msg.payload?.points ?? [];
    let receipt = null;
    if (!user && points.length) {
      const meetings = new Set(points.map((p) => p.meeting_id)).size;
      receipt = `🧵 ${points.length} receipt${points.length === 1 ? "" : "s"} across ${meetings} meeting${meetings === 1 ? "" : "s"}`;
      m.font = TL_FONT.small;
      w = Math.max(w, m.measureText(receipt).width);
    }
    return {
      user, lines, receipt,
      bw: Math.min(bubbleMax, Math.ceil(w) + BPX * 2),
      bh: BPY * 2 + lines.length * LH + (receipt ? 27 : 0),
    };
  });

  const meetingIds = new Set();
  for (const msg of msgs) for (const p of msg.payload?.points ?? []) meetingIds.add(p.meeting_id);
  const nAsked = msgs.filter((x) => x.role === "user").length;

  // Header is three stacked bands so nothing can collide: wordmark + repo URL,
  // then the clone chip on its own line, then a hairline and the thread title.
  const MARK_Y = 40, MARK_H = 40;                       // logo box, row 1
  const CHIP_Y = 98, CHIP_H = 41, CHIP_PX = 16;         // clone chip, row 2
  const RULE_Y = CHIP_Y + CHIP_H + 26;                  // hairline under row 2
  const HEAD_H = RULE_Y + 26, TITLE_H = 80, FOOT_H = 92;
  const bodyH = laid.reduce((s, b) => s + b.bh + GAP, 0);
  const H = Math.round(HEAD_H + TITLE_H + Math.max(bodyH - GAP, 0) + FOOT_H);

  const canvas = document.createElement("canvas");
  canvas.width = W * S; canvas.height = H * S;
  const x = canvas.getContext("2d");
  x.scale(S, S);
  x.textBaseline = "alphabetic";

  // ── ground: espresso base, warm corner glows, a soft vignette ──
  x.fillStyle = TL_CARD.bg; x.fillRect(0, 0, W, H);
  const glow = (cx, cy, r, color, a) => {
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(${color},${a})`);
    g.addColorStop(0.55, `rgba(${color},${a * 0.34})`);
    g.addColorStop(1, `rgba(${color},0)`);
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  };
  glow(W * 0.06, -60, 780, "147,164,242", 0.34);        // periwinkle, top-left
  glow(W * 1.0, 10, 700, "230,185,94", 0.26);           // gold, top-right
  glow(W * 0.02, H + 30, 620, "230,185,94", 0.15);      // gold, bottom-left
  glow(W * 1.04, H + 60, 700, "147,164,242", 0.2);      // periwinkle, bottom-right
  const vig = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.24, W / 2, H / 2, Math.max(W, H) * 0.78);
  vig.addColorStop(0, "rgba(0,0,0,0)"); vig.addColorStop(1, "rgba(0,0,0,0.28)");
  x.fillStyle = vig; x.fillRect(0, 0, W, H);

  // ── row 1: mark + wordmark left, repo URL right, both on the same band ──
  const markMid = MARK_Y + MARK_H / 2;
  const logo = await tlLogoImage();
  if (logo) x.drawImage(logo, PAD, MARK_Y, MARK_H, MARK_H);
  x.fillStyle = TL_CARD.ink; x.font = TL_FONT.serif;
  x.fillText("Threadline", PAD + 52, markMid + 11);

  x.font = TL_FONT.url;
  const urlW = Math.ceil(x.measureText(TL_REPO_LABEL).width);
  const urlBase = markMid + 5;
  x.fillStyle = TL_CARD.thread;
  x.textAlign = "right"; x.fillText(TL_REPO_LABEL, W - PAD, urlBase); x.textAlign = "left";
  const linkRect = { x: W - PAD - urlW, y: urlBase - 15, w: urlW, h: 20 };

  // ── row 2: the clone command, its own line, sized to its text ──
  x.font = TL_FONT.mono;
  const chipW = Math.ceil(x.measureText(TL_CLONE).width) + CHIP_PX * 2;
  tlRound(x, PAD, CHIP_Y, chipW, CHIP_H, 10);
  x.fillStyle = "rgba(10,8,6,0.5)"; x.fill();
  x.strokeStyle = "rgba(255,246,235,0.13)"; x.lineWidth = 1; x.stroke();
  const cmdX = PAD + CHIP_PX, cmdBase = CHIP_Y + CHIP_H / 2 + 4.5;
  x.fillStyle = TL_CARD.gold; x.fillText("$", cmdX, cmdBase);
  x.fillStyle = TL_CARD.ink2;
  x.fillText(TL_CLONE.slice(2), cmdX + x.measureText("$ ").width, cmdBase);

  // ── row 3: hairline, then the thread title ──
  x.strokeStyle = "rgba(255,246,235,0.10)"; x.lineWidth = 1;
  x.beginPath(); x.moveTo(PAD, RULE_Y + 0.5); x.lineTo(W - PAD, RULE_Y + 0.5); x.stroke();

  x.fillStyle = TL_CARD.ink; x.font = TL_FONT.title;
  const titleLines = tlWrap(x, title, W - PAD * 2);
  x.fillText(titleLines.length > 1 ? `${titleLines[0]}…` : titleLines[0], PAD, RULE_Y + 44);
  x.fillStyle = TL_CARD.ink3; x.font = TL_FONT.small;
  x.fillText(`${nAsked} question${nAsked === 1 ? "" : "s"} pulled through ${meetingIds.size} meeting${meetingIds.size === 1 ? "" : "s"}`,
    PAD, RULE_Y + 70);

  // ── the conversation ──
  let y = HEAD_H + TITLE_H;
  laid.forEach((b) => {
    const bx = b.user ? W - PAD - b.bw : PAD;
    tlRound(x, bx, y, b.bw, b.bh, 16);
    x.fillStyle = b.user ? "rgba(147,164,242,0.16)" : "rgba(255,246,235,0.055)";
    x.fill();
    x.strokeStyle = b.user ? "rgba(147,164,242,0.34)" : "rgba(255,246,235,0.13)";
    x.lineWidth = 1; x.stroke();
    x.font = TL_FONT.body;
    x.fillStyle = b.user ? "#e6e8fb" : TL_CARD.ink;
    b.lines.forEach((l, i) => x.fillText(l, bx + BPX, y + BPY + 17 + i * LH));
    if (b.receipt) {
      x.font = TL_FONT.small; x.fillStyle = TL_CARD.gold;
      x.fillText(b.receipt, bx + BPX, y + BPY + 17 + b.lines.length * LH + 11);
    }
    y += b.bh + GAP;
  });

  // ── footer ──
  x.strokeStyle = "rgba(255,246,235,0.09)";
  x.beginPath(); x.moveTo(PAD, H - 52.5); x.lineTo(W - PAD, H - 52.5); x.stroke();
  x.textAlign = "center"; x.font = TL_FONT.small; x.fillStyle = TL_CARD.ink3;
  x.fillText(`Asked across ${meetingIds.size} meeting${meetingIds.size === 1 ? "" : "s"} · Threadline — the meeting brain that stays on your laptop`,
    W / 2, H - 26);
  x.textAlign = "left";

  return { canvas, W, H, linkRect, cmd: { x: cmdX, baseline: cmdBase, size: 13 } };
}

function tlDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/**
 * A minimal one-page PDF, written by hand: the card as a DCTDecode image,
 * a /Link annotation over the repo URL, and the clone command as invisible
 * (render mode 3) but selectable text over the chip. PDF space has its
 * origin bottom-left, so every y is flipped out of canvas space.
 */
function tlThreadPdf(card) {
  const url = card.canvas.toDataURL("image/jpeg", 0.92);
  const bin = atob(url.slice(url.indexOf(",") + 1));
  const jpeg = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) jpeg[i] = bin.charCodeAt(i);

  const { W, H } = card;
  const n = (v) => Math.round(v * 100) / 100;
  const pstr = (s) => s.replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
  const content =
    `q\n${W} 0 0 ${H} 0 0 cm\n/Im0 Do\nQ\n` +
    `BT\n3 Tr\n/F1 ${card.cmd.size} Tf\n1 0 0 1 ${n(card.cmd.x)} ${n(H - card.cmd.baseline)} Tm\n(${pstr(TL_CLONE)}) Tj\nET\n`;
  const r = card.linkRect;
  const annotRect = `[${n(r.x)} ${n(H - r.y - r.h)} ${n(r.x + r.w)} ${n(H - r.y)}]`;

  const enc = new TextEncoder();
  const parts = [];
  let len = 0;
  const push = (p) => { const b = typeof p === "string" ? enc.encode(p) : p; parts.push(b); len += b.length; };
  const offsets = [];
  const obj = (body) => { offsets.push(len); push(body); };

  push("%PDF-1.4\n%âãÏÓ\n");
  obj("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  obj("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  obj(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] ` +
      `/Resources << /XObject << /Im0 5 0 R >> /Font << /F1 6 0 R >> >> ` +
      `/Contents 4 0 R /Annots [7 0 R] >>\nendobj\n`);
  obj(`4 0 obj\n<< /Length ${enc.encode(content).length} >>\nstream\n${content}endstream\nendobj\n`);
  offsets.push(len);
  push(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${card.canvas.width} /Height ${card.canvas.height} ` +
       `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg);
  push("\nendstream\nendobj\n");
  obj("6 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>\nendobj\n");
  obj(`7 0 obj\n<< /Type /Annot /Subtype /Link /Rect ${annotRect} /Border [0 0 0] ` +
      `/A << /S /URI /URI (${pstr(TL_REPO_URL)}) >> >>\nendobj\n`);

  const startxref = len;
  let xref = `xref\n0 ${offsets.length + 1}\n0000000000 65535 f \n`;
  for (const o of offsets) xref += `${String(o).padStart(10, "0")} 00000 n \n`;
  push(xref);
  push(`trailer\n<< /Size ${offsets.length + 1} /Root 1 0 R >>\nstartxref\n${startxref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}

/** The share popover: a live preview of the card, then the three exports. */
async function openNeedleShare(anchor, title) {
  const id = state.needleId;
  const msgs = id ? await api(`/api/needle/messages?id=${id}`).catch(() => []) : [];
  if (!msgs.length) return showToast("Nothing to share yet — ask something first.");

  const card = await needleCardCanvas(title, msgs);
  const preview = card.canvas.toDataURL("image/png");
  openPopover(anchor, `
    <div class="pop-title">${icon("share", 13)}Share this thread</div>
    <div style="width:280px;max-height:260px;overflow:hidden;border-radius:12px;border:1px solid var(--glass-border);position:relative">
      <img src="${preview}" alt="Card preview" style="display:block;width:100%">
      <div style="position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(to bottom, rgba(24,21,18,0), #181512)"></div>
    </div>
    <div class="t-meta" style="margin:8px 3px 8px">${msgs.length} message${msgs.length === 1 ? "" : "s"} · ${card.W}×${card.H} card</div>
    <button class="menu-row" data-act="png">${icon("download", 15)}Download PNG</button>
    <button class="menu-row" data-act="pdf">${icon("doc", 15)}Download PDF</button>
    <button class="menu-row" data-act="copy">${icon("copy", 15)}Copy image</button>`, (pop, close) => {
    const run = {
      png: () => card.canvas.toBlob((b) => tlDownload(b, "threadline-thread.png"), "image/png"),
      pdf: () => tlDownload(tlThreadPdf(card), "threadline-thread.pdf"),
      copy: async () => {
        try {
          await navigator.clipboard.write([new ClipboardItem({
            "image/png": new Promise((res) => card.canvas.toBlob(res, "image/png")),
          })]);
          showToast("Card copied — paste it anywhere");
        } catch {
          showToast("Couldn't reach the clipboard — download the PNG instead");
        }
      },
    };
    pop.querySelectorAll("[data-act]").forEach((b) =>
      b.addEventListener("click", () => { close(); run[b.dataset.act](); }));
  });
}

// ── Growth loop 2: a Brain spotlight becomes a looping GIF card ──────────
// A hand-rolled GIF89a encoder: popularity palette over 5-bit color bins,
// classic LZW, NETSCAPE loop-forever. Nothing leaves the laptop.

/** GIF-flavoured LZW over 8-bit palette indices. Returns raw code bytes. */
function tlLzw(minCodeSize, indices) {
  const out = [];
  const clearCode = 1 << minCodeSize, eofCode = clearCode + 1;
  let nBits = minCodeSize + 1, maxcode = (1 << nBits) - 1;
  let freeEnt = eofCode + 1, curAccum = 0, curBits = 0;
  let dict = new Map();
  const output = (code) => {
    curAccum |= code << curBits; curBits += nBits;
    while (curBits >= 8) { out.push(curAccum & 255); curAccum >>= 8; curBits -= 8; }
    if (freeEnt > maxcode) {
      if (nBits < 12) { nBits++; maxcode = (1 << nBits) - 1; }
      else maxcode = 1 << 12;
    }
  };
  output(clearCode);
  let ent = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const c = indices[i], key = (c << 12) | ent;
    const hit = dict.get(key);
    if (hit !== undefined) { ent = hit; continue; }
    output(ent);
    if (freeEnt < 4096) dict.set(key, freeEnt++);
    else {
      output(clearCode);
      dict = new Map(); freeEnt = eofCode + 1;
      nBits = minCodeSize + 1; maxcode = (1 << nBits) - 1;
    }
    ent = c;
  }
  output(ent); output(eofCode);
  if (curBits > 0) out.push(curAccum & 255);
  return out;
}

/** frames: ImageData[], all w×h. Returns an animated, infinitely-looping GIF. */
function tlGif(frames, w, h, delayMs) {
  // global palette: the most popular 5-bit-per-channel bins across two frames
  const hist = new Map();
  for (const f of [frames[0], frames[Math.floor(frames.length / 2)]]) {
    const d = f.data;
    for (let i = 0; i < d.length; i += 4) {
      const k = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3);
      hist.set(k, (hist.get(k) ?? 0) + 1);
    }
  }
  const top = [...hist.entries()].sort((a, b) => b[1] - a[1]).slice(0, 256).map(([k]) => k);
  const pr = new Uint8Array(256), pg = new Uint8Array(256), pb = new Uint8Array(256);
  top.forEach((k, i) => {
    pr[i] = ((k >> 10) << 3) | 4; pg[i] = (((k >> 5) & 31) << 3) | 4; pb[i] = ((k & 31) << 3) | 4;
  });
  const nPal = top.length, cache = new Map();
  const indexOf = (k) => {
    let idx = cache.get(k);
    if (idx !== undefined) return idx;
    const r = ((k >> 10) << 3) | 4, g = (((k >> 5) & 31) << 3) | 4, b = ((k & 31) << 3) | 4;
    let bd = 1e9; idx = 0;
    for (let i = 0; i < nPal; i++) {
      const d = (pr[i] - r) ** 2 + (pg[i] - g) ** 2 + (pb[i] - b) ** 2;
      if (d < bd) { bd = d; idx = i; }
    }
    cache.set(k, idx);
    return idx;
  };

  const out = [];
  const str = (s) => { for (let i = 0; i < s.length; i++) out.push(s.charCodeAt(i)); };
  const u16 = (v) => { out.push(v & 255, (v >> 8) & 255); };
  str("GIF89a"); u16(w); u16(h); out.push(0xF7, 0, 0);
  for (let i = 0; i < 256; i++) out.push(pr[i], pg[i], pb[i]);
  out.push(0x21, 0xFF, 11); str("NETSCAPE2.0"); out.push(3, 1, 0, 0, 0); // loop forever
  const delay = Math.max(2, Math.round(delayMs / 10));
  for (const f of frames) {
    const d = f.data, px = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < d.length; i += 4, p++)
      px[p] = indexOf(((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3));
    out.push(0x21, 0xF9, 4, 0x04); u16(delay); out.push(0, 0); // GCE: keep previous frame
    out.push(0x2C); u16(0); u16(0); u16(w); u16(h); out.push(0); // image descriptor
    out.push(8); // LZW min code size
    const lzw = tlLzw(8, px);
    for (let i = 0; i < lzw.length; i += 255) {
      const chunk = lzw.slice(i, i + 255);
      out.push(chunk.length, ...chunk);
    }
    out.push(0);
  }
  out.push(0x3B);
  return new Blob([new Uint8Array(out)], { type: "image/gif" });
}

/**
 * Project mindmap: the project at center, colored branches per facet,
 * leaves are the project's own meetings, decisions, people, open items
 * and topics. Fixed categorical hue order; leaves click through.
 */
function projectMindmap(project, groups) {
  const LEAF_H = 26, GROUP_GAP = 30, PAD = 46;
  const Wm = 960, cx = Wm / 2;
  const sides = { left: [], right: [] };
  groups.forEach((g, i) => sides[i % 2 ? "left" : "right"].push(g));
  const sideH = (arr) => arr.reduce((s, g) => s + Math.max(1, g.items.length) * LEAF_H + GROUP_GAP, 0);
  const H = Math.max(sideH(sides.left), sideH(sides.right), 260) + PAD * 2;
  const cy = H / 2;
  let out = "";
  const branch = (x1, y1, x2, y2, color, w, op) =>
    `<path d="M ${x1} ${y1} C ${x1 + (x2 - x1) * 0.45} ${y1}, ${x1 + (x2 - x1) * 0.55} ${y2}, ${x2} ${y2}" fill="none" style="stroke:${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
  for (const [side, arr] of Object.entries(sides)) {
    const dir = side === "right" ? 1 : -1;
    let y = cy - sideH(arr) / 2 + GROUP_GAP / 2;
    for (const g of arr) {
      const blockH = Math.max(1, g.items.length) * LEAF_H;
      const gy = y + blockH / 2, gx = cx + dir * 165;
      const labelW = 18 + g.label.length * 8.2;
      out += branch(cx + dir * 66, cy, gx, gy, g.color, 2.6, 0.9);
      out += `<circle cx="${gx}" cy="${gy}" r="3.2" style="fill:${g.color}"/>`;
      out += `<text x="${gx + dir * 11}" y="${gy + 4.5}" text-anchor="${dir > 0 ? "start" : "end"}" style="font:650 13.5px -apple-system,system-ui;fill:var(--ink)">${esc(g.label)}</text>`;
      const startX = gx + dir * (labelW + 4);
      const lx = gx + dir * (labelW + 74);
      const avail = dir > 0 ? Wm - lx - 16 : lx - 16;
      const maxCh = Math.max(10, Math.floor(avail / 6.6));
      g.items.forEach((it, k) => {
        const ly = y + k * LEAF_H + LEAF_H / 2;
        out += branch(startX, gy, lx - dir * 7, ly, g.color, 1.4, 0.55);
        const t = it.label.length > maxCh ? it.label.slice(0, maxCh - 1) + "…" : it.label;
        out += `<text x="${lx}" y="${ly + 4}" text-anchor="${dir > 0 ? "start" : "end"}" ${it.mid ? `data-mid="${it.mid}" style="cursor:pointer;font:500 12.5px -apple-system,system-ui;fill:${g.color};text-decoration:underline;text-underline-offset:3px"` : `style="font:500 12.5px -apple-system,system-ui;fill:var(--ink-2)"`}>${esc(t)}</text>`;
      });
      y += blockH + GROUP_GAP;
    }
  }
  const nameW = Math.max(96, project.name.length * 9.4 + 34);
  out += `<rect x="${cx - nameW / 2}" y="${cy - 21}" width="${nameW}" height="42" rx="11" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4" style="filter:drop-shadow(0 1px 2px rgb(0 0 0 / 0.14))"/>
    <text x="${cx}" y="${cy + 5}" text-anchor="middle" style="font:650 15px -apple-system,system-ui;fill:var(--ink)">${esc(project.name)}</text>`;
  return `<svg viewBox="0 0 ${Wm} ${H}" style="width:100%;display:block">${out}</svg>`;
}

async function renderProject(id) {
  const { project, meetings, claims, people, speakers = [], docs = [], items = [], topics = [], error } = await api(`/api/project?id=${id}`);
  if (error) { main.innerHTML = `<div class="empty">${esc(error)}</div>`; return; }
  const decisions = claims.filter((c) => c.kind === "decision");
  // Meeting-extracted + manual project items, one list: pending first.
  const actionRow = (c, manual) => `
    <div class="claim todo ${c.done ? "done" : ""}" style="display:flex;gap:10px;align-items:baseline">
      <input type="checkbox" ${c.done ? "checked" : ""} data-todo="${c.id}">
      <div style="flex:1">
        <b>${esc(manual ? (c.person_name ?? c.body.owner ?? "unassigned") : (c.body.owner ?? "unassigned"))}</b> — ${esc(c.body.task)}
        ${c.body.due ? ` <span class="pill">due ${esc(c.body.due)}</span>` : ""}
        ${manual && c.document_id ? ` <span class="pill" data-doc="${c.document_id}" style="cursor:pointer" title="Open the linked doc">🗎 ${esc(c.doc_title ?? "doc")}</span>` : ""}
        <span class="t-meta">· ${manual ? `thread item <button data-del-item="${c.id}" title="Delete" style="border:none;background:none;color:var(--ink-3);cursor:pointer">✕</button>` : esc(c.meeting_title)}</span>
      </div>
    </div>`;
  const actions = [
    ...items.map((c) => ({ c, manual: true })),
    ...claims.filter((c) => c.kind === "action_item").map((c) => ({ c, manual: false })),
  ].sort((a, b) => (a.c.done ? 1 : 0) - (b.c.done ? 1 : 0));

  main.innerHTML = `
    <h1>${esc(project.name)}</h1>
    <div class="proj-desc" id="proj-desc" title="Click to edit">${project.description ? esc(project.description) : `<span style="color:var(--ink-3)">What's this thread about? Click to add — it helps file meetings automatically.</span>`}</div>
    <div class="sub">${meetings.length} meeting${meetings.length === 1 ? "" : "s"} · ${docs.length} doc${docs.length === 1 ? "" : "s"} · ${actions.filter((a) => !a.c.done).length} open</div>
    <div class="card">${projectMindmap(project, (() => {
      const more = (arr, n) => (arr.length > n ? [{ label: `+ ${arr.length - n} more` }] : []);
      const open = claims.filter((c) => c.kind === "action_item" && !c.done);
      const who = people.length ? people.map((p) => ({ label: p.name })) : speakers.map((s) => ({ label: s.speaker }));
      return [

/** All the project page's interactions. Re-renders the page after each write. */
function wireProject(id, project) {
  const refresh = () => renderProject(id);

  // Ask-this-project bar (docked at the bottom of the screen)
  const askMsg = (cls, text) => {
    const el = document.createElement("div");
    el.className = `ask-msg ${cls}`;
    el.textContent = text;
    $("#ask-log").hidden = false;
    $("#ask-log").appendChild(el);
    $("#ask-log").scrollTop = $("#ask-log").scrollHeight;
    return el;
  };
  const sendAsk = async () => {
    const q = $("#ask-input").value.trim();
    if (!q || $("#ask-send").disabled) return;
    $("#ask-input").value = "";
    $("#ask-send").disabled = true;
    askMsg("q", q);
    const thinking = askMsg("a", "Thinking…");
    try {
      const out = await fetch("/api/project/ask", {
        method: "POST",
        body: JSON.stringify({ project_id: id, question: q }),
      }).then((r) => r.json());
      if (out?.error) thinking.textContent = out.error;
      else {
        thinking.textContent = out.answer;
        if (out.sources?.length) {
          const src = document.createElement("span");
          src.className = "ask-src";
          src.textContent = `Sources: ${out.sources.join(" · ")}`;
          thinking.appendChild(src);
        }
      }
    } catch {
      thinking.textContent = "Something went wrong — is the server still running?";
    }
    $("#ask-send").disabled = false;
    $("#ask-log").scrollTop = $("#ask-log").scrollHeight;
  };
  $("#ask-send").addEventListener("click", sendAsk);
  $("#ask-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendAsk(); });

  // Editable description
  $("#proj-desc").addEventListener("click", () => {
    const cur = project.description ?? "";
    const box = document.createElement("textarea");
    box.rows = 3;
    box.value = cur;
    box.style.cssText = "width:100%;max-width:720px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)";
    $("#proj-desc").replaceWith(box);
    box.focus();
    box.addEventListener("blur", async () => {
      await fetch("/api/project/update", { method: "POST", body: JSON.stringify({ id, description: box.value }) });
      refresh();
    });
  });

  // People
  api("/api/people").then((all) => {
    $("#people-list").innerHTML = all.map((p) => `<option value="${esc(p.name)}">`).join("");
  });
  const addPerson = async () => {
    const name = $("#add-person").value.trim();
    if (!name) return;
    await fetch("/api/project/person", { method: "POST", body: JSON.stringify({ project_id: id, name, team: $("#add-person-team").value.trim() || undefined }) });
    refresh();
  };
  $("#add-person-btn").addEventListener("click", addPerson);
  $("#add-person").addEventListener("keydown", (e) => { if (e.key === "Enter") addPerson(); });
  main.querySelectorAll("[data-unperson]").forEach((b) =>
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      await fetch("/api/project/person", { method: "POST", body: JSON.stringify({ project_id: id, person_id: Number(b.dataset.unperson), remove: true }) });
      refresh();
    }));

  // Documents
  main.querySelectorAll(".doc-row[data-doc]").forEach((r) =>
    r.addEventListener("click", () => {
      if (r.dataset.kind === "note") { state.view = "doc"; state.docId = Number(r.dataset.doc); state.projectId = id; render(); }
      else window.open(`/api/doc/file?id=${r.dataset.doc}`, "_blank");
    }));
  main.querySelectorAll("[data-del-doc]").forEach((b) =>
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const title = b.closest(".doc-row")?.querySelector(".doc-title")?.textContent ?? "this document";
      if (!confirm(`Remove "${title}" from the thread? This deletes the file too.`)) return;
      const out = await fetch("/api/doc/delete", { method: "POST", body: JSON.stringify({ id: Number(b.dataset.delDoc) }) }).then((r) => r.json());
      if (out?.error) return alert(out.error);
      refresh();
    }));
  $("#doc-new").addEventListener("click", async () => {
    const title = prompt("Doc title?", "");
    if (!title?.trim()) return;
    const doc = await fetch("/api/project/doc", { method: "POST", body: JSON.stringify({ project_id: id, title }) }).then((r) => r.json());
    if (doc?.error || !doc?.id) return alert(doc?.error ?? "Could not create doc");
    state.view = "doc"; state.docId = doc.id; state.projectId = id; render();
  });
  $("#doc-upload").addEventListener("click", () => $("#doc-file").click());
  $("#doc-file").addEventListener("change", async () => {
    const f = $("#doc-file").files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) return showToast("That file is over 10MB — too big for now.");
    const data_b64 = await new Promise((res) => {
      const rd = new FileReader();
      rd.onload = () => res(String(rd.result).split(",")[1]);
      rd.readAsDataURL(f);
    });
    const out = await fetch("/api/project/doc/upload", {
      method: "POST",
      body: JSON.stringify({ project_id: id, filename: f.name, mime: f.type || "application/octet-stream", data_b64 }),
    }).then((r) => r.json());
    if (out?.error) return alert(out.error);
    showToast(`"${f.name}" added to the thread's context`);
    refresh();
  });

  // Action items
  main.querySelectorAll("[data-todo]").forEach((cb) =>
    cb.addEventListener("change", () => {
      fetch("/api/todo", { method: "POST", body: JSON.stringify({ id: Number(cb.dataset.todo), done: cb.checked }) });
      cb.closest(".claim").classList.toggle("done", cb.checked);
      loadSidebar();
    }));
  main.querySelectorAll("[data-del-item]").forEach((b) =>
    b.addEventListener("click", async () => {
      await fetch("/api/project/item/delete", { method: "POST", body: JSON.stringify({ id: Number(b.dataset.delItem) }) });
      refresh();
    }));
  main.querySelectorAll(".pill[data-doc]").forEach((p) =>
    p.addEventListener("click", () => { state.view = "doc"; state.docId = Number(p.dataset.doc); state.projectId = id; render(); }));
  const addItem = async () => {
    const task = $("#item-task").value.trim();
    if (!task) return;
    let document_id = $("#item-doc").value ? Number($("#item-doc").value) : undefined;
    // "Create a doc for this": the item's deliverable is a doc, born into the
    // project's context right away, titled after the task.
    if ($("#item-doc").value === "new") {
      const doc = await fetch("/api/project/doc", { method: "POST", body: JSON.stringify({ project_id: id, title: task }) }).then((r) => r.json());
      if (doc?.error || !doc?.id) return alert(doc?.error ?? "Could not create doc");
      document_id = doc.id;
    }
    const out = await fetch("/api/project/item", {
      method: "POST",
      body: JSON.stringify({
        project_id: id, task,
        person_id: $("#item-person").value ? Number($("#item-person").value) : undefined,
        due: $("#item-due").value.trim() || undefined,
        document_id,
      }),
    }).then((r) => r.json());
    if (out?.error) return alert(out.error);
    refresh();
  };
  $("#item-add").addEventListener("click", addItem);
  $("#item-task").addEventListener("keydown", (e) => { if (e.key === "Enter") addItem(); });
}

/** Project doc editor: same markdown editor as meeting notes, versioned saves. */
async function renderDoc(id) {
  const { doc, error } = await api(`/api/doc?id=${id}`);
  if (error) { main.innerHTML = `<div class="empty">${esc(error)}</div>`; return; }
  main.innerHTML = `
    <div class="sub" style="margin-bottom:10px"><a href="#" id="doc-back" style="color:var(--thread);text-decoration:none">⟨ Back to thread</a></div>
    <input id="doc-title" value="${esc(doc.title)}">
    <div id="doc-editor" contenteditable="true" data-ph="Write here — this doc is part of the thread's context."></div>
    <div class="t-meta" id="doc-status" style="margin-top:6px"></div>`;
  $("#doc-back").addEventListener("click", (e) => { e.preventDefault(); state.view = "project"; state.projectId = doc.project_id; render(); });
  const editor = $("#doc-editor");
  editor.innerHTML = doc.content ? mdToDom(doc.content) : "<p><br></p>";
  let saveTimer;
  const save = async () => {
    await fetch("/api/doc/save", { method: "POST", body: JSON.stringify({ id, markdown: domToMd(editor), title: $("#doc-title").value.trim() || undefined }) });
    $("#doc-status").textContent = "Saved";
    setTimeout(() => { $("#doc-status").textContent = ""; }, 1500);
  };
  const queueSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 800); };
  editor.addEventListener("input", queueSave);
  $("#doc-title").addEventListener("input", queueSave);
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}

    <div class="card"><h2 class="serif-h">Loose ends <span class="h2-note">· pulled from your meetings</span></h2>
      <div class="loose-rail" id="loose-rail">
      <div id="rail-needle" aria-hidden="true">
        <div style="font-size:17px;line-height:1">🧵</div>
        <svg width="34" height="13" viewBox="0 0 40 15" fill="none" style="transform:rotate(38deg);transform-origin:14% 50%;margin:2px 0 0 6px;filter:drop-shadow(0 1px 1px rgb(40 40 60 / .2))">
          <path d="M2.9 4.2 C 1.2 5.1, 1.2 9.9, 2.9 10.8 L 11 9.9 L 33 8.15 L 38.4 7.5 L 33 6.85 L 11 5.1 Z" fill="url(#rn-g)"/>
          <path d="M3.4 5.1 L 32 6.95" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.75"/>

      ${(() => {
        // priority: dated items first (sooner-sounding first), then recent meetings

          if (/tomorrow/.test(due)) return 1;

          if (due) return 3;

        const openT = todos.filter((t) => !t.done).sort((a, b) => rank(a) - rank(b) || b.started_at - a.started_at);

      if (cb.checked) needleRunTo(cb);
      else {
        endWeave(cb.dataset.id ?? "x");
        document.querySelectorAll(`.weave-svg[data-claim="${cb.dataset.id}"]`).forEach((s) => s.remove());
      }
    });
  main.querySelectorAll(".todo input").forEach(wireTodo);
  wireMeetingLinks();
}

/**
 * Draw the resting rail as a flimsy thread: a slack curve that sways
 * gently left-right down the list, drawn to the container's real height.
 */
function drawRailThread() {
  const rail = document.getElementById("loose-rail");
  if (!rail) return;
  rail.querySelector(".rail-svg")?.remove();
  // orphan sweep: a flyer whose animation died with a previous render must not
  // linger as a stray needle parked wherever its path last put it
  const liveNodes = new Set(Object.values(_flyers).map((f) => f.node));
  rail.querySelectorAll(".needle-flyer").forEach((n) => { if (!liveNodes.has(n)) n.remove(); });
  const h = rail.scrollHeight, x = 9;
  let d = `M ${x} 8`, y = 8, side = 1;
  while (y < h - 20) {
    const seg = Math.min(110, h - 20 - y);
    d += ` c ${6 * side} ${seg * 0.35}, ${-7 * side} ${seg * 0.65}, 0 ${seg}`;
    y += seg; side = -side;
  }
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "rail-svg");
  svg.setAttribute("width", 24); svg.setAttribute("height", h);
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", d);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", "var(--thread)");
  p.setAttribute("stroke-width", "1.3");
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("opacity", "0.35");
  svg.appendChild(p);
  rail.appendChild(svg);
}

/**
 * The design-canvas weave: the thread stitches itself along the path as
 * dashes (a masked reveal), a faint under-thread showing through the sheet,
 * while the needle glides the curve and dips beneath the paper between
 * stitches — surfacing, diving, surfacing — then exits. The stitches stay.
 */
const _flyers = {};
function endWeave(id) {
  const f = _flyers[id];
  if (!f) return;
  delete _flyers[id];
  try { f.anim?.cancel(); } catch (e) {}
  f.node?.remove();
  const rest = document.querySelector("#rail-needle");
  if (rest && !Object.keys(_flyers).length) rest.style.opacity = "1";
}

function needleRunTo(checkbox) {
  return new Promise((done) => {
    const rail = document.getElementById("loose-rail");
    if (!rail || !checkbox) return done();
    const id = checkbox.dataset.id ?? "x";
    endWeave(id);
    const rb = rail.getBoundingClientRect(), cb = checkbox.getBoundingClientRect();
    const cx = cb.left - rb.left + cb.width / 2, cy = cb.top - rb.top + cb.height / 2;
    const x0 = Math.max(0, cx - 54);
    const weave = `c 12 -13, 26 -13, 36 -1 c 8 9, 20 9, 28 0 c 8 -9, 20 -9, 34 -6`;
    // top rows get a short approach; lower rows ride the long slack descent
    const d = cy < 96
      ? `M 9 ${Math.max(2, cy - 26)} C 6 ${cy}, ${x0 * 0.5} ${cy + 10}, ${x0} ${cy + 7} ${weave}`
      : `M 9 6 C 24 ${cy * 0.25}, -6 ${cy * 0.55}, 8 ${cy * 0.8} S ${x0 - 14} ${cy + 12}, ${x0} ${cy + 7} ${weave}`;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "weave-svg");
    svg.dataset.claim = String(id);
    svg.setAttribute("width", rail.clientWidth); svg.setAttribute("height", rail.scrollHeight);

    const mid = "wv" + id + "-" + Math.random().toString(36).slice(2, 7);
    const defs = document.createElementNS(ns, "defs");
    const mask = document.createElementNS(ns, "mask");
    mask.setAttribute("id", mid);
    const mp = document.createElementNS(ns, "path");
    mp.setAttribute("d", d); mp.setAttribute("fill", "none");
    mp.setAttribute("stroke", "#fff"); mp.setAttribute("stroke-width", "40");
    mask.appendChild(mp); defs.appendChild(mask); svg.appendChild(defs);

    const g = document.createElementNS(ns, "g");
    g.setAttribute("mask", `url(#${mid})`);
    // the pass under the paper: the thread shows only faintly through the sheet
    const under = document.createElementNS(ns, "path");
    under.setAttribute("d", d); under.setAttribute("fill", "none");
    under.setAttribute("stroke", "var(--thread)"); under.setAttribute("stroke-width", "1.2");
    under.setAttribute("opacity", "0.14");
    // the stitches that sit on top of the paper
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", d); p.setAttribute("fill", "none");
    p.setAttribute("stroke", "var(--thread)"); p.setAttribute("stroke-width", "1.5");
    p.setAttribute("stroke-linecap", "round"); p.setAttribute("opacity", "0.8");
    p.style.strokeDasharray = "15 9";
    g.appendChild(under); g.appendChild(p); svg.appendChild(g);
    rail.appendChild(svg);

    const L = mp.getTotalLength();
    mp.style.strokeDasharray = String(L); mp.style.strokeDashoffset = String(L);
    const DUR = 1900, EASE = "cubic-bezier(.42,.03,.28,.99)";
    mp.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: DUR, easing: EASE, fill: "forwards" })
      .onfinish = () => p.animate([{ opacity: 0.8 }, { opacity: 0.5 }], { duration: 900, fill: "forwards" });

    const rest = document.querySelector("#rail-needle");
    const flyer = document.createElement("div");
    flyer.className = "needle-flyer";
    flyer.innerHTML = `<svg width="40" height="15" viewBox="0 0 40 15" fill="none">
      <defs><linearGradient id="${mid}-n" x1="34" y1="3.4" x2="28" y2="11.6" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#f4f6f8"/><stop offset="0.42" stop-color="#c8ccd3"/>
        <stop offset="0.7" stop-color="#8f959f"/><stop offset="1" stop-color="#6f757f"/></linearGradient></defs>
      <path d="M37.1 4.2 C 38.8 5.1, 38.8 9.9, 37.1 10.8 L 29 9.9 L 7 8.15 L 1.6 7.5 L 7 6.85 L 29 5.1 Z" fill="url(#${mid}-n)"/>
      <path d="M36.6 5.1 L 8 6.95" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.75"/>
      <ellipse cx="33.6" cy="7.5" rx="1.05" ry="2.15" fill="var(--bg)" stroke="#7d838d" stroke-width="0.55"/></svg>`;
    // pin a sane default: with no offset-path support the flyer must not fall
    // back to its static position (the bottom of the list)
    flyer.style.top = "0"; flyer.style.left = "0";
    flyer.style.offsetPath = `path('${d.replace(/\s+/g, " ").trim()}')`;
    flyer.style.offsetRotate = "auto";
    flyer.style.offsetAnchor = "84% 50%";
    rail.appendChild(flyer);
    if (rest) rest.style.opacity = "0";
    // register before anything can fail: every exit path below goes through
    // endWeave, which only cleans up needles it knows about
    _flyers[id] = { node: flyer, anim: null };
    // safety net FIRST: whatever happens below, the flyer dies and the resting
    // needle comes back — a browser that rejects the animation must not strand it
    setTimeout(() => { endWeave(id); done(); }, DUR + 600);
    if (!CSS.supports("offset-path", "path('M 0 0 L 1 1')")) { endWeave(id); return done(); }

    // dips: the needle vanishes under the sheet between stitches, then surfaces
    let fa;
    try {
    fa = flyer.animate(
      [
        { offsetDistance: "0%", opacity: 1 },
        { offsetDistance: "52%", opacity: 1, offset: 0.52 },
        { offsetDistance: "60%", opacity: 0.12, offset: 0.6 },
        { offsetDistance: "68%", opacity: 1, offset: 0.68 },
        { offsetDistance: "78%", opacity: 0.12, offset: 0.78 },
        { offsetDistance: "86%", opacity: 1, offset: 0.86 },
        { offsetDistance: "100%", opacity: 0 },
      ],
      { duration: DUR, easing: EASE, fill: "forwards" },
    );
    } catch (e) { endWeave(id); return done(); }
    if (_flyers[id]) _flyers[id].anim = fa;
    fa.onfinish = () => { endWeave(id); done(); };
    fa.oncancel = () => endWeave(id);
  });
}

function parseWhen(s) {
  const now = new Date();
  const t = s.trim().toLowerCase();
  const m = t.match(/(\d{1,2}):(\d{2})/);
  const d = new Date(now);
  if (t.includes("tomorrow")) d.setDate(d.getDate() + 1);
  if (m) d.setHours(Number(m[1]), Number(m[2]), 0, 0);
  else d.setHours(d.getHours() + 1, 0, 0, 0);
  if (d < now && !t.includes("tomorrow")) d.setDate(d.getDate() + 1);
  return d.getTime();
}

async function loadUpcoming() {
  const box = $("#upcoming-box");
  if (!box) return;
  const ups = await api("/api/upcoming");
  const now = Date.now();
  // A meeting that already started is either running ("Now") or it rolls off —
  // it must never come back as a negative countdown.
  const endOf = (u) => u.end_ms || u.at_ms + 60 * 60000;
  const list = ups.filter((u) => u.at_ms > now || now < endOf(u));
  if (!list.length) return;
  box.innerHTML = list.map((u, i) => {
    const mins = Math.round((u.at_ms - now) / 60000);
    const running = mins <= 0;
    const durMin = u.end_ms ? Math.round((u.end_ms - u.at_ms) / 60000) : 0;
    const d = new Date(u.at_ms);
    // "10:30 – 11:00 AM" with the meridiem set small
    const ampm = (ms) => fmtClock(ms).replace(/\s*([AaPp])\.?[Mm]\.?$/, (_, x) => `<span class="ampm">${x.toUpperCase()}M</span>`);
    const range = u.end_ms ? `${fmtClock(u.at_ms).replace(/\s*[AaPp]\.?[Mm]\.?$/, "")} – ${ampm(u.end_ms)}` : ampm(u.at_ms);
    if (i > 0)
      return `<div class="up-slim" data-up="${u.id}">
        <span class="up-tick"></span>
        <span class="s-time">${running ? "Now" : fmtClock(u.at_ms)}${dayStart(u.at_ms) !== dayStart(now) ? " · " + fmtDate(u.at_ms) : ""}</span>
        <span class="s-title">${esc(u.title)}</span>
        ${u.participants ? `<span class="s-people">${esc(u.participants)}</span>` : ""}
      </div>`;
    return `<div class="up-lead" data-up="${u.id}" data-people="${esc(u.participants ?? "")}">
      <div class="up-cal">
        <div class="up-daynum">${d.getDate()}</div>
        <div class="up-mon">${d.toLocaleDateString(undefined, { month: "short" })}</div>
        <div class="up-dow">${dayStart(u.at_ms) === dayStart(now) ? `<span class="up-dot"></span>` : ""}${d.toLocaleDateString(undefined, { weekday: "short" })}</div>
      </div>
      <div class="up-body">
        <span class="up-tick"></span>
        <div class="up-name">${esc(u.title)}</div>
        <div class="up-line">
          <span class="up-time">${range}</span>
          ${durMin > 0 ? `<span class="up-chip">${icon("clock", 12)}${durMin} min</span>` : ""}
          ${running ? `<span class="up-chip now">Now</span>`
            : mins < 60 ? `<span class="up-chip soon">In ${mins} min</span>` : ""}
        </div>
        ${u.participants ? `<div class="up-people">${esc(u.participants)}</div>` : ""}
        <div class="prep-slot"></div>
      </div>
    </div>`;
  }).join("");
  // prep: what the brain knows about each meeting's people
  for (const el of box.querySelectorAll(".up-lead")) {
    const people = el.dataset.people;
    if (!people) continue;
    const prep = await api(`/api/prep?people=${encodeURIComponent(people)}`);
    const slot = el.querySelector(".prep-slot");
    const bits = [];
    for (const o of prep.open)
      bits.push(`<div class="prep"><b>Still open — ${esc(o.body.owner)}</b>${esc(o.body.task)}${o.body.due ? ` (due ${esc(o.body.due)})` : ""}</div>`);
    for (const r of prep.recent.slice(0, 2))
      bits.push(`<div class="prep past" data-mid="${r.id}" style="cursor:pointer"><b>Last time — ${esc(r.title)}</b>${fmtDate(r.started_at)}</div>`);
    slot.innerHTML = bits.join("") || "";
    slot.querySelectorAll("[data-mid]").forEach((p) =>
      p.addEventListener("click", () => { state.meetingId = p.dataset.mid; render(); }));
  }
}

/**
 * Client-side filter for the meetings list: free text over title/participants/
 * headline, ANDed with a topic chip. Rows hide in place, day headers follow
 * their group, and the first visible row of each group drops its hairline so
 * the borders never start mid-air.
 */
function wireMeetingFilter(rows) {
  const box = $("#mtg-list");
  const input = $("#mtg-filter");
  if (!box || !input) return;
  const meta = new Map(rows.map((m) => [String(m.id), {
    text: `${m.title ?? ""} ${m.participants ?? ""} ${m.headline ?? ""}`.toLowerCase(),
    topics: String(m.topic_ids ?? "").split(",").filter(Boolean),
  }]));
  const none = $("#mtg-none");
  let topic = "all";

  const apply = () => {
    const q = input.value.trim().toLowerCase();
    let shown = 0, head = null, headCount = 0, firstVis = null;
    const flush = () => {
      if (head) head.hidden = headCount === 0;
      if (firstVis) firstVis.classList.add("mtg-first");
    };
    for (const el of box.children) {
      if (el.classList.contains("day-head")) { flush(); head = el; headCount = 0; firstVis = null; continue; }
      if (!el.classList.contains("mtg-row")) continue;
      el.classList.remove("mtg-first");
      const m = meta.get(el.dataset.mid) ?? { text: "", topics: [] };
      const ok = (!q || m.text.includes(q)) && (topic === "all" || m.topics.includes(topic));
      el.hidden = !ok;
      if (ok) { shown++; headCount++; if (!firstVis) firstVis = el; }
    }
    flush();
    if (none) none.hidden = shown > 0;
  };

  input.addEventListener("input", apply);
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    e.stopPropagation();                 // don't let it bubble to the global Esc
    input.value = ""; apply();
  });
  $("#mtg-topics")?.querySelectorAll(".fchip").forEach((b) =>
    b.addEventListener("click", () => {
      topic = b.dataset.topic;
      $("#mtg-topics").querySelectorAll(".fchip").forEach((o) => o.classList.toggle("on", o === b));
      apply();
    }));
  $("#mtg-clear")?.addEventListener("click", () => {
    input.value = ""; topic = "all";
    $("#mtg-topics")?.querySelectorAll(".fchip").forEach((o) => o.classList.toggle("on", o.dataset.topic === "all"));
    apply();
    input.focus();
  });
}

// ── Markdown ⇄ DOM for the notes editor ────────────────────────────────
function inlineMd(text) {
  return esc(text)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>");
}

function mdToDom(md) {
  const lines = String(md ?? "").split("\n");
  let html = "", depth = 0;
  const setDepth = (d) => {
    while (depth < d) { html += "<ul>"; depth++; }
    while (depth > d) { html += "</ul>"; depth--; }
  };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    const h = line.match(/^(#{1,3})\s+(.*)/);
    const task = line.match(/^(\s*)- \[( |x)\]\s+(.*)/);
    const bul = line.match(/^(\s*)-\s+(.*)/);
    if (h) { setDepth(0); html += `<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`; }
    else if (task) { setDepth(task[1].length >= 2 ? 2 : 1); html += `<li class="task"><input type="checkbox" ${task[2] === "x" ? "checked" : ""}>${inlineMd(task[3])}</li>`; }
    else if (bul) { setDepth(bul[1].length >= 2 ? 2 : 1); html += `<li>${inlineMd(bul[2])}</li>`; }
    else if (!line.trim()) setDepth(0);
    else { setDepth(0); html += `<p>${inlineMd(line)}</p>`; }
  }
  setDepth(0);
  return html;
}

function domToMd(root) {
  const inline = (node) => {
    let s = "";
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) s += n.textContent;
      else if (n.nodeName === "B" || n.nodeName === "STRONG") s += `**${inline(n)}**`;
      else if (n.nodeName === "I" || n.nodeName === "EM") s += `*${inline(n)}*`;
      else if (n.nodeName === "BR") s += "\n";
      else if (n.nodeName === "INPUT" || n.nodeName === "UL") { /* handled by list walker */ }
      else s += inline(n);
    });
    return s;
  };
  const blocks = [];
  const walkList = (ul, indent) => {
    const items = [];
    for (const li of ul.children) {
      if (li.nodeName !== "LI") continue;
      const box = li.querySelector(':scope > input[type="checkbox"]');
      const prefix = box ? `- [${box.checked ? "x" : " "}] ` : "- ";
      items.push(indent + prefix + inline(li).trim());
      for (const sub of li.children) if (sub.nodeName === "UL") items.push(walkList(sub, indent + "  "));
    }
    return items.join("\n");
  };
  for (const el of root.childNodes) {
    if (el.nodeType === 3) { if (el.textContent.trim()) blocks.push(el.textContent.trim()); continue; }
    const tag = el.nodeName;
    if (tag === "H1") blocks.push(`# ${inline(el).trim()}`);
    else if (tag === "H2") blocks.push(`## ${inline(el).trim()}`);
    else if (tag === "H3" || tag === "H4") blocks.push(`### ${inline(el).trim()}`);
    else if (tag === "UL") blocks.push(walkList(el, ""));
    else if (tag === "OL") blocks.push(walkList(el, ""));
    else {
      const text = inline(el).trim();
      if (text) blocks.push(text);
    }
  }
  return blocks.join("\n\n");
}

/** Project tags on the meeting: add/remove, picked from the projects list.
 *  Pending suggestions render as dashed chips the user accepts or dismisses. */
function wireTags(meetingId, assigned, suggestions = []) {
  const row = $("#tag-row");
  if (!row) return;
  let tags = [...assigned];
  let pending = [...suggestions];

  const assign = async (projectId, remove) => {
    await fetch("/api/project/assign", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: projectId, meeting_id: meetingId, remove: !!remove }),
    });
    loadSidebar();
  };

  const draw = () => {
    row.innerHTML =
      tags.map((p) => `
        <span class="tag-chip">🧵 ${esc(p.name)}<button data-untag="${p.id}" title="Remove this thread">×</button></span>`).join("") +
      pending.map((s) => `
        <span class="tag-chip suggest" title="${esc(s.reason ?? "")}${s.confidence != null ? ` (${Math.round(s.confidence * 100)}%)` : ""}">
          🧵 File in ${esc(s.name)}?
          <button data-accept="${s.id}" title="Yes, file it">✓</button>
          <button data-dismiss="${s.id}" title="No, not this thread">✕</button>
        </span>`).join("") +
      `<button class="tag-add" id="tag-add">+ Add thread</button>`;
    row.querySelectorAll("[data-untag]").forEach((b) =>
      b.addEventListener("click", async () => {
        const pid = Number(b.dataset.untag);
        tags = tags.filter((t) => t.id !== pid);
        draw();
        await assign(pid, true);
      }));
    const resolve = async (sid, action) => {
      const s = pending.find((x) => x.id === sid);
      pending = pending.filter((x) => x.id !== sid);
      const out = await fetch("/api/suggestion/resolve", { method: "POST", body: JSON.stringify({ id: sid, action }) }).then((r) => r.json());
      if (out?.projects) tags = out.projects;
      draw();
      loadSidebar();
      if (action === "accept" && s) showToast(`Filed in ${s.name}`);
    };
    row.querySelectorAll("[data-accept]").forEach((b) =>
      b.addEventListener("click", () => resolve(Number(b.dataset.accept), "accept")));
    row.querySelectorAll("[data-dismiss]").forEach((b) =>
      b.addEventListener("click", () => resolve(Number(b.dataset.dismiss), "dismiss")));
    row.querySelector("#tag-add").addEventListener("click", openMenu);
  };

  async function openMenu() {
    document.getElementById("tag-menu")?.remove();
    const anchor = row.querySelector("#tag-add");
    const r = anchor.getBoundingClientRect(); // measure BEFORE any await
    const menu = document.createElement("div");
    menu.id = "tag-menu";
    menu.innerHTML = `<button disabled style="color:var(--ink-3);cursor:default">Loading…</button>`;
    menu.style.left = `${r.left + window.scrollX}px`;
    menu.style.top = `${r.bottom + window.scrollY + 4}px`;
    document.body.appendChild(menu);
    const close = (ev) => { if (!menu.contains(ev.target) && ev.target !== anchor) { menu.remove(); document.removeEventListener("mousedown", close); } };
    document.addEventListener("mousedown", close);

    const all = await api("/api/projects");
    menu.innerHTML =
      (all.length
        ? all.map((p) => {
            const on = tags.some((t) => t.id === p.id);
            return `<button data-pid="${p.id}" data-on="${on ? 1 : 0}">${on ? "✓ " : ""}${esc(p.name)}</button>`;
          }).join("")
        : `<button disabled style="color:var(--ink-3);cursor:default">No threads yet</button>`) +
      `<button data-new="1" style="border-top:1px solid var(--line);border-radius:0;margin-top:4px;padding-top:8px">＋ New thread…</button>`;

    menu.querySelectorAll("[data-pid]").forEach((b) =>
      b.addEventListener("click", async () => {
        menu.remove();
        const pid = Number(b.dataset.pid);
        const wasOn = b.dataset.on === "1";
        if (wasOn) tags = tags.filter((t) => t.id !== pid);
        else tags = [...tags, all.find((p) => p.id === pid)];
        draw();
        await assign(pid, wasOn);
      }));
    menu.querySelector("[data-new]").addEventListener("click", () => {
      menu.remove();
      projectModal(async (proj) => {
        tags = [...tags, proj];
        draw();
        await assign(proj.id, false);
      });
    });
  }

  draw();
}

/** Panel collapse/reopen + drag-to-resize, controls living on the panel itself. */
function wirePanelChrome(meetingId) {
  const ws = main.querySelector(".workspace");
  $("#panel-close")?.addEventListener("click", () => {
    panelState.open = false;
    localStorage.setItem("tl-panel", "closed");
    renderMeeting(meetingId, recording && state.meetingId === meetingId ? { live: true } : {});
  });
  document.getElementById("panel-reopen")?.addEventListener("click", () => {
    panelState.open = true;
    localStorage.setItem("tl-panel", "open");
    renderMeeting(meetingId, recording && state.meetingId === meetingId ? { live: true } : {});
  });
  const grip = $("#panel-grip");
  if (!grip) return;
  grip.addEventListener("mousedown", (e) => {
    e.preventDefault();
    grip.classList.add("dragging");
    const startX = e.clientX, startW = panelState.width;
    const move = (ev) => {
      panelState.width = Math.min(720, Math.max(280, startW + (startX - ev.clientX)));
      ws.style.setProperty("--panel-w", `${panelState.width}px`);
    };
    const up = () => {
      grip.classList.remove("dragging");
      localStorage.setItem("tl-panel-w", String(panelState.width));
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
}

        <div id="chat-dock">
          <div id="chat-sheet" class="closed">
            <div class="chat-top">
              <button class="chat-icon" id="chat-clear" title="Clear this conversation">↺</button>
              <span class="spacer"></span>
              ${live ? "" : `<button class="chat-icon" id="rec-inline" title="Keep recording into this meeting — new audio joins the same transcript">●&nbsp;rec</button>`}
              <button class="chat-icon" id="chat-min" title="Hide the conversation">▾</button>

  const moreActions = {
    async regenerate() {
      const out = await fetch("/api/meeting/regenerate", { method: "POST", body: JSON.stringify({ id }) }).then((r) => r.json());
      if (out.error) return alert(out.error);

      if (!projects.length) return alert("No threads yet — create one with + in the sidebar first.");
      const p = projects[Number(prompt("Tag this meeting with which thread?\n" + projects.map((x, i) => `${i + 1}. ${x.name}`).join("\n"), "1")) - 1];

      const { occurrences } = await fetch("/api/correction/preview", { method: "POST", body: JSON.stringify({ meeting_id: id, from_text: from, to_text: to }) }).then((r) => r.json());
      if (!occurrences?.length) return alert("No occurrences found.");
      correctionModal(id, from.trim(), to.trim(), occurrences);
    },
    async deleteMeeting() {
      if (!confirm("Delete this meeting and its notes, transcript and threads? This cannot be undone.")) return;
      await fetch("/api/meeting/delete", { method: "POST", body: JSON.stringify({ id }) });
      state.meetingId = null; state.view = "today"; render();
    },
  };
  $("#more").addEventListener("click", (e) => {
    openMenuPopover(e.currentTarget, [
      { id: "regen", icon: "sparkle", label: "Regenerate extraction", run: moreActions.regenerate },
      { id: "tag", icon: "tag", label: "Tag thread…", run: moreActions.tagTopic },
      { id: "find", icon: "search", label: "Advanced find & replace…", run: moreActions.findReplace },
      { sep: true },
