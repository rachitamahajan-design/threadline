<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadline</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f7; --surface: #ffffff; --border: #e8e6e1;
    --ink: #1a1917; --ink-2: #57544e; --ink-3: #8a867d;
    --accent: #2a78d6;
    --node-meeting: #2a78d6; --node-person: #eb6834; --node-topic: #1baf7a;
    --pass: #008300; --block: #e34948;
    --shadow: 0 1px 3px rgb(0 0 0 / 0.06), 0 4px 14px rgb(0 0 0 / 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #161513; --surface: #1f1e1b; --border: #33312c;
      --ink: #f2f0eb; --ink-2: #c3c2b7; --ink-3: #86837a;
      --accent: #3987e5;
      --node-meeting: #3987e5; --node-person: #d95926; --node-topic: #199e70;
      --pass: #34a834; --block: #e66767;
      --shadow: 0 1px 3px rgb(0 0 0 / 0.4);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 28px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .logo::before { content: "◉ "; color: var(--accent); }
  nav { display: flex; gap: 4px; }
  nav button {
    border: 0; background: none; color: var(--ink-2); font: inherit;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  nav button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
  #search {
    margin-left: auto; width: 300px; padding: 7px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  main { max-width: 980px; margin: 0 auto; padding: 28px; }
  h1 { font-size: 26px; letter-spacing: -0.03em; margin-bottom: 4px; }
  .sub { color: var(--ink-2); margin-bottom: 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 14px; }
  .todo { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); align-items: flex-start; }
  .todo:first-of-type { border-top: 0; }
  .todo input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; }
  .todo.done .t-task { text-decoration: line-through; color: var(--ink-3); }
  .t-task { font-weight: 550; }
  .t-meta { color: var(--ink-2); font-size: 13px; }
  .receipt {
    font-size: 13px; color: var(--ink-2); margin-top: 3px;
    border-left: 3px solid var(--accent); padding: 2px 10px; border-radius: 2px;
    background: color-mix(in srgb, var(--accent) 6%, transparent);
    cursor: pointer;
  }
  .receipt:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .pill {
    display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px;
    border: 1px solid var(--border); color: var(--ink-2); margin-right: 6px;
  }
  .pill.pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 40%, transparent); }
  .pill.block { color: var(--block); border-color: color-mix(in srgb, var(--block) 40%, transparent); }
  .m-row { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer; align-items: baseline; }
  .m-row:first-of-type { border-top: 0; }
  .m-row:hover .m-title { color: var(--accent); }
  .m-title { font-weight: 600; }
  .m-date { color: var(--ink-3); font-size: 13px; min-width: 90px; }
  .utt { display: flex; gap: 12px; padding: 6px 0; }
  .utt.hl { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; padding: 6px 10px; margin: 0 -10px; }
  .utt .who { min-width: 76px; font-weight: 600; font-size: 13px; color: var(--ink-2); padding-top: 2px; }
  .utt .ts { color: var(--ink-3); font-size: 12px; min-width: 40px; text-align: right; padding-top: 3px; }
  .claim { padding: 9px 0; border-top: 1px solid var(--border); }
  .claim:first-of-type { border-top: 0; }
  .backlink { display: inline-block; margin: 3px 6px 3px 0; padding: 4px 11px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--accent); cursor: pointer; font-size: 13px; }
  #graph-wrap { position: relative; height: 560px; overflow: hidden; border-radius: 14px; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  .legend { display: flex; gap: 18px; align-items: center; padding: 10px 4px 0; font-size: 13px; color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .legend .l-m::before { background: var(--node-meeting); }
  .legend .l-p::before { background: var(--node-person); border-radius: 2px; }
  .legend .l-t::before { background: var(--node-topic); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .empty { color: var(--ink-3); text-align: center; padding: 40px 0; }
  #rec {
    border: 0; font: inherit; font-weight: 600; cursor: pointer;
    padding: 7px 16px; border-radius: 10px; color: #fff; background: var(--block);
  }
  #rec.recording { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.65; } }
  .live-partial { color: var(--ink-3); font-style: italic; }
  .live-you .who { color: var(--accent); }
  .live-status { font-size: 12px; color: var(--ink-3); padding: 2px 0; }
  .exit-line { font-size: 13px; color: var(--ink-2); margin-top: 10px; }
  b { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo">Threadline</div>
  <nav>
    <button data-view="today" class="active">Today</button>
    <button data-view="meetings">Meetings</button>
    <button data-view="graph">Graph</button>
  </nav>
  <input id="search" placeholder="Search everything you've ever discussed…">
  <button id="rec">● Record</button>
</header>
<main id="main"></main>

<script>
const $ = (s) => document.querySelector(s);
const main = $("#main");
const state = { view: "today", meetingId: null, highlight: null };
const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtTs = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (p) => fetch(p).then((r) => r.json());

document.querySelectorAll("nav button").forEach((b) =>
  b.addEventListener("click", () => { state.view = b.dataset.view; state.meetingId = null; render(); }));

async function render() {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view && !state.meetingId));
  if (state.meetingId) return renderMeeting(state.meetingId);
  if (state.view === "today") return renderToday();
  if (state.view === "meetings") return renderMeetings();
  if (state.view === "graph") return renderGraph();
}

async function renderToday() {
  const { todos, meetings } = await api("/api/today");
  const open = todos.filter((t) => !t.done);
  main.innerHTML = `
    <h1>${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</h1>
    <div class="sub">${open.length} open item${open.length === 1 ? "" : "s"} from ${meetings.length} meeting${meetings.length === 1 ? "" : "s"} — every one with a receipt.</div>
    <div class="card"><h2>To-dos · extracted from what people actually said</h2>
      ${todos.length ? todos.map((t) => `
        <div class="todo ${t.done ? "done" : ""}">
          <input type="checkbox" ${t.done ? "checked" : ""} data-id="${t.id}">
          <div>
            <div class="t-task">${esc(t.body.task)}</div>
            <div class="t-meta">${t.body.owner ? esc(t.body.owner) : "unassigned"}${t.body.due ? ` · due ${esc(t.body.due)}` : ""}</div>
            <div class="receipt" data-mid="${t.meeting_id}" data-q="${esc(t.body.task)}">"${esc(t.quote ?? t.body.task)}" — ${esc(t.meeting_title)}</div>
          </div>
        </div>`).join("") : `<div class="empty">No action items yet. Run <code>npm run demo</code> or record a meeting.</div>`}
    </div>
    <div class="card"><h2>Recent meetings</h2>
      ${meetings.map((m) => `
        <div class="m-row" data-mid="${m.id}">
          <div class="m-date">${fmtDate(m.started_at)}</div>
          <div><div class="m-title">${esc(m.title)}</div>
          <div class="t-meta">${esc(m.headline ?? "")}</div></div>
          <span class="pill ${m.exit === "shipped" ? "pass" : ""}" style="margin-left:auto">${esc(m.exit ?? "…")}</span>
        </div>`).join("")}
    </div>`;
  main.querySelectorAll(".todo input").forEach((cb) =>
    cb.addEventListener("change", async () => {
      await fetch("/api/todo", { method: "POST", body: JSON.stringify({ id: Number(cb.dataset.id), done: cb.checked }) });
      render();
    }));
  wireMeetingLinks();
}

async function renderMeetings() {
  const ms = await api("/api/meetings");
  main.innerHTML = `<h1>Meetings</h1><div class="sub">Everything stays on this laptop.</div>
    <div class="card">${ms.map((m) => `
      <div class="m-row" data-mid="${m.id}">
        <div class="m-date">${fmtDate(m.started_at)}</div>
        <div><div class="m-title">${esc(m.title)}</div><div class="t-meta">${esc(m.headline ?? "")}</div></div>
        <span class="pill" style="margin-left:auto">${esc(m.mode)}</span>
      </div>`).join("")}</div>`;
  wireMeetingLinks();
}

async function renderMeeting(id) {
  const { meeting, utterances, claims, runs, backlinks } = await api(`/api/meeting?id=${encodeURIComponent(id)}`);
  const byKind = (k) => claims.filter((c) => c.kind === k && c.gate === "passed");
  const blocked = claims.filter((c) => c.gate === "blocked");
  const hl = state.highlight;
  main.innerHTML = `
    <h1>${esc(meeting.title)}</h1>
    <div class="sub">${fmtDate(meeting.started_at)} · ${Math.round(meeting.duration_s / 60)} min · mode: ${esc(meeting.mode)}</div>
    ${meeting.summary ? `<div class="card"><h2>Summary</h2><p>${esc(meeting.summary)}</p></div>` : ""}
    ${byKind("decision").length ? `<div class="card"><h2>Decisions</h2>${byKind("decision").map((c) => `<div class="claim">✓ ${esc(c.body.text)}</div>`).join("")}</div>` : ""}
    ${byKind("action_item").length ? `<div class="card"><h2>Action items</h2>${byKind("action_item").map((c) => `
      <div class="claim"><b>${esc(c.body.owner ?? "?")}</b> — ${esc(c.body.task)}${c.body.due ? ` <span class="pill">due ${esc(c.body.due)}</span>` : ""}</div>`).join("")}</div>` : ""}
    ${byKind("risk").length ? `<div class="card"><h2>Risks</h2>${byKind("risk").map((c) => `
      <div class="claim">${esc(c.body.category)} · <span class="t-meta">"${esc(c.body.quote)}"</span></div>`).join("")}</div>` : ""}
    ${backlinks.length ? `<div class="card"><h2>Linked meetings</h2>${backlinks.map((b) => `
      <span class="backlink" data-mid="${b.id}">${esc(b.title)} <span style="opacity:.6">via ${esc(b.via)}</span></span>`).join("")}</div>` : ""}
    <div class="card"><h2>Transcript</h2>
      ${utterances.map((u) => `
        <div class="utt ${hl && u.text.toLowerCase().includes(hl.toLowerCase().slice(0, 24)) ? "hl" : ""}">
          <div class="ts">${fmtTs(u.offset_s)}</div>
          <div class="who">${esc(u.speaker ?? u.speaker_role)}</div>
          <div>${esc(u.text)}</div>
        </div>`).join("")}
    </div>
    <div class="exit-line">Run exit: <span class="pill ${meeting.exit === "shipped" ? "pass" : "block"}">${esc(meeting.exit ?? "?")}</span>
      ${claims.filter((c) => c.gate === "passed").length} claims passed ·
      ${blocked.length} blocked by gates${blocked.length ? ` (${blocked.map((b) => esc(b.gate_reason)).join("; ")})` : ""}</div>`;
  state.highlight = null;
  wireMeetingLinks();
}

function wireMeetingLinks() {
  main.querySelectorAll("[data-mid]").forEach((el) =>
    el.addEventListener("click", () => {
      state.meetingId = el.dataset.mid;
      if (el.dataset.q) state.highlight = el.dataset.q;
      render();
      window.scrollTo(0, 0);
    }));
}

async function renderGraph() {
  const { nodes, edges } = await api("/api/graph");
  main.innerHTML = `<h1>Your meeting brain</h1>
    <div class="sub">${nodes.length} nodes · ${edges.length} threads. Drag to explore, click a meeting to open it.</div>
    <div class="card" id="graph-wrap"><canvas id="graph"></canvas></div>
    <div class="legend"><span class="l-m">Meeting</span><span class="l-p">Person</span><span class="l-t">Topic</span></div>`;
  const canvas = $("#graph"), wrap = $("#graph-wrap");
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const COLOR = { meeting: css.getPropertyValue("--node-meeting"), person: css.getPropertyValue("--node-person"), topic: css.getPropertyValue("--node-topic") };
  const INK = css.getPropertyValue("--ink"), INK3 = css.getPropertyValue("--ink-3"), BORDER = css.getPropertyValue("--border"), SURFACE = css.getPropertyValue("--surface");

  const ns = nodes.map((n, i) => ({
    ...n, label: n.meeting_title ?? n.label,
    x: W / 2 + 180 * Math.cos((i / nodes.length) * 2 * Math.PI),
    y: H / 2 + 180 * Math.sin((i / nodes.length) * 2 * Math.PI),
    vx: 0, vy: 0, r: n.kind === "meeting" ? 22 : n.kind === "person" ? 13 : 9,
  }));
  const byId = Object.fromEntries(ns.map((n) => [n.id, n]));
  const es = edges.filter((e) => byId[e.src] && byId[e.dst]);
  let drag = null;

  function tick() {
    for (const a of ns) {
      for (const b of ns) {
        if (a === b) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = Math.max(dx * dx + dy * dy, 40);
        const f = 2600 / d2;
        a.vx += (dx / Math.sqrt(d2)) * f; a.vy += (dy / Math.sqrt(d2)) * f;
      }
      a.vx += (W / 2 - a.x) * 0.004; a.vy += (H / 2 - a.y) * 0.004;
    }
    for (const e of es) {
      const a = byId[e.src], b = byId[e.dst];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.max(Math.hypot(dx, dy), 1);
      const f = (d - 110) * 0.012;
      a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    }
    for (const n of ns) {
      if (n === drag) continue;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x = Math.max(n.r + 4, Math.min(W - n.r - 4, n.x + n.vx));
      n.y = Math.max(n.r + 4, Math.min(H - n.r - 4, n.y + n.vy));
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = BORDER; ctx.lineWidth = 1.2;
    for (const e of es) {
      const a = byId[e.src], b = byId[e.dst];
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (const n of ns) {
      ctx.fillStyle = COLOR[n.kind] ?? INK3;
      ctx.strokeStyle = SURFACE; ctx.lineWidth = 2;
      ctx.beginPath();
      if (n.kind === "person") {
        const s = n.r;
        ctx.roundRect(n.x - s, n.y - s, s * 2, s * 2, 4);
      } else if (n.kind === "topic") {
        ctx.moveTo(n.x, n.y - n.r); ctx.lineTo(n.x + n.r, n.y); ctx.lineTo(n.x, n.y + n.r); ctx.lineTo(n.x - n.r, n.y); ctx.closePath();
      } else {
        ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI);
      }
      ctx.fill(); ctx.stroke();
      if (n.kind === "meeting" || n.kind === "person") {
        ctx.fillStyle = INK; ctx.font = "600 12px system-ui"; ctx.textAlign = "center";
        const label = n.label.length > 22 ? n.label.slice(0, 21) + "…" : n.label;
        ctx.fillText(label, n.x, n.y + n.r + 15);
      }
    }
  }

  let frames = 0;
  (function loop() { tick(); draw(); if (++frames < 600 || drag) requestAnimationFrame(loop); else drawLabelsFinal(); })();
  function drawLabelsFinal() {
    draw();
    ctx.fillStyle = INK3; ctx.font = "11px system-ui"; ctx.textAlign = "center";
    for (const n of ns) if (n.kind === "topic") ctx.fillText(n.label.length > 18 ? n.label.slice(0, 17) + "…" : n.label, n.x, n.y + n.r + 13);
  }

  const hit = (mx, my) => ns.find((n) => Math.hypot(n.x - mx, n.y - my) <= n.r + 4);
  canvas.addEventListener("mousedown", (ev) => {
    const r = canvas.getBoundingClientRect();
    drag = hit(ev.clientX - r.left, ev.clientY - r.top) ?? null;
    if (drag) requestAnimationFrame(function dl() { tick(); draw(); if (drag) requestAnimationFrame(dl); });
  });
  canvas.addEventListener("mousemove", (ev) => {
    const r = canvas.getBoundingClientRect();
    if (drag) { drag.x = ev.clientX - r.left; drag.y = ev.clientY - r.top; }
    else canvas.style.cursor = hit(ev.clientX - r.left, ev.clientY - r.top) ? "pointer" : "grab";
  });
  window.addEventListener("mouseup", () => { drag = null; });
  canvas.addEventListener("click", (ev) => {
    const r = canvas.getBoundingClientRect();
    const n = hit(ev.clientX - r.left, ev.clientY - r.top);
    if (n?.kind === "meeting") { state.meetingId = n.id; render(); }
  });
}

// ── Live recording ──────────────────────────────────────────────────────
const recBtn = $("#rec");
let recording = false, evtSource = null;

recBtn.addEventListener("click", async () => {
  if (!recording) {
    const title = prompt("Meeting title?", "Untitled meeting");
    if (title === null) return;
    const r = await fetch("/api/record/start", { method: "POST", body: JSON.stringify({ title }) }).then((x) => x.json());
    if (r.error) return alert(r.error);
    recording = true;
    recBtn.textContent = "■ Stop & process";
    recBtn.classList.add("recording");
    renderLive(title);
  } else {
    recBtn.textContent = "… processing";
    recBtn.disabled = true;
    const r = await fetch("/api/record/stop", { method: "POST" }).then((x) => x.json());
    recording = false;
    recBtn.disabled = false;
    recBtn.textContent = "● Record";
    recBtn.classList.remove("recording");
    evtSource?.close();
    if (r.meetingId && r.exit !== "failed") { state.meetingId = r.meetingId; render(); }
    else { alert("Nothing was captured — check mic/screen-recording permissions."); render(); }
  }
});

function renderLive(title) {
  main.innerHTML = `<h1>${esc(title)}</h1><div class="sub">Recording — no bot in your call. Speak normally; words appear as they land.</div>
    <div class="card"><h2>Live transcript</h2><div id="live-feed"><div class="empty">listening…</div></div></div>
    <div class="card"><h2>Capture status</h2><div id="live-status"></div></div>`;
  const feed = $("#live-feed"), statusBox = $("#live-status");
  const partials = {};
  evtSource = new EventSource("/api/record/events");
  evtSource.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    if (e.type === "status") {
      statusBox.insertAdjacentHTML("beforeend", `<div class="live-status">${esc(e.message)}</div>`);
    } else if (e.type === "partial") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      let el = partials[e.speaker];
      if (!el) {
        feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}" id="p-${e.speaker}"><div class="who">${e.speaker}</div><div class="live-partial"></div></div>`);
        el = partials[e.speaker] = feed.lastElementChild;
      }
      el.querySelector(".live-partial").textContent = e.text;
      feed.parentElement.scrollTop = 1e9;
    } else if (e.type === "final") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      const el = partials[e.speaker];
      if (el) { delete partials[e.speaker]; el.remove(); }
      feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="ts">${fmtTs(e.offsetS)}</div><div class="who">${e.speaker}</div><div>${esc(e.text)}</div></div>`);
      window.scrollTo(0, document.body.scrollHeight);
    }
  };
}

let searchTimer;
$("#search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) return render();
  searchTimer = setTimeout(async () => {
    const hits = await api(`/api/search?q=${encodeURIComponent(q)}`);
    main.innerHTML = `<h1>“${esc(q)}”</h1><div class="sub">${hits.length} meeting${hits.length === 1 ? "" : "s"} matched</div>
      <div class="card">${hits.length ? hits.map((h) => `
        <div class="m-row" data-mid="${h.id}">
          <div class="m-date">${fmtDate(h.started_at)}</div>
          <div><div class="m-title">${esc(h.title)}</div><div class="t-meta">${h.hit}</div></div>
        </div>`).join("") : `<div class="empty">Nothing yet — it searches every word of every meeting.</div>`}</div>`;
    wireMeetingLinks();
  }, 250);
});
