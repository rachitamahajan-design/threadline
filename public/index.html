<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadline</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf8f5;              /* warm near-white */
    --surface: #ffffff;
    --ink: #21201c;
    --ink-2: #6b675f;
    --ink-3: #a39e94;
    --thread: #5b74e0;          /* warm blue thread */
    --thread-soft: #eceffc;
    --warm: #e8752e;
    --pass: #3d8b68; --block: #cf5a52;
    --line: #eee9e1;            /* hairline */
    --shadow: 0 1px 2px rgb(60 50 30 / 0.04), 0 8px 28px rgb(60 50 30 / 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1b1a17; --surface: #23221e;
      --ink: #f0eee9; --ink-2: #b3afa6; --ink-3: #7a766d;
      --thread: #8296ec; --thread-soft: #2a2f45;
      --warm: #f08644;
      --pass: #4caf87; --block: #e07a70;
      --line: #33312b;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.35);
    }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #side { background: color-mix(in srgb, #000 22%, #1b1a17); }
    :root:not([data-theme="light"]) .side-link:hover { background: color-mix(in srgb, #000 35%, #1b1a17); }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14.5px/1.6 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.005em;
  }
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 28px; position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 16.5px; letter-spacing: -0.01em; }
  .logo svg { display: block; }
  #search {
    margin-left: auto; width: 300px; padding: 8px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 13.5px;
    transition: border-color .15s, box-shadow .15s;
  }
  #search:focus { outline: none; border-color: color-mix(in srgb, var(--thread) 45%, var(--line)); box-shadow: 0 0 0 3px var(--thread-soft); }
  #search::placeholder { color: var(--ink-3); }
  #google-btn {
    border: 1px solid var(--line); background: var(--surface); font: inherit; font-weight: 500; font-size: 13px;
    padding: 7px 14px; border-radius: 10px; cursor: pointer; color: var(--ink-2);
    transition: border-color .15s, color .15s;
  }
  #google-btn:hover { border-color: var(--ink-3); color: var(--ink); }
  #rec {
    border: 0; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer;
    padding: 8px 17px; border-radius: 10px; color: #fff; background: var(--thread);
    box-shadow: 0 1px 2px rgb(50 60 140 / 0.25); transition: filter .15s;
  }
  #rec:hover { filter: brightness(1.07); }
  #rec.recording { background: var(--block); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.75; } }

  .shell { display: grid; grid-template-columns: 216px 1fr; min-height: calc(100vh - 61px); }
  #side {
    padding: 22px 14px; position: sticky; top: 61px; height: calc(100vh - 61px); overflow-y: auto;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, #ded7cb 26%, var(--bg));
  }
  .side-link:hover { background: color-mix(in srgb, #ded7cb 45%, var(--bg)); }
  .side-section { margin-bottom: 26px; }
  .side-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3);
    font-weight: 600; padding: 0 12px 8px; display: flex; align-items: center; justify-content: space-between;
  }
  .side-head button {
    border: 0; background: none; border-radius: 6px; width: 22px; height: 22px;
    font-weight: 600; font-size: 15px; cursor: pointer; line-height: 1; color: var(--ink-3);
  }
  .side-head button:hover { color: var(--thread); background: var(--thread-soft); }
  .side-link {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 12px; border-radius: 9px; cursor: pointer; transition: background .12s, color .12s;
  }
  .side-link:hover { color: var(--ink); background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
  .side-link.active { background: var(--thread-soft); color: var(--ink); font-weight: 600; }
  main { max-width: 1020px; margin: 0 auto; padding: 40px 36px 80px; width: 100%; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 6px; }
  .sub { color: var(--ink-2); font-size: 14px; margin-bottom: 30px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px 26px; margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-3);
    margin-bottom: 16px; font-weight: 600;
  }
  .stats { display: flex; gap: 44px; margin: 4px 0 34px; }
  .stat b { display: block; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .stat span { font-size: 12.5px; color: var(--ink-3); }
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; } .shell { grid-template-columns: 1fr; } #side { display: none; } }

  /* ── thread: a fine silk line, not a dash ── */
  .loose-rail { position: relative; padding-left: 26px; }
  .rail-svg, .weave-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
  .weave-svg { z-index: 1; }
  /* the checkbox is the eyelet: it sits above the thread so the thread
     disappears behind it mid-weave and re-emerges on the other side */
  .todo input { position: relative; z-index: 2; }
  .needle-flyer { position: absolute; z-index: 3; pointer-events: none; filter: drop-shadow(0 1px 1px rgb(40 40 60 / 0.2)); }
  .receipt::before {
    content: ""; display: inline-block; width: 14px; height: 1.5px; margin: 0 8px 0 0; vertical-align: 4px; border-radius: 2px;
    background: color-mix(in srgb, var(--thread) 50%, transparent);
  }
  .todo.done .receipt::before { background: var(--thread); }
  .stitch-connector { display: block; margin: -10px 0 -10px 56px; }
  #rail-needle {
    position: absolute; left: -12px; top: -6px; z-index: 3; pointer-events: none;
    transform: rotate(24deg); transform-origin: 60% 50%;
    filter: drop-shadow(0 1px 1px rgb(40 40 60 / 0.18));
    transition: opacity .2s;
  }
  .open-stitch { display: none; width: 18px; height: 1.5px; margin-left: 10px; vertical-align: 4px; border-radius: 2px;
    background: color-mix(in srgb, var(--thread) 50%, transparent); }
  .m-row:hover .open-stitch { display: inline-block; }

  .todo { display: flex; gap: 13px; padding: 13px 0; align-items: flex-start; }
  .todo + .todo { border-top: 1px solid var(--line); }
  /* the checkbox is a cloth eyelet: a round hole with a stitched rim */
  .todo input {
    appearance: none; -webkit-appearance: none; margin-top: 3px; width: 19px; height: 19px;
    border-radius: 50%; border: 2px solid var(--ink-3); background: transparent;
    cursor: pointer; flex: none; transition: border-color .2s;
    box-shadow: inset 0 1px 2.5px rgb(40 35 20 / 0.14);
  }
  .todo input { display: grid; place-content: center; }
  .todo input:checked { border-color: var(--thread); }
  .todo input:checked::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--thread); }
  .todo.done .t-task { text-decoration: line-through; color: var(--ink-3); }
  .t-task { font-weight: 570; font-size: 14.5px; }
  .t-meta { color: var(--ink-3); font-size: 12.5px; margin-top: 1px; }
  .receipt {
    font-size: 12.5px; color: var(--ink-2); margin-top: 7px; cursor: pointer;
    padding: 3px 0; border-radius: 6px; transition: color .12s;
  }
  .receipt:hover { color: var(--thread); }

  .pill {
    display: inline-block; font-size: 11.5px; font-weight: 550; padding: 2.5px 10px; border-radius: 99px;
    background: color-mix(in srgb, var(--line) 55%, transparent); color: var(--ink-2);
  }
  .pill.pass { background: color-mix(in srgb, var(--pass) 12%, transparent); color: var(--pass); }
  .pill.block { background: color-mix(in srgb, var(--block) 12%, transparent); color: var(--block); }

  .m-row { display: flex; gap: 16px; padding: 14px 0; cursor: pointer; align-items: baseline; }
  .m-row + .m-row { border-top: 1px solid var(--line); }
  .m-row:hover .m-title { color: var(--thread); }
  .m-title { font-weight: 570; font-size: 14.5px; transition: color .12s; }
  .m-date { color: var(--ink-3); font-size: 12.5px; min-width: 84px; font-variant-numeric: tabular-nums; }

  .utt { display: flex; gap: 14px; padding: 8px 0; }
  .utt.hl { background: var(--thread-soft); border-radius: 8px; padding: 8px 12px; margin: 0 -12px; }
  .utt .who { min-width: 72px; font-weight: 600; font-size: 12.5px; color: var(--ink-2); padding-top: 2px; }
  .utt .ts { color: var(--ink-3); font-size: 11.5px; min-width: 38px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .claim { padding: 10px 0; font-size: 14.5px; }
  .claim + .claim { border-top: 1px solid var(--line); }
  .backlink {
    display: inline-block; margin: 3px 8px 3px 0; padding: 5px 13px; border-radius: 9px;
    background: var(--thread-soft); color: var(--thread);
    cursor: pointer; font-size: 13px; font-weight: 550; transition: filter .12s;
  }
  .backlink:hover { filter: brightness(0.96); }

  #graph-wrap { position: relative; height: 560px; overflow: hidden; padding: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  .legend { display: flex; gap: 20px; align-items: center; padding: 14px 6px 0; font-size: 12.5px; color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; margin-right: 7px; vertical-align: -1px; }
  .legend .l-m::before { width: 10px; height: 10px; border-radius: 50%; background: var(--thread); }
  .legend .l-p::before { width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--ink-3); }
  .legend .l-t::before { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }

  .empty { color: var(--ink-3); text-align: center; padding: 44px 0; font-size: 13.5px; }
  .empty svg { display: none; }
  .exit-line { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; }
  b { font-weight: 600; }
  textarea.notes {
    width: 100%; min-height: 130px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea.notes:focus { border-color: color-mix(in srgb, var(--thread) 45%, var(--line)); box-shadow: 0 0 0 3px var(--thread-soft); }
  .draft { white-space: pre-wrap; font-size: 13.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 15px 17px; }
  .copybtn {
    border: 1px solid var(--line); background: var(--surface); font: inherit; font-weight: 500; font-size: 12.5px;
    padding: 5px 14px; border-radius: 9px; cursor: pointer; margin-top: 10px; color: var(--ink-2);
    transition: border-color .12s, color .12s;
  }
  .copybtn:hover { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); color: var(--thread); }
  .live-partial { color: var(--ink-3); font-style: italic; }
  .live-you .who { color: var(--thread); }
  .live-status { font-size: 11.5px; color: var(--ink-3); padding: 2px 0; font-family: ui-monospace, monospace; }

  .up-item { padding: 12px 0; }
  .up-item + .up-item { border-top: 1px solid var(--line); }
  .up-when { font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; color: var(--thread); text-transform: uppercase; }
  .prep {
    font-size: 12.5px; color: var(--ink-2); margin-top: 7px; position: relative;
    border-left: 1.5px solid color-mix(in srgb, var(--thread) 25%, transparent);
    padding: 3px 12px; border-radius: 0 6px 6px 0;
  }
  .prep.active { border-left-color: var(--thread); background: color-mix(in srgb, var(--thread) 4%, transparent); }
  .prep.active::before {
    content: ""; position: absolute; left: -5px; top: 11px; width: 9px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, #b9bec6, #e9ebee, #9aa1ad); transform: rotate(-36deg);
  }
  .prep b { display: block; font-weight: 600; color: var(--ink-2); }
  /* Structured summary document */
  .sum-sec { margin-top: 18px; }
  .sum-sec h3 { font-size: 14px; margin: 10px 0 4px; }
  .sum-sec h4 { font-size: 13px; margin: 8px 0 2px; color: var(--ink-2); }
  .sum-sec ul { margin: 4px 0 0 18px; padding: 0; }
  .sum-sec li { margin: 3px 0; }
  .sum-bullet[contenteditable="true"] { outline: 2px solid var(--thread-soft); border-radius: 4px; padding: 1px 4px; }
  .sum-bullet.edited::after { content: "edited"; font-size: 10px; color: var(--ink-3); margin-left: 6px; }
  .sum-bullet.ungrounded { opacity: .62; }
  .ts-chip {
    font-size: 10.5px; color: var(--thread); background: var(--thread-soft);
    border: none; border-radius: 6px; padding: 1px 6px; margin-left: 6px;
    cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .unverified { font-size: 10px; color: var(--block); background: color-mix(in srgb, var(--block) 10%, transparent);
    border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  /* Correction flow */
  #correct-fab {
    position: absolute; z-index: 30; padding: 5px 12px; font-size: 12.5px;
    background: var(--ink); color: var(--bg); border: none; border-radius: 8px;
    cursor: pointer; box-shadow: var(--shadow);
  }
  #correct-modal, .tl-modal {
    position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .35);
    display: flex; align-items: center; justify-content: center;
  }
  #correct-modal .box, .tl-modal .box {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
    max-width: 620px; width: 92%; max-height: 80vh; overflow-y: auto; padding: 22px 24px;
  }
  #correct-modal h2, .tl-modal h2 { margin-bottom: 10px; }
  #correct-modal .occ { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  #correct-modal .occ input { margin-top: 3px; }
  #correct-modal .grp { margin: 14px 0 4px; font-size: 12px; font-weight: 650; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
  #correct-modal .actions, .tl-modal .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .tl-modal input[type=text], .tl-modal textarea, .tl-modal select {
    width: 100%; font: inherit; font-size: 13.5px; padding: 8px 10px; margin: 4px 0 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .tl-modal label { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
  /* Suggestion chips: the model proposes, the user files. */
  .tag-chip.suggest { background: none; border-style: dashed; color: var(--ink-2); }
  .tag-chip.suggest button { font-weight: 700; }
  .tag-chip.suggest button[data-accept] { color: var(--pass); }
  .tag-chip.suggest button[data-dismiss] { color: var(--block); }
  /* Project workspace */
  .proj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .proj-grid .card { margin: 0; }
  .proj-desc { font-size: 14px; color: var(--ink-2); margin: 4px 0 14px; cursor: pointer; max-width: 720px; }
  .proj-desc:hover { color: var(--thread); }
  .doc-row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; cursor: pointer; }
  .doc-row + .doc-row { border-top: 1px solid var(--line); }
  .doc-row:hover .doc-title { color: var(--thread); }
  .doc-row .doc-title { font-weight: 600; font-size: 14px; }
  .claim.todo.done > div { text-decoration: line-through; color: var(--ink-3); }
  .add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .add-row input, .add-row select {
    font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .add-row input[name=task] { flex: 1; min-width: 160px; }
  #doc-editor {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 26px 30px; min-height: 380px;
    font-size: 14.5px; line-height: 1.65; outline: none;
  }
  #doc-editor:focus-within { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); }
  #doc-title {
    font: inherit; font-size: 24px; font-weight: 800; border: none; background: none;
    color: var(--ink); width: 100%; outline: none; margin-bottom: 8px;
  }
  /* Granola-style workspace: notes are the main frame */
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w, 400px); gap: 22px; align-items: start; }
  .workspace.collapsed { grid-template-columns: minmax(0, 1fr) 0px; gap: 0; }
  .workspace.collapsed #side-panel { display: none; }
  #panel-reopen {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 20;
    writing-mode: vertical-rl; padding: 14px 6px; font-size: 12px; font-weight: 650;
    background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); border-right: none;
    border-radius: 10px 0 0 10px; cursor: pointer; box-shadow: var(--shadow);
  }
  .panel-grip {
    position: absolute; left: -4px; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 5;
  }
  .panel-grip:hover, .panel-grip.dragging { background: linear-gradient(to right, transparent 3px, var(--thread) 3px, var(--thread) 5px, transparent 5px); opacity: .55; }
  .tag-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--thread-soft); color: var(--thread);
    border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600;
  }
  .tag-chip button { border: none; background: none; color: inherit; cursor: pointer; font-size: 13px; padding: 0; opacity: .7; }
  .tag-chip button:hover { opacity: 1; }
  .tag-add { border: 1px dashed var(--line); background: none; color: var(--ink-3); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .tag-add:hover { color: var(--thread); border-color: var(--thread); }
  #tag-menu {
    position: absolute; z-index: 35; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 180px;
  }
  #tag-menu button { display: block; width: 100%; text-align: left; border: none; background: none; font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--ink); }
  #tag-menu button:hover { background: var(--thread-soft); }
  #rec-inline { border: 1px solid var(--line); background: var(--surface); color: var(--block); font: inherit; font-size: 12.5px; font-weight: 650; border-radius: 10px; padding: 6px 14px; cursor: pointer; }
  #rec-inline:hover { border-color: var(--block); }
  .ws-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .ws-head .spacer { flex: 1; }
  #notes-doc {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 26px 30px; min-height: 320px;
    font-size: 14.5px; line-height: 1.65; outline: none;
  }
  #notes-doc:focus-within { border-color: color-mix(in srgb, var(--thread) 40%, var(--line)); }
  #notes-doc h1, #doc-editor h1 { font-size: 20px; margin: 14px 0 6px; }
  #notes-doc h2, #doc-editor h2 { font-size: 16px; margin: 14px 0 4px; }
  #notes-doc h3, #doc-editor h3 { font-size: 14px; margin: 10px 0 2px; color: var(--ink-2); }
  #notes-doc p, #doc-editor p { margin: 6px 0; }
  #notes-doc ul, #doc-editor ul { margin: 4px 0 4px 20px; padding: 0; }
  #notes-doc li, #doc-editor li { margin: 2px 0; }
  #notes-doc li.task, #doc-editor li.task { list-style: none; margin-left: -18px; }
  #notes-doc li.task input, #doc-editor li.task input { margin-right: 7px; accent-color: var(--thread); }
  #notes-doc { position: relative; }
  #notes-doc.is-empty::before {
    content: attr(data-ph);
    position: absolute; top: 26px; left: 30px; right: 30px;
    color: var(--ink-3); pointer-events: none;
  }
  #notes-doc.flash { animation: notes-flash 1.2s ease; }
  @keyframes notes-flash { 0% { background: var(--thread-soft); } 100% { background: var(--surface); } }
  /* Chat */
  #chat-log { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 8px; }
  .chat-b { max-width: 85%; padding: 8px 13px; border-radius: 12px; font-size: 13.5px; box-shadow: var(--shadow); }
  .chat-b.user { align-self: flex-end; background: var(--thread-soft); }
  .chat-b.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
  .chat-b.thinking { color: var(--ink-3); }
  #chat-bar {
    position: sticky; bottom: 14px; display: flex; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 8px 10px; margin-top: 10px;
  }
  #chat-input { flex: 1; border: none; background: none; font: inherit; font-size: 13.5px; color: var(--ink); outline: none; }
  /* Side panel */
  #side-panel {
    position: sticky; top: 76px; height: calc(100vh - 96px); overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .panel-tabs { display: flex; gap: 4px; padding: 10px 12px 0; position: sticky; top: 0; background: var(--surface); z-index: 2; border-bottom: 1px solid var(--line); }
  .panel-tab { border: none; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 6px 10px 9px; cursor: pointer; border-bottom: 2px solid transparent; }
  .panel-tab.active { color: var(--ink); border-bottom-color: var(--thread); }
  .panel-body { padding: 12px 16px 16px; }
  .panel-body .utt { font-size: 13px; }
  .utt .txt[contenteditable="true"] { outline: 2px solid var(--thread-soft); border-radius: 4px; padding: 1px 4px; }
  .utt .txt { cursor: text; }
  /* Toast */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px;
    font-size: 13px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center;
  }
  #toast button { border: none; background: none; color: var(--thread-soft); font: inherit; font-weight: 650; cursor: pointer; }
  /* Selection fix input */
  #fix-pop { position: absolute; z-index: 30; display: flex; gap: 6px; align-items: center;
    background: var(--ink); border-radius: 8px; padding: 5px 8px; box-shadow: var(--shadow); }
  #fix-pop span { color: var(--bg); font-size: 12px; }
  #fix-pop input { border: none; border-radius: 5px; font: inherit; font-size: 12.5px; padding: 2px 7px; width: 120px; outline: none; }
  .people-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .people-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; }
  .people-chip:hover { border-color: var(--thread); }
</style>
</head>
<body>
<header>
  <div class="logo">
    <!-- needle & thread: silver tapered needle, blue thread through the eye -->
    <svg width="32" height="32" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="tl-needle" x1="8" y1="30" x2="26" y2="6" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#b9bec6"/>
          <stop offset="0.45" stop-color="#eef0f3"/>
          <stop offset="1" stop-color="#9aa0a9"/>
        </linearGradient>
      </defs>
      <!-- thread: in from the left, through the eye, cursive loop on the right -->
      <path d="M2.5 6.5 C 6.5 3, 12 3.5, 15.5 5.8
               C 18.5 7.7, 21.5 9.5, 23.8 10.2
               C 27.5 11.2, 29.8 13.8, 29 17
               C 28.2 20.5, 24.4 21.2, 23.2 18.6
               C 22.2 16.4, 24.6 14.4, 27.6 15.2"
        stroke="#4a7ce8" stroke-width="1.7" stroke-linecap="round"/>
      <!-- needle: slim taper from rounded head to sharp point -->
      <path d="M6.6 31.6 L 23.2 9.4 A 1.55 1.55 0 1 1 25.6 11.4 Z"
        fill="url(#tl-needle)" stroke="#7c828b" stroke-width="0.6" stroke-linejoin="round"/>
      <!-- the eye -->
      <ellipse cx="24.4" cy="10.4" rx="0.6" ry="1.35" transform="rotate(-50 24.4 10.4)" fill="var(--bg)" stroke="#7c828b" stroke-width="0.45"/>
    </svg>
    Threadline
  </div>
  <input id="search" placeholder="Pull a thread… search every meeting">
  <button id="google-btn" title="Google Workspace">Connect Google</button>
  <button id="rec">● Record</button>
</header>
<div class="shell">
  <aside id="side">
    <div class="side-section">
      <button class="side-link active" data-view="today">⌂&nbsp; Home</button>
      <button class="side-link" data-view="meetings">🗎&nbsp; Meetings</button>
    </div>
    <div class="side-section">
      <div class="side-head">Projects <button id="add-project" title="New project">+</button></div>
      <div id="project-list"></div>
    </div>
    <div class="side-section">
      <button class="side-link" data-view="graph">✳&nbsp; Brain</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const main = $("#main");
const state = { view: "today", meetingId: null, highlight: null };
const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtTs = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (p) => fetch(p).then((r) => r.json());

const SPOOL_SVG = `<svg width="72" height="72" viewBox="0 0 72 72" fill="none">
  <rect x="22" y="14" width="28" height="44" rx="5" stroke="currentColor" stroke-width="3"/>
  <rect x="17" y="8" width="38" height="10" rx="5" stroke="currentColor" stroke-width="3"/>
  <rect x="17" y="54" width="38" height="10" rx="5" stroke="currentColor" stroke-width="3"/>
  <path d="M24 24h24M24 31h24M24 38h24M24 45h24" stroke="currentColor" stroke-width="2.4"/>
  <path d="M50 40 C 62 42, 58 56, 68 58" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5.4"/>
</svg>`;

document.querySelectorAll(".side-link").forEach((b) =>
  b.addEventListener("click", () => { state.view = b.dataset.view; state.meetingId = null; state.projectId = null; render(); }));

$("#google-btn").addEventListener("click", () =>
  alert("Google Workspace connection (Calendar, Drive, Gmail) is on the roadmap — it will fill Upcoming automatically.\n\nFor now, add upcoming meetings with the + in the Up next panel; prep works the same either way."));

$("#add-project").addEventListener("click", () => projectModal());

/** Create-project modal: name + what it's about. */
function projectModal(onCreated) {
  document.getElementById("project-modal")?.remove();
  const modal = document.createElement("div");
  modal.id = "project-modal";
  modal.className = "tl-modal";
  modal.innerHTML = `<div class="box">
    <h2>New project</h2>
    <label>Name</label>
    <input type="text" id="pm-name" placeholder="e.g. Frontend Revamp">
    <label>What's it about? <span style="font-weight:400">(helps file meetings automatically)</span></label>
    <textarea id="pm-desc" rows="3" placeholder="Goal, scope, who's involved…"></textarea>
    <div class="actions">
      <span style="flex:1"></span>
      <button class="copybtn" id="pm-cancel">Cancel</button>
      <button class="copybtn" id="pm-create" style="background:var(--ink);color:var(--bg)">Create</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
  modal.querySelector("#pm-cancel").addEventListener("click", () => modal.remove());
  const create = async () => {
    const name = modal.querySelector("#pm-name").value.trim();
    if (!name) return;
    const description = modal.querySelector("#pm-desc").value.trim();
    const proj = await fetch("/api/project", { method: "POST", body: JSON.stringify({ name, description }) }).then((r) => r.json());
    modal.remove();
    if (proj?.error || !proj?.id) return alert(proj?.error ?? "Could not create project");
    loadSidebar();
    onCreated?.(proj);
  };
  modal.querySelector("#pm-create").addEventListener("click", create);
  modal.querySelector("#pm-name").addEventListener("keydown", (e) => { if (e.key === "Enter") create(); });
  modal.querySelector("#pm-name").focus();
}

async function loadSidebar() {
  const projects = await api("/api/projects");
  $("#project-list").innerHTML = projects.map((p) => `
    <button class="side-link ${state.view === "project" && state.projectId === p.id ? "active" : ""}" data-project="${p.id}">
      ▸&nbsp; ${esc(p.name)} <span style="opacity:.55;font-size:12px">${p.n_open ? p.n_open + " open" : ""}</span>
    </button>`).join("") || `<div style="padding:0 10px;font-size:12.5px;color:var(--ink-3)">No projects yet — hit +</div>`;
  $("#project-list").querySelectorAll("[data-project]").forEach((b) =>
    b.addEventListener("click", () => { state.view = "project"; state.projectId = Number(b.dataset.project); state.meetingId = null; render(); }));
}

async function render() {
  document.querySelectorAll(".side-link[data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view && !state.meetingId));
  loadSidebar();
  if (state.meetingId) return renderMeeting(state.meetingId);
  if (state.view === "today") return renderToday();
  if (state.view === "meetings") return renderMeetings();
  if (state.view === "graph") return renderGraph();
  if (state.view === "project") return renderProject(state.projectId);
  if (state.view === "doc") return renderDoc(state.docId);
}

async function renderProject(id) {
  const { project, meetings, claims, people, speakers = [], docs = [], items = [], error } = await api(`/api/project?id=${id}`);
  if (error) { main.innerHTML = `<div class="empty">${esc(error)}</div>`; return; }
  const decisions = claims.filter((c) => c.kind === "decision");
  // Meeting-extracted + manual project items, one list: pending first.
  const actionRow = (c, manual) => `
    <div class="claim todo ${c.done ? "done" : ""}" style="display:flex;gap:10px;align-items:baseline">
      <input type="checkbox" ${c.done ? "checked" : ""} data-todo="${c.id}">
      <div style="flex:1">
        <b>${esc(manual ? (c.person_name ?? c.body.owner ?? "unassigned") : (c.body.owner ?? "unassigned"))}</b> — ${esc(c.body.task)}
        ${c.body.due ? ` <span class="pill">due ${esc(c.body.due)}</span>` : ""}
        ${manual && c.document_id ? ` <span class="pill" data-doc="${c.document_id}" style="cursor:pointer" title="Open the linked doc">🗎 ${esc(c.doc_title ?? "doc")}</span>` : ""}
        <span class="t-meta">· ${manual ? `project item <button data-del-item="${c.id}" title="Delete" style="border:none;background:none;color:var(--ink-3);cursor:pointer">✕</button>` : esc(c.meeting_title)}</span>
      </div>
    </div>`;
  const actions = [
    ...items.map((c) => ({ c, manual: true })),
    ...claims.filter((c) => c.kind === "action_item").map((c) => ({ c, manual: false })),
  ].sort((a, b) => (a.c.done ? 1 : 0) - (b.c.done ? 1 : 0));

  main.innerHTML = `
    <h1>${esc(project.name)}</h1>
    <div class="proj-desc" id="proj-desc" title="Click to edit">${project.description ? esc(project.description) : `<span style="color:var(--ink-3)">What's this project about? Click to add — it helps file meetings automatically.</span>`}</div>
    <div class="sub">${meetings.length} meeting${meetings.length === 1 ? "" : "s"} · ${docs.length} doc${docs.length === 1 ? "" : "s"} · ${actions.filter((a) => !a.c.done).length} open</div>
    <div class="proj-grid">
      <div class="card"><h2>People</h2>
        <div class="people-chips" id="proj-people">
          ${people.map((p) => `
            <span class="tag-chip">${esc(p.name)}${p.team ? ` <span style="opacity:.6">· ${esc(p.team)}</span>` : ""}${p.added_via === "meeting" ? ` <span style="opacity:.5" title="Added from a filed meeting">auto</span>` : ""}<button data-unperson="${p.id}" title="Remove from project">×</button></span>`).join("") || `<span class="t-meta">No one here yet.</span>`}
        </div>
        ${speakers.length ? `<div class="t-meta" style="margin-top:6px">Also heard: ${speakers.map((s) => esc(s.speaker)).join(", ")}</div>` : ""}
        <div class="add-row">
          <input type="text" id="add-person" list="people-list" placeholder="Add a person…" style="flex:1">
          <datalist id="people-list"></datalist>
          <input type="text" id="add-person-team" placeholder="Team (optional)" style="width:130px">
          <button class="copybtn" id="add-person-btn" style="margin:0">Add</button>
        </div>
      </div>
      <div class="card"><h2>Documents</h2>
        <div id="proj-docs">
          ${docs.map((d) => `
            <div class="doc-row" data-doc="${d.id}" data-kind="${d.kind}">
              <span>${d.kind === "note" ? "🗎" : "📎"}</span>
              <div style="flex:1"><div class="doc-title">${esc(d.title)}</div></div>
              <span class="t-meta">${fmtDate(d.updated_at)}</span>
            </div>`).join("") || `<div class="t-meta">No documents yet — upload context or write one.</div>`}
        </div>
        <div class="add-row">
          <button class="copybtn" id="doc-new" style="margin:0">+ New doc</button>
          <button class="copybtn" id="doc-upload" style="margin:0">↑ Upload</button>
          <input type="file" id="doc-file" accept=".pdf,.txt,.md" style="display:none">
        </div>
      </div>
    </div>
    ${decisions.length ? `<div class="card"><h2>Where this stands</h2>${decisions.slice(0, 4).map((d) => `<div class="claim">✓ ${esc(d.body.text)} <span class="t-meta">· ${esc(d.meeting_title)}</span></div>`).join("")}</div>` : ""}
    <div class="card"><h2>Action items</h2>
      ${actions.length ? actions.map(({ c, manual }) => actionRow(c, manual)).join("") : `<div class="t-meta">Nothing yet — file a meeting or add one below.</div>`}
      <div class="add-row" id="add-item-row">
        <input type="text" name="task" id="item-task" placeholder="Add an action item…">
        <select id="item-person"><option value="">Unassigned</option>${people.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
        <input type="text" id="item-due" placeholder="Due (optional)" style="width:110px">
        <select id="item-doc"><option value="">No doc</option><option value="new">＋ Create a doc for this</option>${docs.filter((d) => d.kind === "note").map((d) => `<option value="${d.id}">${esc(d.title)}</option>`).join("")}</select>
        <button class="copybtn" id="item-add" style="margin:0">Add</button>
      </div>
    </div>
    <div class="card"><h2>Meetings in this box</h2>
      ${meetings.length ? meetings.map((m) => `
        <div class="m-row" data-mid="${m.id}">
          <div class="m-date">${fmtDate(m.started_at)}</div>
          <div><div class="m-title">${esc(m.title)}</div><div class="t-meta">${esc(m.headline ?? "")}</div></div>
        </div>`).join("") : `<div class="empty">Nothing filed here yet — open a meeting and add it, or accept a suggestion on the meeting page.</div>`}
    </div>`;
  wireMeetingLinks();
  wireProject(id, project);
}

/** All the project page's interactions. Re-renders the page after each write. */
function wireProject(id, project) {
  const refresh = () => renderProject(id);

  // Editable description
  $("#proj-desc").addEventListener("click", () => {
    const cur = project.description ?? "";
    const box = document.createElement("textarea");
    box.rows = 3;
    box.value = cur;
    box.style.cssText = "width:100%;max-width:720px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)";
    $("#proj-desc").replaceWith(box);
    box.focus();
    box.addEventListener("blur", async () => {
      await fetch("/api/project/update", { method: "POST", body: JSON.stringify({ id, description: box.value }) });
      refresh();
    });
  });

  // People
  api("/api/people").then((all) => {
    $("#people-list").innerHTML = all.map((p) => `<option value="${esc(p.name)}">`).join("");
  });
  const addPerson = async () => {
    const name = $("#add-person").value.trim();
    if (!name) return;
    await fetch("/api/project/person", { method: "POST", body: JSON.stringify({ project_id: id, name, team: $("#add-person-team").value.trim() || undefined }) });
    refresh();
  };
  $("#add-person-btn").addEventListener("click", addPerson);
  $("#add-person").addEventListener("keydown", (e) => { if (e.key === "Enter") addPerson(); });
  main.querySelectorAll("[data-unperson]").forEach((b) =>
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      await fetch("/api/project/person", { method: "POST", body: JSON.stringify({ project_id: id, person_id: Number(b.dataset.unperson), remove: true }) });
      refresh();
    }));

  // Documents
  main.querySelectorAll(".doc-row[data-doc]").forEach((r) =>
    r.addEventListener("click", () => {
      if (r.dataset.kind === "note") { state.view = "doc"; state.docId = Number(r.dataset.doc); state.projectId = id; render(); }
      else window.open(`/api/doc/file?id=${r.dataset.doc}`, "_blank");
    }));
  $("#doc-new").addEventListener("click", async () => {
    const title = prompt("Doc title?", "");
    if (!title?.trim()) return;
    const doc = await fetch("/api/project/doc", { method: "POST", body: JSON.stringify({ project_id: id, title }) }).then((r) => r.json());
    if (doc?.error || !doc?.id) return alert(doc?.error ?? "Could not create doc");
    state.view = "doc"; state.docId = doc.id; state.projectId = id; render();
  });
  $("#doc-upload").addEventListener("click", () => $("#doc-file").click());
  $("#doc-file").addEventListener("change", async () => {
    const f = $("#doc-file").files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) return showToast("That file is over 10MB — too big for now.");
    const data_b64 = await new Promise((res) => {
      const rd = new FileReader();
      rd.onload = () => res(String(rd.result).split(",")[1]);
      rd.readAsDataURL(f);
    });
    const out = await fetch("/api/project/doc/upload", {
      method: "POST",
      body: JSON.stringify({ project_id: id, filename: f.name, mime: f.type || "application/octet-stream", data_b64 }),
    }).then((r) => r.json());
    if (out?.error) return alert(out.error);
    showToast(`"${f.name}" added to the project's context`);
    refresh();
  });

  // Action items
  main.querySelectorAll("[data-todo]").forEach((cb) =>
    cb.addEventListener("change", () => {
      fetch("/api/todo", { method: "POST", body: JSON.stringify({ id: Number(cb.dataset.todo), done: cb.checked }) });
      cb.closest(".claim").classList.toggle("done", cb.checked);
      loadSidebar();
    }));
  main.querySelectorAll("[data-del-item]").forEach((b) =>
    b.addEventListener("click", async () => {
      await fetch("/api/project/item/delete", { method: "POST", body: JSON.stringify({ id: Number(b.dataset.delItem) }) });
      refresh();
    }));
  main.querySelectorAll(".pill[data-doc]").forEach((p) =>
    p.addEventListener("click", () => { state.view = "doc"; state.docId = Number(p.dataset.doc); state.projectId = id; render(); }));
  const addItem = async () => {
    const task = $("#item-task").value.trim();
    if (!task) return;
    let document_id = $("#item-doc").value ? Number($("#item-doc").value) : undefined;
    // "Create a doc for this": the item's deliverable is a doc, born into the
    // project's context right away, titled after the task.
    if ($("#item-doc").value === "new") {
      const doc = await fetch("/api/project/doc", { method: "POST", body: JSON.stringify({ project_id: id, title: task }) }).then((r) => r.json());
      if (doc?.error || !doc?.id) return alert(doc?.error ?? "Could not create doc");
      document_id = doc.id;
    }
    const out = await fetch("/api/project/item", {
      method: "POST",
      body: JSON.stringify({
        project_id: id, task,
        person_id: $("#item-person").value ? Number($("#item-person").value) : undefined,
        due: $("#item-due").value.trim() || undefined,
        document_id,
      }),
    }).then((r) => r.json());
    if (out?.error) return alert(out.error);
    refresh();
  };
  $("#item-add").addEventListener("click", addItem);
  $("#item-task").addEventListener("keydown", (e) => { if (e.key === "Enter") addItem(); });
}

/** Project doc editor: same markdown editor as meeting notes, versioned saves. */
async function renderDoc(id) {
  const { doc, error } = await api(`/api/doc?id=${id}`);
  if (error) { main.innerHTML = `<div class="empty">${esc(error)}</div>`; return; }
  main.innerHTML = `
    <div class="sub" style="margin-bottom:10px"><a href="#" id="doc-back" style="color:var(--thread);text-decoration:none">⟨ Back to project</a></div>
    <input id="doc-title" value="${esc(doc.title)}">
    <div id="doc-editor" contenteditable="true" data-ph="Write here — this doc is part of the project's context."></div>
    <div class="t-meta" id="doc-status" style="margin-top:6px"></div>`;
  $("#doc-back").addEventListener("click", (e) => { e.preventDefault(); state.view = "project"; state.projectId = doc.project_id; render(); });
  const editor = $("#doc-editor");
  editor.innerHTML = doc.content ? mdToDom(doc.content) : "<p><br></p>";
  let saveTimer;
  const save = async () => {
    await fetch("/api/doc/save", { method: "POST", body: JSON.stringify({ id, markdown: domToMd(editor), title: $("#doc-title").value.trim() || undefined }) });
    $("#doc-status").textContent = "Saved";
    setTimeout(() => { $("#doc-status").textContent = ""; }, 1500);
  };
  const queueSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 800); };
  editor.addEventListener("input", queueSave);
  $("#doc-title").addEventListener("input", queueSave);
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}

async function renderToday() {
  const { todos, meetings, stats } = await api("/api/today");
  const open = todos.filter((t) => !t.done);
  const mins = Math.round((stats?.seconds ?? 0) / 60);
  main.innerHTML = `
    <h1>${greeting()}, Rachita</h1>
    <div class="sub">${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</div>
    <div class="stats">
      <div class="stat"><b>${stats?.meetings ?? 0}</b><span>meetings captured</span></div>
      <div class="stat"><b>${mins < 60 ? mins + "m" : Math.floor(mins / 60) + "h " + (mins % 60) + "m"}</b><span>listened</span></div>
      <div class="stat"><b>${stats?.open_actions ?? 0}</b><span>loose ends</span></div>
      <div class="stat"><b>${stats?.decisions ?? 0}</b><span>decisions</span></div>
    </div>
    <div class="home-grid">
      <div class="card"><h2>Up next · <button id="add-upcoming" style="border:0;background:none;font:inherit;font-weight:800;color:var(--thread);cursor:pointer">+ add</button></h2>
        <div id="upcoming-box"><div class="empty" style="padding:16px 0">Nothing scheduled. Connect Google (soon) or add one.</div></div>
      </div>
      <div class="card"><h2>Past meetings</h2>
        ${meetings.slice(0, 6).map((m) => `
          <div class="m-row" data-mid="${m.id}">
            <div class="m-date">${fmtDate(m.started_at)}</div>

        await needleRunTo(cb);

/**
 * Draw the resting rail as a flimsy thread: a slack curve that sways
 * gently left-right down the list, drawn to the container's real height.
 */
function drawRailThread() {
  const rail = document.getElementById("loose-rail");
  if (!rail) return;
  rail.querySelector(".rail-svg")?.remove();
  const h = rail.scrollHeight, x = 9;
  let d = `M ${x} 8`, y = 8, side = 1;
  while (y < h - 20) {
    const seg = Math.min(110, h - 20 - y);
    d += ` c ${6 * side} ${seg * 0.35}, ${-7 * side} ${seg * 0.65}, 0 ${seg}`;
    y += seg; side = -side;
  }
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "rail-svg");
  svg.setAttribute("width", 24); svg.setAttribute("height", h);
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", d);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", "var(--thread)");
  p.setAttribute("stroke-width", "1.3");
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("opacity", "0.35");
  svg.appendChild(p);
  rail.appendChild(svg);
}

/**
 * Completing a task: the needle leaves its rest, glides down the slack
 * thread, and weaves through the row — under, through the checkbox's
 * eyelet (the thread vanishes behind it and re-emerges), over, and out —
 * drawing a fresh thread behind itself the whole way.
 */
function needleRunTo(checkbox) {
  return new Promise((done) => {
    const rail = document.getElementById("loose-rail");
    const rest = document.getElementById("rail-needle");
    if (!rail || !checkbox) return done();
    const rb = rail.getBoundingClientRect(), cb = checkbox.getBoundingClientRect();
    const cx = cb.left - rb.left + cb.width / 2, cy = cb.top - rb.top + cb.height / 2;
    // one graceful slack sweep down the rail, then two wide soft arcs:
    // over, then under through the eyelet, then a gentle rising exit
    const x0 = Math.max(0, cx - 54);
    const d = `M 9 6
      C 24 ${cy * 0.25}, -6 ${cy * 0.55}, 8 ${cy * 0.8}
      S ${x0 - 14} ${cy + 12}, ${x0} ${cy + 7}
      c 12 -13, 26 -13, 36 -1
      c 8 9, 20 9, 28 0
      c 8 -9, 20 -9, 34 -6`;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "weave-svg");
    svg.setAttribute("data-claim", checkbox.dataset.id ?? "");
    svg.setAttribute("width", rail.clientWidth); svg.setAttribute("height", rail.scrollHeight);
    const p = document.createElementNS(ns, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "var(--thread)");
    p.setAttribute("stroke-width", "1.4");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("opacity", "0.75");
    svg.appendChild(p);
    rail.appendChild(svg);

    const L = p.getTotalLength();
    p.style.strokeDasharray = String(L);
    p.style.strokeDashoffset = String(L);

    const flyer = document.createElement("div");
    flyer.className = "needle-flyer";
    flyer.innerHTML = document.getElementById("rail-needle")?.innerHTML ?? "";
    flyer.style.offsetPath = `path('${d.replace(/\s+/g, " ")}')`;
    flyer.style.offsetRotate = "auto";
    flyer.style.offsetAnchor = "85% 50%";
    rail.appendChild(flyer);
    if (rest) rest.style.opacity = "0";

    const DUR = 1700, EASE = "cubic-bezier(.5,.06,.22,.99)";
    p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: DUR, easing: EASE, fill: "forwards" });
    const fa = flyer.animate(
      [{ offsetDistance: "0%", opacity: 1 }, { offsetDistance: "94%", opacity: 1, offset: 0.9 }, { offsetDistance: "100%", opacity: 0 }],
      { duration: DUR, easing: EASE, fill: "forwards" },
    );
    checkbox.animate(
      [{ transform: "scale(1)" }, { transform: "scale(1.1)" }, { transform: "scale(1)" }],
      { duration: 320, delay: DUR * 0.68, easing: "ease-in-out" },
    );
    fa.onfinish = () => {
      // the stitch stays — only the needle has left. Thread softens to rest.
      p.animate([{ opacity: 0.75 }, { opacity: 0.45 }], { duration: 900, fill: "forwards" });
      flyer.remove();
      if (rest) rest.style.opacity = "1";
      done();
    };
  });
}

function parseWhen(s) {
  const now = new Date();
  const t = s.trim().toLowerCase();
  const m = t.match(/(\d{1,2}):(\d{2})/);
  const d = new Date(now);
  if (t.includes("tomorrow")) d.setDate(d.getDate() + 1);
  if (m) d.setHours(Number(m[1]), Number(m[2]), 0, 0);
  else d.setHours(d.getHours() + 1, 0, 0, 0);
  if (d < now && !t.includes("tomorrow")) d.setDate(d.getDate() + 1);
  return d.getTime();
}

async function loadUpcoming() {
  const box = $("#upcoming-box");
  if (!box) return;
  const ups = await api("/api/upcoming");
  if (!ups.length) return;
  box.innerHTML = ups.map((u) => {
    const mins = Math.round((u.at_ms - Date.now()) / 60000);
    const when = mins < 60 ? `In ${mins} min` : new Date(u.at_ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    return `<div class="up-item" data-up="${u.id}" data-people="${esc(u.participants ?? "")}">
      <div class="up-when">${when}${new Date(u.at_ms).getDate() !== new Date().getDate() ? " · " + fmtDate(u.at_ms) : ""}</div>
      <div class="m-title">${esc(u.title)}</div>
      ${u.participants ? `<div class="t-meta">${esc(u.participants)}</div>` : ""}
      <div class="prep-slot"></div>
    </div>`;
  }).join("");
  // prep: what the brain knows about each meeting's people
  for (const el of box.querySelectorAll(".up-item")) {
    const people = el.dataset.people;
    if (!people) continue;
    const prep = await api(`/api/prep?people=${encodeURIComponent(people)}`);
    const slot = el.querySelector(".prep-slot");
    const bits = [];
    for (const o of prep.open.slice(0, 2))
      bits.push(`<div class="prep"><b>Still open — ${esc(o.body.owner)}</b>${esc(o.body.task)}${o.body.due ? ` (due ${esc(o.body.due)})` : ""}</div>`);
    for (const r of prep.recent.slice(0, 2))
      bits.push(`<div class="prep" data-mid="${r.id}" style="cursor:pointer"><b>Last time — ${esc(r.title)}</b>${fmtDate(r.started_at)}</div>`);
    slot.innerHTML = bits.join("") || "";
    // the needle sits on the active stitch; older context stays faint
    const first = slot.querySelector(".prep");
    if (first) first.classList.add("active");
    slot.querySelectorAll("[data-mid]").forEach((p) =>
      p.addEventListener("click", () => { state.meetingId = p.dataset.mid; render(); }));
  }
}

// ── Markdown ⇄ DOM for the notes editor ────────────────────────────────
function inlineMd(text) {
  return esc(text)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>");
}

function mdToDom(md) {
  const lines = String(md ?? "").split("\n");
  let html = "", depth = 0;
  const setDepth = (d) => {
    while (depth < d) { html += "<ul>"; depth++; }
    while (depth > d) { html += "</ul>"; depth--; }
  };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    const h = line.match(/^(#{1,3})\s+(.*)/);
    const task = line.match(/^(\s*)- \[( |x)\]\s+(.*)/);
    const bul = line.match(/^(\s*)-\s+(.*)/);
    if (h) { setDepth(0); html += `<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`; }
    else if (task) { setDepth(task[1].length >= 2 ? 2 : 1); html += `<li class="task"><input type="checkbox" ${task[2] === "x" ? "checked" : ""}>${inlineMd(task[3])}</li>`; }
    else if (bul) { setDepth(bul[1].length >= 2 ? 2 : 1); html += `<li>${inlineMd(bul[2])}</li>`; }
    else if (!line.trim()) setDepth(0);
    else { setDepth(0); html += `<p>${inlineMd(line)}</p>`; }
  }
  setDepth(0);
  return html;
}

function domToMd(root) {
  const inline = (node) => {
    let s = "";
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) s += n.textContent;
      else if (n.nodeName === "B" || n.nodeName === "STRONG") s += `**${inline(n)}**`;
      else if (n.nodeName === "I" || n.nodeName === "EM") s += `*${inline(n)}*`;
      else if (n.nodeName === "BR") s += "\n";
      else if (n.nodeName === "INPUT" || n.nodeName === "UL") { /* handled by list walker */ }
      else s += inline(n);
    });
    return s;
  };
  const blocks = [];
  const walkList = (ul, indent) => {
    const items = [];
    for (const li of ul.children) {
      if (li.nodeName !== "LI") continue;
      const box = li.querySelector(':scope > input[type="checkbox"]');
      const prefix = box ? `- [${box.checked ? "x" : " "}] ` : "- ";
      items.push(indent + prefix + inline(li).trim());
      for (const sub of li.children) if (sub.nodeName === "UL") items.push(walkList(sub, indent + "  "));
    }
    return items.join("\n");
  };
  for (const el of root.childNodes) {
    if (el.nodeType === 3) { if (el.textContent.trim()) blocks.push(el.textContent.trim()); continue; }
    const tag = el.nodeName;
    if (tag === "H1") blocks.push(`# ${inline(el).trim()}`);
    else if (tag === "H2") blocks.push(`## ${inline(el).trim()}`);
    else if (tag === "H3" || tag === "H4") blocks.push(`### ${inline(el).trim()}`);
    else if (tag === "UL") blocks.push(walkList(el, ""));
    else if (tag === "OL") blocks.push(walkList(el, ""));
    else {
      const text = inline(el).trim();
      if (text) blocks.push(text);
    }
  }
  return blocks.join("\n\n");
}

let toastTimer;

  document.getElementById("toast")?.remove();

}

/** Project tags on the meeting: add/remove, picked from the projects list.
 *  Pending suggestions render as dashed chips the user accepts or dismisses. */
function wireTags(meetingId, assigned, suggestions = []) {
  const row = $("#tag-row");
  if (!row) return;
  let tags = [...assigned];
  let pending = [...suggestions];

  const assign = async (projectId, remove) => {
    await fetch("/api/project/assign", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project_id: projectId, meeting_id: meetingId, remove: !!remove }),
    });
    loadSidebar();
  };

  const draw = () => {
    row.innerHTML =
      tags.map((p) => `
        <span class="tag-chip">🧵 ${esc(p.name)}<button data-untag="${p.id}" title="Remove this thread">×</button></span>`).join("") +
      pending.map((s) => `
        <span class="tag-chip suggest" title="${esc(s.reason ?? "")}${s.confidence != null ? ` (${Math.round(s.confidence * 100)}%)` : ""}">
          🧵 File in ${esc(s.name)}?
          <button data-accept="${s.id}" title="Yes, file it">✓</button>
          <button data-dismiss="${s.id}" title="No, not this project">✕</button>
        </span>`).join("") +
      `<button class="tag-add" id="tag-add">+ Add thread</button>`;
    row.querySelectorAll("[data-untag]").forEach((b) =>
      b.addEventListener("click", async () => {
        const pid = Number(b.dataset.untag);
        tags = tags.filter((t) => t.id !== pid);
        draw();
        await assign(pid, true);
      }));
    const resolve = async (sid, action) => {
      const s = pending.find((x) => x.id === sid);
      pending = pending.filter((x) => x.id !== sid);
      const out = await fetch("/api/suggestion/resolve", { method: "POST", body: JSON.stringify({ id: sid, action }) }).then((r) => r.json());
      if (out?.projects) tags = out.projects;
      draw();
      loadSidebar();
      if (action === "accept" && s) showToast(`Filed in ${s.name}`);
    };
    row.querySelectorAll("[data-accept]").forEach((b) =>
      b.addEventListener("click", () => resolve(Number(b.dataset.accept), "accept")));
    row.querySelectorAll("[data-dismiss]").forEach((b) =>
      b.addEventListener("click", () => resolve(Number(b.dataset.dismiss), "dismiss")));
    row.querySelector("#tag-add").addEventListener("click", openMenu);
  };

  async function openMenu() {
    document.getElementById("tag-menu")?.remove();
    const anchor = row.querySelector("#tag-add");
    const r = anchor.getBoundingClientRect(); // measure BEFORE any await
    const menu = document.createElement("div");
    menu.id = "tag-menu";
    menu.innerHTML = `<button disabled style="color:var(--ink-3);cursor:default">Loading…</button>`;
    menu.style.left = `${r.left + window.scrollX}px`;
    menu.style.top = `${r.bottom + window.scrollY + 4}px`;
    document.body.appendChild(menu);
    const close = (ev) => { if (!menu.contains(ev.target) && ev.target !== anchor) { menu.remove(); document.removeEventListener("mousedown", close); } };
    document.addEventListener("mousedown", close);

    const all = await api("/api/projects");
    menu.innerHTML =
      (all.length
        ? all.map((p) => {
            const on = tags.some((t) => t.id === p.id);
            return `<button data-pid="${p.id}" data-on="${on ? 1 : 0}">${on ? "✓ " : ""}${esc(p.name)}</button>`;
          }).join("")
        : `<button disabled style="color:var(--ink-3);cursor:default">No threads yet</button>`) +
      `<button data-new="1" style="border-top:1px solid var(--line);border-radius:0;margin-top:4px;padding-top:8px">＋ New thread…</button>`;

    menu.querySelectorAll("[data-pid]").forEach((b) =>
      b.addEventListener("click", async () => {
        menu.remove();
        const pid = Number(b.dataset.pid);
        const wasOn = b.dataset.on === "1";
        if (wasOn) tags = tags.filter((t) => t.id !== pid);
        else tags = [...tags, all.find((p) => p.id === pid)];
        draw();
        await assign(pid, wasOn);
      }));
    menu.querySelector("[data-new]").addEventListener("click", () => {
      menu.remove();
      projectModal(async (proj) => {
        tags = [...tags, proj];
        draw();
        await assign(proj.id, false);
      });
    });
  }

  draw();
}

/** Panel collapse/reopen + drag-to-resize, controls living on the panel itself. */
function wirePanelChrome(meetingId) {
  const ws = main.querySelector(".workspace");
  $("#panel-close")?.addEventListener("click", () => {
    panelState.open = false;
    localStorage.setItem("tl-panel", "closed");
    renderMeeting(meetingId, recording && state.meetingId === meetingId ? { live: true } : {});
  });
  document.getElementById("panel-reopen")?.addEventListener("click", () => {
    panelState.open = true;
    localStorage.setItem("tl-panel", "open");
    renderMeeting(meetingId, recording && state.meetingId === meetingId ? { live: true } : {});
  });
  const grip = $("#panel-grip");
  if (!grip) return;
  grip.addEventListener("mousedown", (e) => {
    e.preventDefault();
    grip.classList.add("dragging");
    const startX = e.clientX, startW = panelState.width;
    const move = (ev) => {
      panelState.width = Math.min(720, Math.max(280, startW + (startX - ev.clientX)));
      ws.style.setProperty("--panel-w", `${panelState.width}px`);
    };
    const up = () => {
      grip.classList.remove("dragging");
      localStorage.setItem("tl-panel-w", String(panelState.width));
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
}
