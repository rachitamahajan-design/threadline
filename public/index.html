<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadline</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafbfc; --surface: #ffffff;
    --ink: #1a1d24; --ink-2: #565b66; --ink-3: #9297a1;
    --thread: #5b7cfa;                 /* the one blue thread */
    --thread-weak: #dbe2fe;
    --silver: #c7ccd6; --silver-deep: #9aa1ad;
    --line: #e7e9ee;
    --pass: #2e7d5b; --block: #c94f4e;
    --shadow: 0 1px 2px rgb(20 24 40 / 0.05), 0 4px 16px rgb(20 24 40 / 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14161b; --surface: #1c1f26;
      --ink: #eceef2; --ink-2: #a6abb6; --ink-3: #6c717c;
      --thread: #7b96ff; --thread-weak: #2c3554;
      --silver: #4a5059; --silver-deep: #71777f;
      --line: #2a2e37;
      --pass: #4caf87; --block: #e06c6b;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 20px;
    padding: 13px 28px; position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  nav { display: flex; gap: 2px; }
  nav button {
    border: 0; background: none; color: var(--ink-2); font: inherit; font-weight: 500;
    padding: 6px 13px; border-radius: 8px; cursor: pointer; position: relative;
  }
  nav button:hover { color: var(--ink); }
  nav button.active { color: var(--ink); font-weight: 600; }
  nav button.active::after {
    content: ""; position: absolute; left: 13px; right: 13px; bottom: 0;
    height: 2px; border-radius: 2px; background: var(--thread);
  }
  #search {
    margin-left: auto; width: 300px; padding: 7px 13px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  #search:focus { outline: none; border-color: var(--thread); box-shadow: 0 0 0 3px var(--thread-weak); }
  #search::placeholder { color: var(--ink-3); }
  #rec {
    border: 0; font: inherit; font-weight: 600; cursor: pointer;
    padding: 8px 16px; border-radius: 9px; color: #fff; background: var(--thread);
    box-shadow: var(--shadow);
  }
  #rec:hover { filter: brightness(1.06); }
  #rec.recording { background: var(--block); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.75; } }

  main { max-width: 920px; margin: 0 auto; padding: 34px 28px 70px; }
  h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
  .sub { color: var(--ink-2); margin-bottom: 26px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; padding: 20px 24px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3);
    margin-bottom: 14px; font-weight: 600;
  }
  .stats { display: flex; gap: 38px; margin: 2px 0 28px; }
  .stat b { display: block; font-size: 23px; font-weight: 700; }
  .stat span { font-size: 13px; color: var(--ink-3); }

  /* ── the thread: a continuous line stitching listed items together ── */
  .threaded { position: relative; padding-left: 22px; }
  .threaded::before {
    content: ""; position: absolute; left: 5px; top: 14px; bottom: 14px;
    width: 2px; border-radius: 2px; background: var(--thread);
    opacity: 0.55;
  }
  .threaded > * { position: relative; }
  .threaded > *::before {
    content: ""; position: absolute; left: -21px; top: 18px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--thread);
  }

  .todo { display: flex; gap: 12px; padding: 11px 0; align-items: flex-start; }
  .todo + .todo { border-top: 1px solid var(--line); }
  .todo input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--thread); cursor: pointer; }
  .todo.done .t-task { text-decoration: line-through; color: var(--ink-3); }
  .todo.done::before { border-color: var(--silver); }
  .t-task { font-weight: 600; }
  /* an unfinished item's thread stops short */
  .t-task::after {
    content: ""; display: block; height: 2px; border-radius: 2px; margin-top: 5px;
    width: 34px; background: var(--thread); opacity: 0.7;
  }
  .todo.done .t-task::after { width: 100%; background: var(--silver); opacity: 0.5; }
  .t-meta { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .receipt {
    font-size: 13px; color: var(--ink-2); margin-top: 6px; cursor: pointer;
    border-left: 2px solid var(--thread); padding: 2px 10px;
    background: color-mix(in srgb, var(--thread) 5%, transparent);
    border-radius: 0 6px 6px 0;
  }
  .receipt:hover { background: color-mix(in srgb, var(--thread) 11%, transparent); }

  .pill {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
  }
  .pill.pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 35%, transparent); }
  .pill.block { color: var(--block); border-color: color-mix(in srgb, var(--block) 35%, transparent); }

  .m-row { display: flex; gap: 14px; padding: 13px 0; cursor: pointer; align-items: baseline; }
  .m-row + .m-row { border-top: 1px solid var(--line); }
  .m-row:hover .m-title { color: var(--thread); }
  .m-title { font-weight: 600; }
  .m-date { color: var(--ink-3); font-size: 13px; min-width: 86px; }

  .utt { display: flex; gap: 12px; padding: 7px 0; }
  .utt.hl { background: color-mix(in srgb, var(--thread) 9%, transparent); border-radius: 8px; padding: 7px 10px; margin: 0 -10px; }
  .utt .who { min-width: 72px; font-weight: 600; font-size: 13px; color: var(--ink-2); padding-top: 2px; }
  .utt .ts { color: var(--ink-3); font-size: 12px; min-width: 40px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .claim { padding: 9px 0; }
  .claim + .claim { border-top: 1px solid var(--line); }
  /* faint thread running through the margin of extracted content */
  .card.threadmark { border-left: 3px solid var(--thread-weak); }
  .backlink {
    display: inline-block; margin: 3px 8px 3px 0; padding: 4px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--thread);
    cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .backlink:hover { border-color: var(--thread); }

  #graph-wrap { position: relative; height: 560px; overflow: hidden; padding: 0; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  .legend { display: flex; gap: 18px; align-items: center; padding: 12px 4px 0; font-size: 13px; color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; margin-right: 7px; vertical-align: -1px; }
  .legend .l-m::before { width: 11px; height: 11px; border-radius: 50%; background: var(--thread); }
  .legend .l-p::before { width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--silver-deep); }
  .legend .l-t::before { width: 7px; height: 7px; border-radius: 50%; background: var(--silver-deep); }

  .empty { color: var(--ink-3); text-align: center; padding: 44px 0; }
  /* two-column Today */
  .cols { display: grid; grid-template-columns: 1fr 264px; gap: 40px; align-items: start; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .rail h2, .section h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3);
    margin: 26px 0 12px; font-weight: 600;
  }
  .rail h2:first-child, .section > h2:first-child { margin-top: 0; }
  .attn { padding: 12px 0; cursor: pointer; }
  .attn + .attn { border-top: 1px solid var(--line); }
  .attn h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .attn:hover h3 { color: var(--thread); }
  .rail-item { padding: 8px 0; font-size: 13.5px; color: var(--ink-2); }
  .rail-item b { display: block; font-size: 14px; }
  .memo { border-left: 2px solid var(--thread); padding: 2px 0 2px 14px; margin: 8px 0; }
  .memo .q { font-style: italic; color: var(--ink-2); }
  /* meeting page as one document */
  .doc { max-width: 680px; }
  .doc h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; margin: 30px 0 10px; }
  .doc .flow { border-left: 2px solid var(--thread-weak); padding-left: 18px; }
  .timer { font-variant-numeric: tabular-nums; color: var(--block); font-weight: 600; }
  details.debug { margin-top: 20px; }
  details.debug summary { color: var(--ink-3); font-size: 12px; cursor: pointer; }
  .exit-line { font-size: 13px; color: var(--ink-2); margin-top: 12px; }
  b { color: var(--ink); font-weight: 600; }
  textarea.notes {
    width: 100%; min-height: 120px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; outline: none;
  }
  textarea.notes:focus { border-color: var(--thread); box-shadow: 0 0 0 3px var(--thread-weak); }
  .draft { white-space: pre-wrap; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .copybtn {
    border: 1px solid var(--line); background: var(--surface); font: inherit; font-weight: 500; font-size: 13px;
    padding: 5px 14px; border-radius: 8px; cursor: pointer; margin-top: 10px; color: var(--ink-2);
  }
  .copybtn:hover { border-color: var(--thread); color: var(--thread); }
  .live-partial { color: var(--ink-3); font-style: italic; }
  .live-you .who { color: var(--thread); }
  .live-status { font-size: 12px; color: var(--ink-3); padding: 2px 0; font-family: ui-monospace, monospace; }
  .live-marker { display: inline-block; vertical-align: -3px; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <!-- silver needle, blue thread -->
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="needle" x1="6" y1="24" x2="24" y2="6" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8d939e"/><stop offset="0.5" stop-color="#e6e9ee"/><stop offset="1" stop-color="#9aa1ad"/>
        </linearGradient>
      </defs>
      <path d="M2 24 C 7 27, 10 21, 14 23 S 22 27, 27 22" stroke="var(--thread)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M6.5 22.5 L 23 5.5" stroke="url(#needle)" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="21.6" cy="7" rx="1.7" ry="3" transform="rotate(45 21.6 7)" stroke="url(#needle)" stroke-width="1.6" fill="none"/>
      <path d="M2 24 C 4 25.5, 6 24.5, 6.5 22.7" stroke="var(--thread)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </svg>
    Threadline
  </div>
  <nav>
    <button data-view="today" class="active">Today</button>
    <button data-view="meetings">Meetings</button>
    <button data-view="graph">Brain</button>
  </nav>
  <input id="search" placeholder="Search everything you've discussed">
  <button id="rec">● Record</button>
</header>
<main id="main"></main>

<script>
const $ = (s) => document.querySelector(s);
const main = $("#main");
const state = { view: "today", meetingId: null, highlight: null };
const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtTs = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (p) => fetch(p).then((r) => r.json());

// silver needle "you are here" marker (used at the live/current point only)
const NEEDLE = `<svg class="live-marker" width="17" height="17" viewBox="0 0 30 30" fill="none">
  <path d="M6.5 22.5 L 23 5.5" stroke="#9aa1ad" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="21.6" cy="7" rx="1.7" ry="3" transform="rotate(45 21.6 7)" stroke="#9aa1ad" stroke-width="1.6" fill="none"/>
</svg>`;

document.querySelectorAll("nav button").forEach((b) =>
  b.addEventListener("click", () => { state.view = b.dataset.view; state.meetingId = null; render(); }));

async function render() {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === state.view && !state.meetingId));
  if (state.meetingId) return renderMeeting(state.meetingId);
  if (state.view === "today") return renderToday();
  if (state.view === "meetings") return renderMeetings();
  if (state.view === "graph") return renderGraph();
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}

async function renderToday() {
  const { todos, meetings, stats } = await api("/api/today");
  const open = todos.filter((t) => !t.done);
  const mins = Math.round((stats?.seconds ?? 0) / 60);
  main.innerHTML = `
    <h1>${greeting()}, Rachita</h1>
    <div class="sub">${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</div>
    <div class="stats">
      <div class="stat"><b>${stats?.meetings ?? 0}</b><span>meetings</span></div>
      <div class="stat"><b>${mins < 60 ? mins + "m" : Math.floor(mins / 60) + "h " + (mins % 60) + "m"}</b><span>captured</span></div>
      <div class="stat"><b>${stats?.open_actions ?? 0}</b><span>loose ends</span></div>
      <div class="stat"><b>${stats?.decisions ?? 0}</b><span>decisions</span></div>
    </div>
    <div class="cols">
      <div class="section">
        <h2>What needs your attention</h2>
        ${open.length ? `<div class="threaded">` + open.slice(0, 5).map((t) => `
          <div class="attn" data-mid="${t.meeting_id}" data-q="${esc(t.body.task)}">
            <h3>${esc(t.body.task)}</h3>
            <div class="t-meta">${esc(t.meeting_title)} · ${fmtDate(t.started_at)}</div>
            <div class="t-meta">${t.body.owner ? `Assigned to ${esc(t.body.owner)}` : "Unassigned"}${t.body.due ? ` · due ${esc(t.body.due)}` : ""}</div>
          </div>`).join("") + `</div>` : `<div class="empty">All clear. Run <code>npm run demo</code> or hit ● Record.</div>`}

        <h2>Loose ends</h2>
        ${todos.length ? todos.map((t) => `
          <div class="todo ${t.done ? "done" : ""}">
            <input type="checkbox" ${t.done ? "checked" : ""} data-id="${t.id}">
            <div style="flex:1">
              <div class="t-task">${esc(t.body.task)}</div>
              <div class="receipt" data-mid="${t.meeting_id}" data-q="${esc(t.body.task)}">"${esc(t.quote ?? t.body.task)}" — ${esc(t.meeting_title)}</div>
            </div>
          </div>`).join("") : ""}

        <h2>Recent meetings</h2>
        ${meetings.map(meetingRow).join("")}
      </div>
      <div class="rail">${railHtml(todos, meetings)}</div>
    </div>`;
  main.querySelectorAll(".todo input").forEach((cb) =>
    cb.addEventListener("change", async () => {
      await fetch("/api/todo", { method: "POST", body: JSON.stringify({ id: Number(cb.dataset.id), done: cb.checked }) });
      render();
    }));
  wireMeetingLinks();
}

/** Right rail: pre-meeting memory for the person you owe/are owed the most. */
function railHtml(todos, meetings) {
  const open = todos.filter((t) => !t.done && t.body.owner);
  const byPerson = {};
  for (const t of open) (byPerson[t.body.owner] ??= []).push(t);
  const top = Object.entries(byPerson).sort((a, b) => b[1].length - a[1].length)[0];
  let memory = "";
  if (top) {
    const [person, items] = top;
    const lastMeeting = meetings.find((m) => (m.participants ?? "").includes(person));
    memory = `
      <h2>Before you next talk to ${esc(person)}</h2>
      ${lastMeeting ? `<div class="rail-item">Last spoke — <b>${esc(lastMeeting.title)}</b>${fmtDate(lastMeeting.started_at)}</div>` : ""}
      <div class="rail-item">Still open:</div>
      ${items.slice(0, 3).map((t) => `<div class="memo"><b style="font-size:13.5px">${esc(t.body.task)}</b>${t.body.due ? `<span class="t-meta"> due ${esc(t.body.due)}</span>` : ""}</div>`).join("")}
      ${items[0]?.quote ? `<div class="memo q">"${esc(items[0].quote)}"</div>` : ""}`;
  }
  return `${memory}
    <h2>Pick up where you left off</h2>
    ${meetings.slice(0, 3).map((m) => `<div class="rail-item" style="cursor:pointer" data-mid="${m.id}"><b>${esc(m.title)}</b>${fmtDate(m.started_at)}${m.n_actions ? ` · ${m.n_actions} open` : ""}</div>`).join("")}`;
}

function meetingRow(m) {
  const bits = [];
  if (m.n_decisions) bits.push(`${m.n_decisions} decision${m.n_decisions === 1 ? "" : "s"}`);
  if (m.n_actions) bits.push(`${m.n_actions} action${m.n_actions === 1 ? "" : "s"}`);
  const people = (m.participants ?? "").split(",").filter(Boolean).join(" · ");
  return `
    <div class="m-row" data-mid="${m.id}">
      <div class="m-date">${fmtDate(m.started_at)}</div>
      <div>
        <div class="m-title">${esc(m.title)}</div>
        <div class="t-meta">${esc(m.headline ?? "")}</div>
        <div class="t-meta">${bits.length ? `<b>${bits.join(" · ")}</b>` : ""}${bits.length && people ? " — " : ""}${esc(people)}</div>
      </div>
      <span class="t-meta" style="margin-left:auto">${m.duration_s ? Math.max(1, Math.round(m.duration_s / 60)) + " min" : ""}</span>
    </div>`;
}

async function renderMeetings() {
  const ms = await api("/api/meetings");
  main.innerHTML = `<h1>Meetings</h1><div class="sub">Everything stays on this laptop.</div>
    <div class="card">${ms.length ? ms.map(meetingRow).join("") : `<div class="empty">Nothing here yet.</div>`}</div>`;
  wireMeetingLinks();
}

async function renderMeeting(id) {
  const { meeting, utterances, claims, runs, backlinks } = await api(`/api/meeting?id=${encodeURIComponent(id)}`);
  const byKind = (k) => claims.filter((c) => c.kind === k && c.gate === "passed");
  const blocked = claims.filter((c) => c.gate === "blocked");
  const hl = state.highlight;
  const people = [...new Set(utterances.map((u) => u.speaker).filter(Boolean))];
  main.innerHTML = `
    <div class="doc">
    <h1>${esc(meeting.title)}</h1>
    <div class="sub">${fmtDate(meeting.started_at)} · ${Math.max(1, Math.round(meeting.duration_s / 60))} min${people.length ? ` · ${people.map(esc).join(" · ")}` : ""}</div>
    ${meeting.summary ? `<h2>Summary</h2><p>${esc(meeting.summary)}</p>` : ""}
    <div class="flow">
    ${byKind("decision").length ? `<h2>Decisions</h2>${byKind("decision").map((c, i) => `
      <div class="claim">${esc(c.body.text)}
        <button class="copybtn" style="margin:0 0 0 8px;padding:1px 10px" data-share-decision="${i}">Share</button>
      </div>`).join("")}` : ""}
    ${byKind("action_item").length ? `<h2>Action items</h2>${byKind("action_item").map((c) => `
      <div class="claim"><b>${esc(c.body.owner ?? "?")}</b> — ${esc(c.body.task)}${c.body.due ? ` <span class="pill">due ${esc(c.body.due)}</span>` : ""}</div>`).join("")}` : ""}
    ${byKind("risk").length ? `<h2>Risks</h2>${byKind("risk").map((c) => `
      <div class="claim">${esc(c.body.category)} · <span class="t-meta">"${esc(c.body.quote)}"</span></div>`).join("")}` : ""}
    </div>
    <h2>My notes</h2>
    <textarea class="notes" id="my-notes" placeholder="Type anything — your words live alongside the generated notes.">${esc(meeting.my_notes ?? "")}</textarea>
    ${followUpCard(meeting, claims)}
    ${backlinks.length ? `<h2>Related</h2>${backlinks.map((b) => `
      <span class="backlink" data-mid="${b.id}">${esc(b.title)} <span style="opacity:.6">· ${esc(b.via)}</span></span>`).join("")}` : ""}
    <h2>Transcript</h2>
      ${utterances.map((u) => `
        <div class="utt ${hl && u.text.toLowerCase().includes(hl.toLowerCase().slice(0, 24)) ? "hl" : ""}">
          <div class="ts">${fmtTs(u.offset_s)}</div>
          <div class="who">${esc(u.speaker ?? u.speaker_role)}</div>
          <div>${esc(u.text)}</div>
        </div>`).join("")}
    <details class="debug"><summary>Diagnostics</summary>
      <div class="exit-line">Run exit: ${esc(meeting.exit ?? "?")} ·
      ${claims.filter((c) => c.gate === "passed").length} claims passed ·
      ${blocked.length} blocked by gates${blocked.length ? ` (${blocked.map((b) => esc(b.gate_reason)).join("; ")})` : ""}</div>
    </details>
    </div>`;
  state.highlight = null;
  wireMeetingLinks();
  wireNotesAutosave(id);
  const decisions = byKind("decision");
  main.querySelectorAll("[data-share-decision]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const d = decisions[Number(btn.dataset.shareDecision)];
      shareDecisionCard(d.body.text, meeting, people);
    }));
}

function followUpCard(meeting, claims) {
  const actions = claims.filter((c) => c.kind === "action_item" && c.gate === "passed");
  const decisions = claims.filter((c) => c.kind === "decision" && c.gate === "passed");
  if (!actions.length && !decisions.length) return "";
  const lines = [
    `Hi all,`,
    ``,
    `Quick recap of "${meeting.title}":`,
    ``,
    ...(decisions.length ? ["What we decided:", ...decisions.map((d) => `• ${d.body.text}`), ""] : []),
    ...(actions.length ? ["Next steps:", ...actions.map((a) => `• ${a.body.owner ?? "TBD"}: ${a.body.task}${a.body.due ? ` (${a.body.due})` : ""}`), ""] : []),
    `Full notes attached. Shout if I missed anything.`,
  ];
  const draft = lines.join("\n");
  return `<h2>Follow-up draft</h2>
    <div class="draft" id="draft-text">${esc(draft)}</div>
    <button class="copybtn" onclick="navigator.clipboard.writeText(document.getElementById('draft-text').textContent).then(()=>{this.textContent='Copied ✓';setTimeout(()=>this.textContent='Copy draft',1500)})">Copy draft</button>`;
}

/** A decision becomes a clean 1200x630 share card. Rendered locally. */
function shareDecisionCard(text, meeting, people) {
  const W = 1200, H = 630, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
  x.strokeStyle = "#e7e9ee"; x.lineWidth = 2; x.strokeRect(1, 1, W - 2, H - 2);
  // one blue thread across the top
  x.strokeStyle = "#5b7cfa"; x.lineWidth = 3; x.lineCap = "round";
  x.beginPath(); x.moveTo(70, 96); x.bezierCurveTo(W * 0.35, 118, W * 0.65, 78, W - 70, 100); x.stroke();
  x.fillStyle = "#9297a1"; x.font = "600 24px -apple-system, system-ui";
  x.fillText("DECISION", 70, 64);
  x.fillStyle = "#1a1d24"; x.font = "700 50px -apple-system, system-ui";
  const words = text.split(" ");
  let line = "", y = 210;
  for (const w of words) {
    if (x.measureText(line + " " + w).width > W - 160) { x.fillText(line, 70, y); y += 64; line = w; }
    else line = line ? line + " " + w : w;
  }
  x.fillText(line, 70, y);
  x.fillStyle = "#565b66"; x.font = "500 28px -apple-system, system-ui";
  x.fillText(`${meeting.title} · ${fmtDate(meeting.started_at)}`, 70, H - 140);
  if (people.length) x.fillText(people.join(" · "), 70, H - 100);
  x.strokeStyle = "#5b7cfa"; x.lineWidth = 2.5;
  x.beginPath(); x.moveTo(70, H - 58); x.lineTo(200, H - 58); x.stroke();
  x.fillStyle = "#9297a1"; x.font = "600 23px -apple-system, system-ui";
  x.fillText("🪡 Threadline", 214, H - 50);
  const a = document.createElement("a");
  a.download = "threadline-decision.png";
  a.href = c.toDataURL("image/png");
  a.click();
}

function wireNotesAutosave(meetingId) {
  const ta = $("#my-notes");
  if (!ta) return;
  let t;
  ta.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => fetch("/api/notes", { method: "POST", body: JSON.stringify({ id: meetingId, notes: ta.value }) }), 600);
  });
}

function wireMeetingLinks() {
  main.querySelectorAll("[data-mid]").forEach((el) =>
    el.addEventListener("click", () => {
      state.meetingId = el.dataset.mid;
      if (el.dataset.q) state.highlight = el.dataset.q;
      render();
      window.scrollTo(0, 0);
    }));
}

async function renderGraph() {
  const { nodes, edges } = await api("/api/graph");
  main.innerHTML = `<h1>Brain</h1>
    <div class="sub">${nodes.length} points · ${edges.length} threads. Drag to explore; click a meeting to open it.</div>
    <div class="card" id="graph-wrap"><canvas id="graph"></canvas></div>
    <div class="legend"><span class="l-m">Meeting</span><span class="l-p">Person</span><span class="l-t">Topic</span>
      <button class="copybtn" style="margin:0 0 0 auto" id="export-graph">Export image</button></div>`;
  const canvas = $("#graph"), wrap = $("#graph-wrap");
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const THREAD = css.getPropertyValue("--thread").trim();
  const INK = css.getPropertyValue("--ink").trim(), INK3 = css.getPropertyValue("--ink-3").trim();
  const SILVER = css.getPropertyValue("--silver-deep").trim(), SURFACE = css.getPropertyValue("--surface").trim();

  const ns = nodes.map((n, i) => ({
    ...n, label: n.meeting_title ?? n.label,
    x: W / 2 + 180 * Math.cos((i / nodes.length) * 2 * Math.PI),
    y: H / 2 + 180 * Math.sin((i / nodes.length) * 2 * Math.PI),
    vx: 0, vy: 0, r: n.kind === "meeting" ? 17 : n.kind === "person" ? 11 : 6,
  }));
  const byId = Object.fromEntries(ns.map((n) => [n.id, n]));
  const es = edges.filter((e) => byId[e.src] && byId[e.dst]);
  let drag = null, focus = null;

  function tick() {
    for (const a of ns) {
      for (const b of ns) {
        if (a === b) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = Math.max(dx * dx + dy * dy, 40);
        const f = 2600 / d2;
        a.vx += (dx / Math.sqrt(d2)) * f; a.vy += (dy / Math.sqrt(d2)) * f;
      }
      a.vx += (W / 2 - a.x) * 0.004; a.vy += (H / 2 - a.y) * 0.004;
    }
    for (const e of es) {
      const a = byId[e.src], b = byId[e.dst];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.max(Math.hypot(dx, dy), 1);
      const f = (d - 110) * 0.012;
      a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    }
    for (const n of ns) {
      if (n === drag) continue;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x = Math.max(n.r + 4, Math.min(W - n.r - 4, n.x + n.vx));
      n.y = Math.max(n.r + 4, Math.min(H - n.r - 4, n.y + n.vy));
    }
  }

  const connected = (n) => {
    if (!focus) return true;
    if (n === focus) return true;
    return es.some((e) => (byId[e.src] === focus && byId[e.dst] === n) || (byId[e.dst] === focus && byId[e.src] === n));
  };

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // blue thread connections, gentle sag
    ctx.lineWidth = 1.6; ctx.lineCap = "round";
    for (const e of es) {
      const a = byId[e.src], b = byId[e.dst];
      const dim = focus && !(a === focus || b === focus);
      ctx.strokeStyle = THREAD;
      ctx.globalAlpha = dim ? 0.10 : 0.55;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + Math.min(30, Math.hypot(b.x - a.x, b.y - a.y) * 0.10);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const n of ns) {
      const dim = !connected(n);
      ctx.globalAlpha = dim ? 0.18 : 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI);
      if (n.kind === "meeting") { ctx.fillStyle = THREAD; ctx.fill(); }
      else if (n.kind === "person") { ctx.fillStyle = SURFACE; ctx.fill(); ctx.strokeStyle = SILVER; ctx.lineWidth = 2; ctx.stroke(); }
      else { ctx.fillStyle = SILVER; ctx.fill(); }
      if ((n.kind === "meeting" || n.kind === "person") && !dim) {
        ctx.fillStyle = INK; ctx.font = "600 12px -apple-system, system-ui"; ctx.textAlign = "center";
        const label = n.label.length > 22 ? n.label.slice(0, 21) + "…" : n.label;
        ctx.fillText(label, n.x, n.y + n.r + 15);
      }
    }
    ctx.globalAlpha = 1;
  }

  let frames = 0;
  (function loop() { tick(); draw(); if (++frames < 600 || drag) requestAnimationFrame(loop); else drawLabelsFinal(); })();
  function drawLabelsFinal() {
    draw();
    ctx.fillStyle = INK3; ctx.font = "500 11px -apple-system, system-ui"; ctx.textAlign = "center";
    for (const n of ns) if (n.kind === "topic" && connected(n)) ctx.fillText(n.label.length > 18 ? n.label.slice(0, 17) + "…" : n.label, n.x, n.y + n.r + 13);
  }

  const hit = (mx, my) => ns.find((n) => Math.hypot(n.x - mx, n.y - my) <= n.r + 5);
  canvas.addEventListener("mousedown", (ev) => {
    const r = canvas.getBoundingClientRect();
    drag = hit(ev.clientX - r.left, ev.clientY - r.top) ?? null;
    if (drag) requestAnimationFrame(function dl() { tick(); draw(); if (drag) requestAnimationFrame(dl); });
  });
  canvas.addEventListener("mousemove", (ev) => {
    const r = canvas.getBoundingClientRect();
    if (drag) { drag.x = ev.clientX - r.left; drag.y = ev.clientY - r.top; }
    else canvas.style.cursor = hit(ev.clientX - r.left, ev.clientY - r.top) ? "pointer" : "grab";
  });
  window.addEventListener("mouseup", () => { drag = null; });
  let downAt = 0;
  canvas.addEventListener("mousedown", () => { downAt = Date.now(); });
  canvas.addEventListener("click", (ev) => {
    const r = canvas.getBoundingClientRect();
    const n = hit(ev.clientX - r.left, ev.clientY - r.top);
    if (Date.now() - downAt > 250) return; // was a drag
    if (n?.kind === "meeting" && focus === n) { state.meetingId = n.id; render(); return; }
    focus = n ?? null; // click focuses; unrelated fades. click again to open.
    drawLabelsFinal();
  });

  $("#export-graph").addEventListener("click", () => {
    const pad = 84, W2 = W + 40, H2 = H + pad + 60;
    const out = document.createElement("canvas");
    out.width = W2 * dpr; out.height = H2 * dpr;
    const o = out.getContext("2d");
    o.scale(dpr, dpr);
    o.fillStyle = "#ffffff"; o.fillRect(0, 0, W2, H2);
    o.strokeStyle = "#e7e9ee"; o.lineWidth = 2; o.strokeRect(1, 1, W2 - 2, H2 - 2);
    o.fillStyle = "#1a1d24"; o.font = "700 28px -apple-system, system-ui";
    o.fillText("My meeting brain", 30, 48);
    o.fillStyle = "#9297a1"; o.font = "500 15px -apple-system, system-ui";
    o.fillText(`${ns.filter((n) => n.kind === "meeting").length} meetings · ${ns.filter((n) => n.kind === "person").length} people · ${ns.filter((n) => n.kind === "topic").length} topics · 🪡 Threadline`, 30, 72);
    o.drawImage(canvas, 0, 0, canvas.width, canvas.height, 20, pad, W, H);
    const a = document.createElement("a");
    a.download = "threadline-brain.png";
    a.href = out.toDataURL("image/png");
    a.click();
  });
}

// ── Live recording ──────────────────────────────────────────────────────
const recBtn = $("#rec");
let recording = false, evtSource = null;

recBtn.addEventListener("click", async () => {
  if (!recording) {
    const title = prompt("Meeting title?", "Untitled meeting");
    if (title === null) return;
    const r = await fetch("/api/record/start", { method: "POST", body: JSON.stringify({ title }) }).then((x) => x.json());
    if (r.error) return alert(r.error);
    recording = true;
    recBtn.textContent = "■ Stop";
    recBtn.classList.add("recording");
    renderLive(title);
  } else {
    recBtn.textContent = "… processing";
    recBtn.disabled = true;
    const liveNotes = $("#live-notes")?.value ?? "";
    const r = await fetch("/api/record/stop", { method: "POST" }).then((x) => x.json());
    if (r.meetingId && liveNotes.trim())
      await fetch("/api/notes", { method: "POST", body: JSON.stringify({ id: r.meetingId, notes: liveNotes }) });
    recording = false;
    recBtn.disabled = false;
    recBtn.textContent = "● Record";
    recBtn.classList.remove("recording");
    evtSource?.close();
    if (r.meetingId && r.exit !== "failed") { state.meetingId = r.meetingId; render(); }
    else { alert("Nothing was captured — check mic/screen-recording permissions."); render(); }
  }
});

function renderLive(title) {
  main.innerHTML = `<div class="doc"><h1>${NEEDLE}${esc(title)}</h1>
    <div class="sub"><span class="timer" id="rec-timer">00:00</span> · Recording — no bot in your call</div>
    <h2>My notes</h2>
    <textarea class="notes" id="live-notes" style="min-height:200px" placeholder="Type while you talk — Threadline is quietly capturing everything."></textarea>
    <h2>Live transcript</h2><div id="live-feed"><div class="empty">listening…</div></div>
    <details class="debug"><summary>Capture diagnostics</summary><div id="live-status"></div></details></div>`;
  const t0 = Date.now();
  const timerEl = $("#rec-timer");
  const timerIv = setInterval(() => {
    if (!document.body.contains(timerEl)) return clearInterval(timerIv);
    const s = Math.floor((Date.now() - t0) / 1000);
    timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);
  const feed = $("#live-feed"), statusBox = $("#live-status");
  const partials = {};
  evtSource = new EventSource("/api/record/events");
  evtSource.onmessage = (ev) => {
    const e = JSON.parse(ev.data);
    if (e.type === "status") {
      statusBox.insertAdjacentHTML("beforeend", `<div class="live-status">${esc(e.message)}</div>`);
    } else if (e.type === "partial") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      let el = partials[e.speaker];
      if (!el) {
        feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}" id="p-${e.speaker}"><div class="who">${e.speaker}</div><div class="live-partial"></div></div>`);
        el = partials[e.speaker] = feed.lastElementChild;
      }
      el.querySelector(".live-partial").textContent = e.text;
    } else if (e.type === "final") {
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      const el = partials[e.speaker];
      if (el) { delete partials[e.speaker]; el.remove(); }
      feed.insertAdjacentHTML("beforeend", `<div class="utt ${e.speaker === "You" ? "live-you" : ""}"><div class="ts">${fmtTs(e.offsetS)}</div><div class="who">${e.speaker}</div><div>${esc(e.text)}</div></div>`);
      window.scrollTo(0, document.body.scrollHeight);
    }
  };
}

let searchTimer;
$("#search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) return render();
  searchTimer = setTimeout(async () => {
    const hits = await api(`/api/search?q=${encodeURIComponent(q)}`);
    main.innerHTML = `<h1>“${esc(q)}”</h1><div class="sub">${hits.length} meeting${hits.length === 1 ? "" : "s"} matched</div>
      <div class="card">${hits.length ? `<div class="threaded">` + hits.map((h) => `
        <div class="m-row" data-mid="${h.id}">
          <div class="m-date">${fmtDate(h.started_at)}</div>
          <div><div class="m-title">${esc(h.title)}</div><div class="t-meta">${h.hit}</div></div>
        </div>`).join("") + `</div>` : `<div class="empty">No matches — it searches every word of every meeting.</div>`}</div>`;
    wireMeetingLinks();
  }, 250);
});

render();
