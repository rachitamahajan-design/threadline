<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Call — Threadline demo</title>
<style>
  * { margin:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:40px 20px;
    background-color:#181512;
    background-image:radial-gradient(900px 600px at 20% 0%, rgba(147,164,242,.10), transparent 60%),
                     radial-gradient(800px 600px at 85% 100%, rgba(230,185,94,.08), transparent 60%);
    color:#f1ece4; font:16px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; text-align:center;
  }
  .stage { max-width:560px; }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#8b8175; }
  .orb { position:relative; width:220px; height:220px; margin:34px auto 20px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .ring { position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(147,164,242,.45); opacity:0; transform:scale(1); pointer-events:none; }
  img.face {
    position:absolute; inset:10px; width:200px; height:200px; border-radius:50%; object-fit:cover;
    border:1px solid rgba(255,246,235,.18);
    box-shadow:0 30px 80px rgb(0 0 0 / .55), 0 0 60px rgb(147 164 242 / .12);
    transition:box-shadow .18s ease; will-change:transform;
  }
  .orb.playing img.face { box-shadow:0 30px 80px rgb(0 0 0 / .55), 0 0 90px rgb(147 164 242 / .34); }
  .orb .hintplay {
    position:absolute; inset:10px; border-radius:50%; display:grid; place-items:center;
    background:rgb(0 0 0 / .34); opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .orb:hover .hintplay { opacity:1; }
  .orb.playing .hintplay { opacity:0; }
  .hintplay svg { width:52px; height:52px; fill:#f1ece4; filter:drop-shadow(0 2px 8px rgb(0 0 0 / .6)); }
  h1 { font-family:ui-serif,'New York',Georgia,serif; font-size:38px; font-weight:600; letter-spacing:-0.02em; }
  .sub { color:#b4aa9c; margin:8px 0 6px; }
  .sub b { color:#e6b95e; font-weight:600; }
  .state { font-size:13px; color:#8b8175; min-height:20px; font-variant-numeric:tabular-nums; }
  .hint { margin-top:26px; font-size:13.5px; color:#8b8175; }
  .hint .kbd { font:600 12px ui-monospace,Menlo,monospace; border:1px solid rgba(255,246,235,.22); border-radius:6px; padding:2px 8px; color:#b4aa9c; }
  a.back { display:inline-block; margin-top:30px; color:#93a4f2; text-decoration:none; font-size:14px; }
  a.back:hover { text-decoration:underline; }
  @media (prefers-reduced-motion: reduce) { .ring { display:none; } }
</style>
</head>

  <h1>Melon Tusk</h1>
  <div class="sub">Live from the <b>Mars Program</b> · 33s sample call</div>
  <div class="state" id="state">tap the face to start the call</div>
  <div class="hint">Play, then double-tap <span class="kbd">fn</span> — Threadline hears the room, no bot required.</div>

<audio id="a" src="/demo-call.mp3" preload="auto"></audio>
<script>
(function () {
  var a = document.getElementById('a'), orb = document.getElementById('orb'),
      face = document.getElementById('face'), state = document.getElementById('state');
  var rings = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
  var ctx = null, analyser = null, data = null, raf = 0, ringT = [0, 0.33, 0.66];

  function ensureGraph() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      var src = ctx.createMediaElementSource(a);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.75;
      src.connect(analyser); analyser.connect(ctx.destination);
      data = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { ctx = null; }
  }

  // heartbeat: the face swells with the actual loudness of the voice,
  // rings ripple outward while audio plays
  function frame() {
    var level = 0.5;
    if (analyser) {
      analyser.getByteFrequencyData(data);
      var sum = 0, n = Math.min(48, data.length);   // voice band
      for (var i = 2; i < n; i++) sum += data[i];
      level = sum / (n - 2) / 255;                   // 0..1
    }
    var s = 1 + level * 0.16;
    face.style.transform = 'scale(' + s.toFixed(3) + ')';
    for (var j = 0; j < rings.length; j++) {
      ringT[j] += 0.008 + level * 0.012;
      if (ringT[j] > 1) ringT[j] -= 1;
      var t = ringT[j];
      rings[j].style.transform = 'scale(' + (1 + t * 0.55) + ')';
      rings[j].style.opacity = String((1 - t) * (0.28 + level * 0.5));
    }
    state.textContent = fmt(a.currentTime) + ' / ' + fmt(a.duration || 33) + ' — click to pause';
    raf = requestAnimationFrame(frame);
  }
  function fmt(t) { t = Math.floor(t || 0); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
  function still() {
    cancelAnimationFrame(raf);
    face.style.transform = 'scale(1)';
    rings.forEach(function (r) { r.style.opacity = '0'; });
  }
  function toggle() {
    if (a.paused) {
      ensureGraph();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      a.play();
    } else a.pause();
  }
  a.addEventListener('play', function () { orb.classList.add('playing'); raf = requestAnimationFrame(frame); });
  a.addEventListener('pause', function () { orb.classList.remove('playing'); still(); state.textContent = 'paused — click the face to resume'; });
  a.addEventListener('ended', function () { orb.classList.remove('playing'); still(); a.currentTime = 0; state.textContent = 'call ended — click to replay'; });
  orb.addEventListener('click', toggle);
  orb.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
})();
</script>
